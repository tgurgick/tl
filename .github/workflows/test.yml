name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: npm test
      - name: Check patch whitespace
        run: git diff --check
      - name: Check JavaScript syntax
        shell: bash
        run: |
          for file in bin/*.js lib/*.js ui/server.js; do
            node --check "$file"
          done
