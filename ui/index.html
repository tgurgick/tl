<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Throughline</title>
<link rel="icon" href="/logo.png">
<style>
/* ── tokens: Resume = warm journal (light) · Live Look = mission control (dark) ── */
:root {
  --bg: #faf8f3;
  --surface: #f3f0e8;
  --surface2: #ede9de;
  --line: rgba(0,0,0,.09);
  --line2: rgba(0,0,0,.14);
  --ink: #1c1916;
  --mid: #4a4540;
  --dim: #8a8070;
  --faint: #c9c2b4;
  --accent: #b5712a;
  --accent-bg: #fdf3e3;
  --accent-line: rgba(181,113,42,.22);
  --ok: #3a7d55;
  --warn: #c0622a;
  --bad: #a83232;
  --info: #6b57c7;
  --serif: 'Iowan Old Style', 'Palatino', Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
.agent {
  --bg: #1c1916;
  --surface: #26211c;
  --surface2: #211d18;
  --line: rgba(255,255,255,.07);
  --line2: rgba(255,255,255,.13);
  --ink: #e8e3d8;
  --mid: #a89f8d;
  --dim: #8a8070;
  --faint: #5c554a;
  --accent: #e2a55e;
  --accent-bg: rgba(226,165,94,.12);
  --accent-line: rgba(226,165,94,.30);
  --ok: #6fae84;
  --warn: #d4895f;
  --bad: #d96a5a;
  --info: #9b8cf0;
  background: var(--bg); color: var(--ink);
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }

/* three modes: human · split · agent */
.stage { display: flex; height: calc(100vh - 49px); }
.pane { min-width: 0; }
.human { overflow-y: auto; }
.agent { display: flex; flex-direction: column; overflow: hidden; }
body.m-human .agent, body.m-agent .human { display: none; }
body.m-human .human, body.m-agent .agent { flex: 1 1 100%; }
body.m-split .human { flex: 0 0 384px; border-right: 1px solid var(--line2); }
body.m-split .agent { flex: 1 1 auto; }
body.m-split .paper { max-width: none; padding: 28px 22px 60px; }
body.m-split .hero { margin-right: -22px; border-top-right-radius: 0; border-bottom-right-radius: 0; }
@media (max-width: 1000px) { body.m-split .human { flex-basis: 320px; } }
.mono { font-family: var(--mono); }

@keyframes tl-pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
@keyframes tl-blink { 0%,100% { opacity: 1 } 50% { opacity: 0 } }
@keyframes tl-flash { 0% { background: rgba(245,158,11,.18) } 100% { background: transparent } }

/* ── top bar ── */
.bar {
  position: sticky; top: 0; z-index: 20; height: 49px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 94%, transparent);
  backdrop-filter: blur(8px);
}
.bar .tab[data-view="split"] .live-dot { display: none; }
.bar .word { display: flex; align-items: center; gap: 10px; font-family: var(--mono); }
.bar .tlmark { font-size: .78rem; color: var(--ink); letter-spacing: -.01em; }
.bar .sep { color: var(--faint); }
.bar .proj {
  font-size: .7rem; color: var(--dim); background: none; border: none;
  font-family: var(--mono); cursor: pointer; padding: 4px 2px;
}
.bar .proj:hover { color: var(--ink); }
.bar nav { display: flex; gap: 2px; }
.bar .tab {
  font-family: var(--mono); font-size: .68rem; letter-spacing: .02em;
  color: var(--dim); background: transparent; border: none; border-radius: 3px;
  padding: 5px 12px; cursor: pointer; display: flex; align-items: center; gap: 6px;
}
.bar .tab:hover { color: var(--ink); }
.bar .tab.active { color: var(--ink); background: rgba(127,127,127,.12); }
.bar .tab .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #34d399; opacity: .35; }
.bar .tab.active .live-dot { opacity: 1; animation: tl-pulse 2s infinite; }
.bar .tab .dotn { display: none; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }
.bar .tab.unseen .dotn { display: inline-block; }

/* project picker */
.msel { position: relative; }
.msel-panel {
  position: absolute; left: 0; top: calc(100% + 8px); z-index: 30;
  background: var(--bg); border: 1px solid var(--line2); border-radius: 4px;
  padding: 6px; min-width: 210px; display: none;
  box-shadow: 0 10px 30px rgba(0,0,0,.18);
}
.msel.open .msel-panel { display: block; }
.msel-item {
  display: flex; align-items: center; gap: 9px; padding: 7px 10px;
  border-radius: 3px; font-family: var(--mono); font-size: .7rem; cursor: pointer; color: var(--mid);
}
.msel-item:hover { background: var(--surface); }
.msel-item input { accent-color: var(--accent); }
.msel-item .ex { color: var(--faint); margin-left: auto; }

.label {
  font-family: var(--mono); font-size: .62rem; letter-spacing: .12em;
  text-transform: uppercase; color: var(--dim);
}

/* ════ RESUME (boarding pass) ════ */
#view-resume { min-height: calc(100vh - 49px); }
.datestrip { border-bottom: 1px solid var(--line); background: var(--surface); }
.datestrip > div {
  max-width: 40rem; margin: 0 auto; padding: 8px 24px;
  display: flex; justify-content: space-between;
  font-family: var(--mono); font-size: .65rem; color: var(--dim);
}
.paper { max-width: 40rem; margin: 0 auto; padding: 32px 24px 70px; }
.res-block + .res-block { margin-top: 2.6rem; padding-top: 2rem; border-top: 1px solid var(--line); }
.res-ws { font-family: var(--mono); font-size: .6rem; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin: 0 0 12px; }

.bp-status { font-family: var(--mono); font-size: .72rem; color: var(--mid); margin: 0 0 7px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.bp-status:hover { color: var(--ink); }
.bp-status .gl { color: var(--ok); }
.bp-status .ar { color: var(--faint); transition: transform .12s; display: inline-block; }
.bp-status.open .ar { transform: rotate(90deg); }

.bp-goal { font-family: var(--serif); font-size: .98rem; color: var(--ink); line-height: 1.4; margin: 0 0 26px; }
.bp-goal .gtext { border-bottom: 1px dashed transparent; cursor: text; }
.bp-goal .gtext:hover { border-bottom-color: var(--line2); }
.bp-goal .gmeta { font-family: var(--mono); font-size: .68rem; color: var(--dim); white-space: nowrap; }
.bp-goal .gmeta .wt { cursor: text; border-bottom: 1px dashed transparent; }
.bp-goal .gmeta .wt:hover { border-bottom-color: var(--line2); }
.bp-goal .gmeta .ed { color: var(--accent); cursor: pointer; }
.bp-goal input { font-family: inherit; font-size: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--accent-line); border-radius: 3px; padding: 3px 7px; }
.scope-ex { margin-bottom: 22px; }
.scope { padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; }
.scope .sl { display: block; font-family: var(--mono); font-size: .58rem; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin: 12px 0 5px; }
.scope .sl:first-of-type { margin-top: 4px; }
.scope input { width: 100%; font-family: var(--sans); font-size: .82rem; background: var(--card); border: 1px solid var(--line2); border-radius: 3px; padding: 6px 9px; color: var(--ink); margin-bottom: 5px; }
.scope input.s-wt { width: 80px; }
.scope-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
.scope-actions button { font-family: var(--mono); font-size: .62rem; border-radius: 3px; padding: 5px 13px; cursor: pointer; }
.scope-actions .s-cancel { background: transparent; border: 1px solid var(--line2); color: var(--dim); }
.scope-actions .s-save { background: var(--accent); border: 1px solid var(--accent); color: #fffefb; }

.hero { background: #1c1916; border: 1px solid rgba(181,113,42,.22); border-left: 3px solid #b5712a; border-radius: 2px; padding: 1.4rem 1.6rem; cursor: pointer; transition: background .12s; }
.hero.flat { cursor: default; }
.hero:not(.flat):hover { background: #211d19; }
.hero .head { display: flex; justify-content: space-between; gap: 16px; margin-bottom: .6rem; }
.hero .fl { font-family: var(--mono); font-size: .62rem; letter-spacing: .12em; text-transform: uppercase; color: #e2a55e; }
.hero .chip { font-family: var(--mono); font-size: .62rem; color: #e2a55e; background: rgba(226,165,94,.12); padding: 2px 8px; border-radius: 2px; white-space: nowrap; }
.hero .chip.clear { color: #8fc7a0; background: rgba(58,125,85,.2); }
.hero .summary { font-family: var(--serif); font-size: 1.12rem; line-height: 1.45; color: #f5f1e8; margin: 0 0 .5rem; }
.hero .reason { font-size: .8rem; color: #a89f8d; margin: 0; }
.hero .hint { font-family: var(--mono); font-size: .56rem; letter-spacing: .04em; color: #6f655a; margin-top: .9rem; text-align: right; }
.hero-body { margin-top: 1.2rem; padding-top: 1.1rem; border-top: 1px solid rgba(245,241,232,.12); display: none; }
.hero.open .hero-body { display: block; }
.hero-body .md { color: #cfc8bb; font-size: .8rem; }
.hero-body .md h1, .hero-body .md h2, .hero-body .md h3 { color: #e2a55e; }
.hero-body .md code { background: rgba(255,255,255,.08); color: #d8d2c6; }
.hero-body .md pre { background: rgba(0,0,0,.3); }
.hero-body .md a { color: #c4b59a; }
.hero-body .md input[type=checkbox] { accent-color: #b5712a; }
.hero-fb { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(245,241,232,.1); }
.hero-fb .fb-flag { font-family: var(--mono); font-size: .6rem; color: #c8916f; background: transparent; border: 1px solid rgba(192,98,42,.45); border-radius: 3px; padding: 4px 11px; cursor: pointer; }
.hero-fb .fb-flag:hover { color: #e2a55e; border-color: rgba(226,165,94,.55); }
.hero-fb textarea { width: 100%; background: rgba(0,0,0,.28); border: 1px solid rgba(245,241,232,.15); border-radius: 4px; color: #e6e6ea; font-family: var(--sans); font-size: .82rem; line-height: 1.45; padding: 8px 11px; min-height: 58px; resize: vertical; }
.hero-fb .fb-actions { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.hero-fb .fb-hint { flex: 1; font-family: var(--mono); font-size: .56rem; color: #8a7f70; }
.hero-fb .fb-actions button { font-family: var(--mono); font-size: .6rem; border-radius: 3px; padding: 5px 12px; cursor: pointer; }
.hero-fb .fb-cancel { background: transparent; border: 1px solid rgba(245,241,232,.18); color: #a89f8d; }
.hero-fb .fb-save { background: #e2a55e; border: none; color: #1c1916; }
.hero-fb .fb-done { font-family: var(--mono); font-size: .62rem; color: #8fc7a0; padding: 6px 0; line-height: 1.5; }

.bp-loops { display: flex; align-items: center; gap: 10px; padding: 14px 2px 13px; border-bottom: 1px solid var(--line); margin-top: 8px; cursor: pointer; }
.bp-loops svg { flex: none; }
.bp-loops .lt { flex: 1; font-size: .82rem; color: var(--ink); }
.bp-loops .lt .tag { font-family: var(--mono); font-size: .6rem; margin-right: 6px; }
.bp-loops .ct { font-family: var(--mono); font-size: .62rem; color: var(--dim); white-space: nowrap; }

.bp-counts { display: flex; align-items: center; gap: 18px; padding: 16px 2px 0; font-family: var(--mono); font-size: .62rem; }
.bp-counts .ci { color: var(--dim); cursor: pointer; }
.bp-counts .ci.open, .bp-counts .ci:hover { color: var(--ink); }
.bp-counts .ci b { color: var(--mid); font-weight: 400; }
.bp-counts .cap { margin-left: auto; color: var(--dim); cursor: pointer; }
.bp-counts .cap:hover { color: var(--ink); }
.bp-counts input { font-family: var(--sans); font-size: .8rem; background: var(--card); border: 1px solid var(--accent-line); border-radius: 3px; padding: 4px 9px; width: 260px; }

/* horizon — forward timeline */
.horizon { padding: 4px 0 2px; }
.hz-lane { display: flex; align-items: center; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); }
.hz-label { flex: 0 0 116px; font-size: .72rem; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hz-label .pri { font-family: var(--mono); font-size: .56rem; color: var(--dim); margin-left: 5px; }
.hz-track { flex: 1; display: flex; align-items: stretch; gap: 3px; min-width: 0; }
.hz-now { flex: 0 0 0; align-self: stretch; border-left: 1px dashed var(--accent); margin: 1px 3px; }
.hz-block { flex: 1 1 0; min-width: 0; border-radius: 3px; padding: 5px 8px; font-family: var(--mono); font-size: .58rem; line-height: 1; display: flex; align-items: center; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hz-block.s-done { background: #3a7d55; color: #eafff2; }
.hz-block.s-progress { background: var(--accent); color: #fffefb; }
.hz-block.s-ready { border: 1px solid var(--accent); color: var(--accent); }
.hz-block.s-blocked { border: 1px dashed #c0622a; color: #c0622a; }
.hz-block.s-triage { border: 1px dashed var(--line2); color: var(--dim); }
.hz-legend { display: flex; gap: 14px; margin-top: 10px; font-family: var(--mono); font-size: .56rem; color: var(--dim); }
.hz-legend i { font-style: normal; }
.hz-empty { font-size: .78rem; color: var(--dim); padding: 8px 0; }

.expand { display: none; padding: 2px 0 6px; }
.expand.open { display: block; }
.loop-row { display: flex; align-items: flex-start; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.loop-row:hover { background: var(--surface); }
.loop-row svg, .loop-row .gly { flex: none; margin-top: 3px; }
.loop-row .txt { flex: 1; }
.loop-row .txt .t { font-size: .82rem; line-height: 1.4; color: var(--ink); }
.loop-row .txt .sub { font-family: var(--mono); font-size: .58rem; color: var(--dim); margin-top: 1px; }
.loop-row .age { font-family: var(--mono); font-size: .6rem; color: var(--dim); flex: none; }
.bl-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.bl-row .rank { font-family: var(--mono); font-size: .6rem; color: var(--faint); min-width: 14px; text-align: right; }
.bl-row .nm { flex: 1; min-width: 0; }
.bl-row .nm .t { font-family: var(--mono); font-size: .7rem; color: var(--ink); cursor: pointer; }
.bl-row .nm .t:hover { text-decoration: underline; }
.bl-row .nm .d { font-size: .68rem; color: var(--dim); }
.bl-row .st { font-family: var(--mono); font-size: .58rem; flex: none; }
.bl-row .pri { font-family: var(--mono); font-size: .6rem; flex: none; cursor: pointer; border: 1px solid var(--line2); border-radius: 3px; padding: 1px 6px; }
.bl-row .pri:hover { border-color: var(--accent); color: var(--accent); }
.bl-row select { font-family: var(--mono); font-size: .62rem; padding: 1px; }
.dec-row { display: flex; align-items: flex-start; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.dec-row:hover { background: var(--surface); }
.dec-row .txt { flex: 1; font-family: var(--serif); font-style: italic; font-size: .86rem; line-height: 1.5; }
.dec-row .age { font-family: var(--mono); font-size: .6rem; color: var(--dim); flex: none; }
.footnote { margin-top: 46px; text-align: center; font-family: var(--mono); font-size: .62rem; color: var(--faint); }
.empty { font-size: .78rem; color: var(--dim); padding: 8px 0; }

/* ════ LIVE LOOK (mission control) ════ */
#view-live { background: var(--bg); }
.lanes { display: flex; height: 42%; border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; }
.lane { flex: 1; min-width: 170px; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
.lane:last-child { border-right: none; }
.lane-head {
  display: flex; align-items: center; gap: 8px; padding: 9px 14px;
  border-bottom: 1px solid var(--line); background: var(--surface2); flex: none;
}
.lane-head .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.lane-head .nm { font-family: var(--mono); font-size: .62rem; letter-spacing: .1em; color: var(--dim); }
.lane-head .ct { margin-left: auto; font-family: var(--mono); font-size: .62rem; color: var(--faint); }
.lane-body { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; scrollbar-width: none; }
.lcard { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; cursor: pointer; }
.lcard:hover { border-color: var(--line2); }
.lcard.working { border-color: var(--accent-line); }
.lcard .t { font-size: .78rem; line-height: 1.4; color: var(--ink); }
.lcard .ws-tag { font-family: var(--mono); font-size: .55rem; color: var(--faint); display: block; margin-bottom: 3px; }
.lcard .meta { display: flex; justify-content: space-between; margin-top: 7px; font-family: var(--mono); font-size: .58rem; }
.lcard .agent { color: var(--accent); display: flex; align-items: center; gap: 4px; }
.lcard .elapsed { color: var(--dim); }
.lcard .done-tag { color: rgba(111,174,132,.6); font-family: var(--mono); font-size: .58rem; display: block; margin-top: 6px; }
.lcard .pbar { height: 2px; background: rgba(255,255,255,.06); border-radius: 2px; overflow: hidden; margin-top: 8px; }
.lcard .pbar i { display: block; height: 100%; width: 40%; border-radius: 2px;
  background: linear-gradient(90deg, rgba(226,165,94,.4), var(--accent)); animation: tl-slide 2.2s ease-in-out infinite; }
@keyframes tl-slide { 0% { margin-left: -40% } 100% { margin-left: 100% } }

.deck { display: flex; flex: 1; min-height: 0; }
.panel-head {
  display: flex; align-items: center; gap: 8px; padding: 7px 12px;
  border-bottom: 1px solid var(--line); background: var(--surface2); flex: none;
  font-family: var(--mono); font-size: .58rem; letter-spacing: .1em; color: var(--dim);
}
.pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); animation: tl-pulse 2s infinite; }
.pulse.off { background: var(--bad); animation: none; }

/* files panel */
.fpane { width: 210px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
.fpane .body { flex: 1; overflow-y: auto; padding: 8px; scrollbar-width: none; }
.tn { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left;
  background: none; border: none; padding: 2px 4px; border-radius: 3px;
  font-family: var(--mono); font-size: .67rem; color: var(--dim); cursor: pointer; }
.tn:hover { background: rgba(127,127,127,.08); }
.tn .arr { width: 9px; flex: none; color: var(--faint); font-size: .55rem; transition: transform .12s; }
.tn.x .arr { transform: rotate(90deg); }
.tn.dirn { color: var(--dim); }
.tn.rootn { color: var(--mid); }
.tn .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tn.active { background: rgba(226,165,94,.20); }
.tn.active .nm { color: #f3eee3; }
.tn.h1 { background: rgba(226,165,94,.07); }
.tn.h2 { background: rgba(226,165,94,.14); }
.tn.h3 { background: rgba(226,165,94,.24); }
.tn .delta { font-size: .58rem; flex: none; color: var(--accent); }
.tn .delta.new { color: var(--ok); }
.tn.flash { animation: tl-flash 1.2s ease-out; }
.tkids { padding-left: 13px; }

/* activity panel */
.apane { width: 300px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
.apane .body { flex: 1; overflow-y: auto; padding: 10px 12px; scrollbar-width: thin; }
.log-line { display: flex; align-items: baseline; gap: 8px; padding: 1px 0; }
.log-line.old { opacity: .28; }
.log-line .t { font-family: var(--mono); font-size: .62rem; color: var(--faint); flex: none; min-width: 50px; }
.log-line .v { font-family: var(--mono); font-size: .62rem; flex: none; min-width: 50px; }
.log-line .m { font-family: var(--mono); font-size: .62rem; color: var(--mid); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log-line .m .d { color: var(--faint); }
.cursor { color: var(--accent); animation: tl-blink 1.1s step-end infinite; font-family: var(--mono); font-size: .62rem; }

/* file viewer */
.vpane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.vpane .crumb { font-family: var(--mono); font-size: .62rem; color: var(--faint); letter-spacing: 0; text-transform: none; }
.vpane .crumb b { color: #cfc8ba; font-weight: 400; }
.vpane .writing { margin-left: auto; display: flex; align-items: center; gap: 5px; color: var(--ok); font-size: .58rem; letter-spacing: 0; }
.vpane .body { flex: 1; overflow: auto; scrollbar-width: thin; }
.code { border-collapse: collapse; width: 100%; }
.code td { font-family: var(--mono); font-size: .68rem; line-height: 1.6; vertical-align: top; }
.code .ln { width: 38px; text-align: right; padding: 0 14px 0 10px; color: var(--faint); user-select: none; }
.code .cl { white-space: pre; padding-right: 24px; color: #cfc8ba; }
.code tr.added { background: rgba(111,174,132,.07); }
.code tr.added .ln { color: var(--ok); }
.kw { color: var(--accent); }
.str { color: var(--ok); }
.cmt { color: var(--faint); }
.vpane .empty-state { padding: 30px; font-family: var(--mono); font-size: .65rem; color: var(--faint); }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(10,9,8,.35); opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 40; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 92vw); z-index: 41;
  background: var(--bg); border-left: 1px solid var(--line2);
  transform: translateX(102%); transition: transform .22s cubic-bezier(.3,.8,.3,1);
  overflow-y: auto; padding: 30px 34px 60px;
}
.open .scrim { opacity: 1; pointer-events: auto; }
.open .drawer { transform: none; }
.drawer .path { font-family: var(--mono); font-size: .62rem; color: var(--faint); margin-bottom: 10px; }
.drawer h2 { font-family: var(--serif); font-size: 1.25rem; font-weight: 500; margin-bottom: 14px; }
.drawer .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 24px; }
.pill {
  font-family: var(--mono); font-size: .6rem; letter-spacing: .03em; color: var(--dim);
  border: 1px solid var(--line2); border-radius: 2px; padding: 2px 8px;
}
.pill.p0 { color: var(--bad); border-color: var(--bad); }
.pill.p1 { color: var(--warn); border-color: var(--warn); }
.pill.q { color: var(--info); border-color: var(--info); }
.md { font-size: .9rem; }
.md h1, .md h2, .md h3 { font-family: var(--mono); font-size: .62rem; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin: 24px 0 10px; }
.md p { margin: 0 0 12px; }
.md ul { margin: 0 0 12px; padding-left: 20px; }
.md li { margin-bottom: 4px; }
.md code { font-family: var(--mono); font-size: .75rem; background: var(--surface); border-radius: 3px; padding: 1.5px 5px; }
.md pre { background: var(--surface); border-radius: 4px; padding: 14px 16px; overflow-x: auto; margin: 0 0 12px; }
.md pre code { background: none; padding: 0; }
.md table { border-collapse: collapse; margin: 0 0 14px; width: 100%; font-size: .8rem; }
.md th { text-align: left; font-weight: 500; color: var(--dim); }
.md th, .md td { border-bottom: 1px solid var(--line); padding: 6px 10px 6px 0; }
.md blockquote { border-left: 2px solid var(--line2); padding-left: 14px; color: var(--mid); margin: 0 0 12px; }
.md input[type=checkbox] { accent-color: var(--accent); margin-right: 6px; }
</style>
</head>
<body class="m-human">
<header class="bar">
  <div class="word">
    <span class="tlmark">tl</span>
    <span class="sep">·</span>
    <div class="msel" id="msel">
      <button class="proj" id="wsBtn">projects</button>
      <div class="msel-panel" id="wsPanel"></div>
    </div>
  </div>
  <nav>
    <button class="tab active" data-view="human">Human</button>
    <button class="tab" data-view="split">Split</button>
    <button class="tab" data-view="agent" id="liveTab"><span class="live-dot"></span>Agent<span class="dotn"></span></button>
  </nav>
</header>

<div class="stage">
<section id="view-resume" class="pane human">
  <div class="datestrip"><div><span id="dsProj"></span><span id="dsDate"></span></div></div>
  <div class="paper" id="paper"></div>
</section>

<section id="view-live" class="pane agent">
  <div class="lanes" id="lanes"></div>
  <div class="deck">
    <div class="fpane">
      <div class="panel-head">FILES</div>
      <div class="body" id="tree"></div>
    </div>
    <div class="apane">
      <div class="panel-head">ACTIVITY <span class="pulse off" id="termDot"></span></div>
      <div class="body" id="feed"><div class="log-line"><span class="t"></span><span class="cursor">▊</span></div></div>
    </div>
    <div class="vpane">
      <div class="panel-head" id="crumb"><span class="crumb">no file selected</span></div>
      <div class="body" id="viewer"><div class="empty-state">waiting for an agent to touch a file…</div></div>
    </div>
  </div>
</section>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Detail"></aside>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PRIO = { p0: 0, p1: 1, p2: 2, p3: 3 };
const rel = ts => {
  if (!ts) return '';
  const s = (Date.now() - ts) / 1000;
  if (s < 90) return 'now';
  if (s < 5400) return Math.round(s / 60) + 'm';
  if (s < 129600) return Math.round(s / 3600) + 'h';
  return Math.round(s / 86400) + 'd';
};

/* icons (lucide outlines, inlined) */
const IC = {
  question: c => `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>`,
  ban: c => `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></svg>`,
  chat: c => `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`,
  risk: c => `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>`,
  check: c => `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>`,
  archive: c => `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg>`,
  arrow: c => `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>`,
};

/* ── markdown (drawer) ── */
function inline(s) {
  return s
    .replace(/`([^`]+)`/g, (_, c) => '<code>' + c + '</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src) {
  const lines = esc(src).split('\n');
  let html = '', i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) {
      let code = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
      i++; html += '<pre><code>' + code.join('\n') + '</code></pre>';
    } else if (/^#{1,4}\s/.test(l)) {
      const lv = Math.min(l.match(/^#+/)[0].length, 3);
      html += `<h${lv}>` + inline(l.replace(/^#+\s*/, '')) + `</h${lv}>`; i++;
    } else if (/^\s*[-*]\s/.test(l)) {
      let items = [];
      while (i < lines.length && /^\s*[-*]\s/.test(lines[i])) {
        let it = lines[i].replace(/^\s*[-*]\s/, '');
        it = it.replace(/^\[([ xX])\]\s*/, (_, c) => `<input type="checkbox" disabled${c.trim() ? ' checked' : ''}>`);
        items.push('<li>' + inline(it) + '</li>'); i++;
      }
      html += '<ul>' + items.join('') + '</ul>';
    } else if (/^\|/.test(l)) {
      let rows = [];
      while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i]); i++; }
      const cells = r => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      let t = '<table>';
      rows.forEach((r, idx) => {
        if (/^\|[\s:|-]+\|$/.test(r)) return;
        const tag = idx === 0 ? 'th' : 'td';
        t += '<tr>' + cells(r).map(c => `<${tag}>` + inline(c) + `</${tag}>`).join('') + '</tr>';
      });
      html += t + '</table>';
    } else if (/^>\s?/.test(l)) {
      let q = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) { q.push(lines[i].replace(/^>\s?/, '')); i++; }
      html += '<blockquote>' + inline(q.join(' ')) + '</blockquote>';
    } else if (/^---+\s*$/.test(l)) { html += '<hr>'; i++; }
    else if (!l.trim()) { i++; }
    else {
      let p = [];
      while (i < lines.length && lines[i].trim() && !/^(#|```|\||>|---|\s*[-*]\s)/.test(lines[i])) { p.push(lines[i]); i++; }
      html += '<p>' + inline(p.join(' ')) + '</p>';
    }
  }
  return html;
}

/* ── drawer ── */
function openDrawer(item) {
  const meta = item.meta || {};
  let pills = '';
  const p = (meta.priority || '').toLowerCase();
  if (p) pills += `<span class="pill ${p}">${esc(p.toUpperCase())}</span>`;
  for (const k of ['type', 'size', 'status']) if (meta[k]) pills += `<span class="pill">${esc(String(meta[k]).replace('_',' '))}</span>`;
  if (meta.origin) pills += `<span class="pill">from ${esc(meta.origin)}</span>`;
  if (item._ws) pills += `<span class="pill">${esc(item._ws)}</span>`;
  const body = (item.body || '').replace(/^\s*# .*\n+/, '');
  $('drawer').innerHTML = `
    <div class="path">${esc(item.path || '')}</div>
    <h2>${esc(item.title)}</h2>
    <div class="meta">${pills}</div>
    <div class="md">${md(body)}</div>`;
  document.body.classList.add('open');
}
$('scrim').onclick = () => document.body.classList.remove('open');
addEventListener('keydown', e => { if (e.key === 'Escape') document.body.classList.remove('open'); });

/* ════ RESUME ════ */
function loopIcon(kind) {
  if (kind === 'question') return IC.question('#6b57c7');
  if (kind === 'risk') return IC.risk('#a83232');
  if (kind === 'blocked') return IC.ban('#c0622a');
  return IC.chat('#c0622a');
}

const LOOP = {
  risk:     { c: '#a83232', sev: 0, ic: IC.risk },
  question: { c: '#6b57c7', sev: 1, ic: IC.question },
  blocked:  { c: '#c0622a', sev: 2, ic: IC.ban },
  feedback: { c: '#c0622a', sev: 3, ic: IC.chat },
  decision: { c: '#6b57c7', sev: 4, ic: IC.chat },
};
async function postJSON(p, body) {
  const r = await fetch(p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) { let e = {}; try { e = await r.json(); } catch {} throw new Error(e.error || ('HTTP ' + r.status)); }
  return r.json();
}
const specFileOf = item => { const p = item.path || ''; return p.endsWith('/') ? p + 'SPEC.md' : p; };

function addHeroFeedback(hb, wsName, item) {
  let fb = hb.querySelector('.hero-fb');
  if (!fb) { fb = document.createElement('div'); fb.className = 'hero-fb'; hb.appendChild(fb); }
  const showFlag = () => {
    fb.innerHTML = `<button class="fb-flag">⚑ something’s wrong — revise this</button>`;
    fb.querySelector('.fb-flag').onclick = showForm;
  };
  const showForm = () => {
    fb.innerHTML = `<textarea class="fb-text" placeholder="what's wrong here, or what should change?"></textarea>
      <div class="fb-actions"><span class="fb-hint">captured as an open loop · copied as a Claude handoff</span><button class="fb-cancel">cancel</button><button class="fb-save">capture + copy handoff →</button></div>`;
    const ta = fb.querySelector('.fb-text'); ta.focus();
    fb.querySelector('.fb-cancel').onclick = showFlag;
    fb.querySelector('.fb-save').onclick = async () => {
      const t = ta.value.trim(); if (!t) { ta.focus(); return; }
      const slug = (item.path || '').replace(/\/$/, '').split('/').pop().replace(/\.md$/, '');
      try { await postJSON('/api/capture', { ws: wsName, text: t, type: 'risk', status: 'open', linked_spec: item.path, origin: 'feedback on in-focus: ' + slug }); }
      catch (e) { alert(e.message); return; }
      let copied = false;
      try { await navigator.clipboard.writeText(`In project ${wsName}, revise ${specFileOf(item)} — feedback: ${t}`); copied = true; } catch {}
      fb.innerHTML = `<div class="fb-done">✓ captured as an open loop${copied ? ' · handoff copied — paste into Claude to revise' : ''}</div>`;
      setTimeout(loadSelected, 1700);
    };
  };
  showFlag();
}

function renderResume(wss) {
  $('dsProj').textContent = wss.map(w => w.name).join(' · ');
  $('dsDate').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  const paper = $('paper');
  paper.innerHTML = '';
  const multi = wss.length > 1;

  for (const ws of wss) {
    const block = document.createElement('div');
    block.className = 'res-block';
    if (multi) block.innerHTML = `<div class="res-ws">${esc(ws.name)}</div>`;

    const specs = ws.specs.map(s => ({ ...s, _ws: ws.name }));
    const threads = (ws.threads || []).map(t => ({ ...t, _ws: ws.name }));
    const goals = (ws.config && ws.config.goals) || [];
    const top = goals.slice().sort((a, b) => (b.weight || 0) - (a.weight || 0))[0];
    const done = specs.filter(s => s.stage === 'done').sort((a, b) => b.mtime - a.mtime);
    const inprog = specs.filter(s => s.stage === 'in-progress');
    const ready = specs.filter(s => s.stage === 'ready').sort((a, b) => (PRIO[a.meta.priority] ?? 9) - (PRIO[b.meta.priority] ?? 9));
    const triage = specs.filter(s => s.stage === 'triage');

    // ── status line (expand → completions + in-progress) ──
    const status = document.createElement('p');
    status.className = 'bp-status';
    const lastDone = done[0];
    status.innerHTML = `<span class="gl">✓</span> ${done.length} done${inprog.length ? ' · ' + inprog.length + ' in progress' : ''}${lastDone ? ' · last ' + rel(lastDone.mtime) : ''} <span class="ar">›</span>`;
    const statusEx = document.createElement('div'); statusEx.className = 'expand';
    [...inprog.map(s => ({ s, k: '▸', c: '#6b57c7' })), ...done.slice(0, 10).map(s => ({ s, k: '✓', c: '#3a7d55' }))].forEach(({ s, k, c }) => {
      const r = document.createElement('div'); r.className = 'loop-row';
      r.innerHTML = `<span class="gly mono" style="font-size:.62rem;color:${c}">${k}</span><div class="txt"><div class="t">${esc(s.title)}</div></div><span class="age">${rel(s.mtime)}</span>`;
      r.onclick = () => openDrawer(s); statusEx.appendChild(r);
    });
    if (!inprog.length && !done.length) statusEx.innerHTML = '<div class="empty">nothing completed yet</div>';
    status.onclick = () => { status.classList.toggle('open'); statusEx.classList.toggle('open'); };
    block.appendChild(status); block.appendChild(statusEx);

    // ── goal line + scope editor (description, weight, key results) ──
    const goalEl = document.createElement('p');
    goalEl.className = 'bp-goal';
    const scopeEx = document.createElement('div'); scopeEx.className = 'expand scope-ex';
    if (top) {
      const desc = top.description || top.id;
      const wRaw = String(top.weight ?? 0);
      const krs = top.key_results || [];
      const at = s => esc(s).replace(/"/g, '&quot;');
      goalEl.innerHTML = `<span class="gtext">${esc(desc)}</span><span class="gmeta">&nbsp; ${(top.weight ?? 0).toFixed(2)} · ${krs.length} KRs · <span class="ed">edit ›</span></span>`;
      const buildScope = () => {
        scopeEx.innerHTML = `<div class="scope">
            <p class="label" style="margin-bottom:4px">Edit scope → TRIAGE.yml</p>
            <span class="sl">Goal</span><input class="s-desc" value="${at(desc)}">
            <span class="sl">Weight</span><input class="s-wt" value="${at(wRaw)}">
            <span class="sl">Key results</span>${krs.map((k, i) => `<input class="s-kr" data-i="${i}" value="${at(k)}">`).join('') || '<div class="empty">none</div>'}
            <div class="scope-actions"><button class="s-cancel">cancel</button><button class="s-save">save →</button></div>
          </div>`;
        scopeEx.querySelector('.s-cancel').onclick = () => scopeEx.classList.remove('open');
        scopeEx.querySelector('.s-save').onclick = async () => {
          const nd = scopeEx.querySelector('.s-desc').value.trim();
          const nw = scopeEx.querySelector('.s-wt').value.trim();
          const nkr = [...scopeEx.querySelectorAll('.s-kr')].map(i => ({ i: +i.dataset.i, v: i.value.trim() }));
          try {
            if (nd && nd !== desc) await postJSON('/api/goal', { ws: ws.name, field: 'description', old: desc, new: nd });
            if (nw && nw !== wRaw) await postJSON('/api/goal', { ws: ws.name, field: 'weight', old: wRaw, new: nw });
            for (const k of nkr) { const ov = krs[k.i]; if (k.v && k.v !== ov) await postJSON('/api/goal', { ws: ws.name, field: 'kr', old: ov, new: k.v }); }
            loadSelected();
          } catch (e) { alert(e.message); loadSelected(); }
        };
      };
      const toggle = () => { if (!scopeEx.classList.contains('open')) buildScope(); scopeEx.classList.toggle('open'); };
      goalEl.querySelector('.gtext').onclick = toggle;
      goalEl.querySelector('.ed').onclick = toggle;
    } else {
      goalEl.innerHTML = `<span class="gmeta">No goal configured · edit TRIAGE.yml</span>`;
    }
    block.appendChild(goalEl); block.appendChild(scopeEx);

    // ── hero (in focus) ──
    const openQ = threads.find(t => t.meta.type === 'question' && t.meta.status === 'open');
    let next = null, kind = '';
    if (ready.length) { next = ready[0]; kind = 'spec'; }
    else if (openQ) { next = openQ; kind = 'question'; }

    const hero = document.createElement('div');
    hero.className = 'hero';
    if (next) {
      const slug = (next.path || '').replace(/\/$/, '').split('/').pop().replace(/\.md$/, '');
      const p = (next.meta.priority || '').toUpperCase();
      const chip = kind === 'spec' ? `${esc(slug)}${p ? ' · ' + esc(p) : ''}` : `${esc(slug)} · question`;
      const reason = kind === 'spec'
        ? `Needs you: top of the stack${next.meta.status === 'blocked' ? ', but blocked' : ', unblocked'} — read it, then delegate.`
        : `Needs you: an open question, upstream of new work.`;
      hero.innerHTML = `
        <div class="head"><span class="fl">In focus</span><span class="chip">${chip}</span></div>
        <p class="summary">${esc(next.title)}</p>
        <p class="reason">${reason}</p>
        <p class="hint">click to ${kind === 'spec' ? 'read the spec' : 'read the thread'} ↓</p>
        <div class="hero-body"><div class="md">loading…</div></div>`;
      let loaded = false;
      const hb = hero.querySelector('.hero-body');
      hb.onclick = e => e.stopPropagation();
      hero.onclick = async () => {
        hero.classList.toggle('open');
        hero.querySelector('.hint').textContent = hero.classList.contains('open') ? 'click to collapse ↑' : 'click to read ↓';
        if (hero.classList.contains('open') && !loaded) {
          loaded = true;
          try {
            const f = await (await fetch(`/api/file?ws=${encodeURIComponent(ws.name)}&path=${encodeURIComponent(specFileOf(next))}`)).json();
            const body = (f.content || '').replace(/^---\n[\s\S]*?\n---\n/, '').replace(/^\s*# .*\n+/, '');
            hb.querySelector('.md').innerHTML = md(body);
            addHeroFeedback(hb, ws.name, next);
          } catch { hb.querySelector('.md').textContent = 'could not load file'; }
        }
      };
    } else if (inprog.length) {
      hero.className = 'hero flat';
      hero.innerHTML = `
        <div class="head"><span class="fl">In focus</span><span class="chip clear">all clear</span></div>
        <p class="summary">${inprog.length} ${inprog.length > 1 ? 'agents are' : 'agent is'} working. Nothing needs you right now.</p>
        <p class="reason">${inprog.map(s => esc((s.path || '').replace(/\/$/, '').split('/').pop())).join(' · ')} in progress · no open questions blocking.</p>
        <p class="hint" style="cursor:pointer">watch in live look →</p>`;
      hero.querySelector('.hint').onclick = () => setMode('agent');
    } else {
      hero.className = 'hero flat';
      hero.innerHTML = `
        <div class="head"><span class="fl">In focus</span></div>
        <p class="summary">Queue is empty — decompose the next slice of an intent into a spec.</p>
        <p class="reason">Nothing ready, in progress, or unresolved. The intent → spec handoff is yours.</p>`;
    }
    block.appendChild(hero);

    // ── loops line (expand → all loops) ──
    const loops = [
      ...threads.filter(t => ['question', 'risk', 'decision'].includes(t.meta.type) && t.meta.status === 'open').map(t => ({ ...t, _k: t.meta.type })),
      ...specs.filter(s => s.meta.status === 'blocked').map(s => ({ ...s, _k: 'blocked' })),
      ...specs.filter(s => s.stage === 'done' && !s.feedback).map(s => ({ ...s, _k: 'feedback', title: s.title + ' — FEEDBACK.md not written' })),
    ].sort((a, b) => LOOP[a._k].sev - LOOP[b._k].sev);
    const loopsLine = document.createElement('div');
    loopsLine.className = 'bp-loops';
    const loopsEx = document.createElement('div'); loopsEx.className = 'expand';
    if (loops.length) {
      const t0 = loops[0], lm = LOOP[t0._k];
      loopsLine.innerHTML = `${lm.ic(lm.c)}<span class="lt"><span class="tag" style="color:${lm.c}">${t0._k.toUpperCase()}</span>${esc(t0.title)}</span><span class="ct">${loops.length} open loop${loops.length > 1 ? 's' : ''} ›</span>`;
      loops.forEach(l => {
        const m = LOOP[l._k];
        const r = document.createElement('div'); r.className = 'loop-row';
        const origin = l.meta && l.meta.origin ? ' · ' + l.meta.origin : '';
        r.innerHTML = `${m.ic(m.c)}<div class="txt"><div class="t">${esc(l.title)}</div><div class="sub">${l._k.toUpperCase()}${esc(origin)} · ${rel(l.mtime)}</div></div>`;
        r.onclick = () => openDrawer(l);
        loopsEx.appendChild(r);
      });
      loopsLine.onclick = () => loopsEx.classList.toggle('open');
    } else {
      loopsLine.innerHTML = `${IC.check('#3a7d55')}<span class="lt" style="color:var(--dim)">No open loops — nothing unresolved.</span>`;
      loopsLine.style.cursor = 'default';
    }
    block.appendChild(loopsLine); block.appendChild(loopsEx);

    // ── counts row (backlog / decisions / parked / capture) ──
    const stCol = { ready: '#3a7d55', blocked: '#c0622a', triage: '#8a8070' };
    const prCol = { p0: '#a83232', p1: '#c0622a', p2: '#6b57c7', p3: '#8a8070', '': '#8a8070' };
    const decs = threads.filter(t => t.meta.type === 'decision').sort((a, b) => b.mtime - a.mtime);
    const parked = threads.filter(t => t.meta.status === 'parked');
    const backlog = [...ready.map(s => ({ s, st: s.meta.status === 'blocked' ? 'blocked' : 'ready' })), ...triage.map(s => ({ s, st: 'triage' }))];
    const intentName = s => {
      const ip = (s.meta.intent || '').replace(/^\.\//, '').trim();
      const it = ws.intents.find(i => i.path === ip);
      return it ? it.title : '';
    };

    const counts = document.createElement('div'); counts.className = 'bp-counts';
    counts.innerHTML = `<span class="ci" data-x="hz">horizon</span><span class="ci" data-x="bl">backlog <b>${backlog.length}</b></span><span class="ci" data-x="dc">decisions <b>${decs.length}</b></span><span class="ci" data-x="pk">parked <b>${parked.length}</b></span><span class="cap">+ park a thought</span>`;
    const countsEx = document.createElement('div'); countsEx.className = 'expand';

    const builders = {
      hz: () => {
        countsEx.innerHTML = '';
        const unit = s => ({ small: 1, medium: 2, large: 3 }[s.meta.size] || 2);
        const stageCls = s => s.stage === 'done' ? 's-done'
          : s.stage === 'in-progress' ? 's-progress'
          : s.meta.status === 'blocked' ? 's-blocked'
          : s.stage === 'triage' ? 's-triage' : 's-ready';
        const ord = s => ({ done: 0, 'in-progress': 1, ready: 2, triage: 3 }[s.stage] ?? 2);
        const lanes = ws.intents.slice()
          .sort((a, b) => (PRIO[a.meta.priority] ?? 9) - (PRIO[b.meta.priority] ?? 9))
          .map(it => ({ label: it.title, pri: it.meta.priority, it, specs: specs.filter(s => (s.meta.intent || '').replace(/^\.\//, '').trim() === it.path) }));
        const attached = new Set(lanes.flatMap(l => l.specs.map(s => s.path)));
        const orphan = specs.filter(s => !attached.has(s.path));
        if (orphan.length) lanes.push({ label: 'Unattached', pri: '', it: null, specs: orphan });
        const active = lanes.filter(l => l.specs.length);
        if (!active.length) { countsEx.innerHTML = '<div class="hz-empty">no specs to chart yet</div>'; return; }
        const wrap = document.createElement('div'); wrap.className = 'horizon';
        active.forEach(l => {
          const lane = document.createElement('div'); lane.className = 'hz-lane';
          const lab = document.createElement('div'); lab.className = 'hz-label';
          lab.innerHTML = `${esc(l.label)}${l.pri ? ` <span class="pri">${esc(l.pri.toUpperCase())}</span>` : ''}`;
          if (l.it) { lab.style.cursor = 'pointer'; lab.onclick = () => openDrawer({ ...l.it, _ws: ws.name }); }
          const track = document.createElement('div'); track.className = 'hz-track';
          const sorted = l.specs.slice().sort((a, b) => ord(a) - ord(b) || (PRIO[a.meta.priority] ?? 9) - (PRIO[b.meta.priority] ?? 9));
          let nowMark = false;
          sorted.forEach(s => {
            if (!nowMark && ord(s) > 0) { const n = document.createElement('div'); n.className = 'hz-now'; track.appendChild(n); nowMark = true; }
            const b = document.createElement('div');
            b.className = 'hz-block ' + stageCls(s);
            b.style.flexGrow = unit(s);
            const slug = (s.path || '').replace(/\/$/, '').split('/').pop().replace(/\.md$/, '');
            b.textContent = slug;
            b.title = `${slug} · ${s.stage}${s.meta.size ? ' · ' + s.meta.size : ''}${s.meta.priority ? ' · ' + s.meta.priority.toUpperCase() : ''}`;
            b.onclick = () => openDrawer(s);
            track.appendChild(b);
          });
          lane.appendChild(lab); lane.appendChild(track);
          wrap.appendChild(lane);
        });
        wrap.insertAdjacentHTML('beforeend', `<div class="hz-legend"><i><span style="color:#3a7d55">█</span> done</i><i><span style="color:var(--accent)">█</span> in progress</i><i><span style="color:var(--accent)">▢</span> ready</i><i><span style="color:var(--dim)">▢</span> triage</i><i>‖ now</i><i style="margin-left:auto">width = effort</i></div>`);
        countsEx.appendChild(wrap);
      },
      bl: () => {
        countsEx.innerHTML = '';
        if (!backlog.length) { countsEx.innerHTML = '<div class="empty">backlog is empty</div>'; return; }
        backlog.forEach((b, i) => {
          const slug = (b.s.path || '').replace(/\/$/, '').split('/').pop().replace(/\.md$/, '');
          const p = (b.s.meta.priority || '').toLowerCase();
          const row = document.createElement('div'); row.className = 'bl-row';
          row.innerHTML = `<span class="rank">${i + 1}</span><div class="nm"><span class="t">${esc(slug)}</span>${intentName(b.s) ? ` <span class="d">— ${esc(intentName(b.s))}</span>` : ''}</div><span class="st" style="color:${stCol[b.st]}">●</span><span class="pri" style="color:${prCol[p]}">${p ? p.toUpperCase() : '—'}</span>`;
          row.querySelector('.t').onclick = () => openDrawer(b.s);
          const pri = row.querySelector('.pri');
          pri.onclick = () => {
            const cur = p;
            const sel = document.createElement('select');
            ['p0', 'p1', 'p2', 'p3'].forEach(o => { const op = document.createElement('option'); op.value = o; op.textContent = o.toUpperCase(); if (o === cur) op.selected = true; sel.appendChild(op); });
            pri.replaceWith(sel); sel.focus();
            let changed = false;
            sel.onchange = () => {
              changed = true;
              const np = sel.value;
              if (np === cur) { loadSelected(); return; }
              const inp = document.createElement('input');
              inp.placeholder = `${cur.toUpperCase()}→${np.toUpperCase()} · why? (⏎ save · esc skip)`;
              inp.style.cssText = 'font-family:var(--mono);font-size:.62rem;width:236px;border:1px solid var(--accent);border-radius:3px;padding:1px 6px;background:var(--card);color:var(--ink)';
              sel.replaceWith(inp); inp.focus();
              const save = async reason => {
                try { await postJSON('/api/priority', { ws: ws.name, spec: b.s.path, priority: np, from: cur, reason }); } catch (e) { alert(e.message); }
                loadSelected();
              };
              inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); save(inp.value.trim()); } if (e.key === 'Escape') save(''); };
              inp.onblur = () => save(inp.value.trim());
            };
            sel.onblur = () => { if (!changed) loadSelected(); };
          };
          countsEx.appendChild(row);
        });
        countsEx.insertAdjacentHTML('beforeend', `<div style="display:flex;gap:14px;margin-top:10px;font-family:var(--mono);font-size:.58rem;color:var(--dim)"><span><span style="color:#3a7d55">●</span> ready</span><span><span style="color:#c0622a">●</span> blocked</span><span><span style="color:#8a8070">●</span> triage</span><span style="margin-left:auto">click a priority to override</span></div>`);
      },
      dc: () => {
        countsEx.innerHTML = '';
        if (!decs.length) { countsEx.innerHTML = '<div class="empty">no decisions recorded</div>'; return; }
        decs.forEach(d => { const r = document.createElement('div'); r.className = 'dec-row'; r.innerHTML = `${IC.check('#3a7d55')}<p class="txt">${esc(d.title)}</p><span class="age">${rel(d.mtime)}</span>`; r.onclick = () => openDrawer(d); countsEx.appendChild(r); });
      },
      pk: () => {
        countsEx.innerHTML = '';
        if (!parked.length) { countsEx.innerHTML = '<div class="empty">nothing parked</div>'; return; }
        parked.forEach(t => { const r = document.createElement('div'); r.className = 'loop-row'; r.innerHTML = `${IC.archive('#8a8070')}<div class="txt"><div class="t">${esc(t.title)}</div><div class="sub">${(t.meta.type || '').toUpperCase()} · ${rel(t.mtime)}</div></div>`; r.onclick = () => openDrawer(t); countsEx.appendChild(r); });
      },
    };
    let openCount = null;
    counts.querySelectorAll('.ci').forEach(ci => {
      ci.onclick = () => {
        const x = ci.dataset.x;
        if (openCount === x) { countsEx.classList.remove('open'); ci.classList.remove('open'); openCount = null; return; }
        openCount = x;
        counts.querySelectorAll('.ci').forEach(c => c.classList.toggle('open', c === ci));
        builders[x](); countsEx.classList.add('open');
      };
    });
    counts.querySelector('.cap').onclick = () => {
      const cap = counts.querySelector('.cap');
      const inp = document.createElement('input'); inp.placeholder = 'park a thought to explore — ⏎ saves';
      cap.replaceWith(inp); inp.focus();
      const commit = async () => {
        const v = inp.value.trim();
        if (v) { try { await postJSON('/api/capture', { ws: ws.name, text: v }); loadSelected(); return; } catch (e) { alert(e.message); } }
        loadSelected();
      };
      inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); commit(); } if (e.key === 'Escape') loadSelected(); };
      inp.onblur = commit;
    };
    block.appendChild(counts); block.appendChild(countsEx);

    paper.appendChild(block);
  }
  paper.insertAdjacentHTML('beforeend', '<div class="footnote">every change is a file edit — including the ones you make here · git is the database</div>');
}

/* ════ LIVE LOOK ════ */
const STAGES = [
  ['triage', 'TRIAGE', '#8a8070'],
  ['ready', 'READY', '#c9c2b4'],
  ['in-progress', 'IN PROGRESS', '#e2a55e'],
  ['done', 'DONE', '#6fae84'],
];

function renderLanes(wss) {
  const root = $('lanes');
  root.innerHTML = '';
  const multi = wss.length > 1;
  const all = [];
  for (const ws of wss) for (const s of ws.specs) { s._ws = ws.name; all.push(s); }

  for (const [stage, name, color] of STAGES) {
    let items = all.filter(s => s.stage === stage);
    if (stage === 'ready') items.sort((a, b) => (PRIO[a.meta.priority] ?? 9) - (PRIO[b.meta.priority] ?? 9));
    if (stage === 'done') items.sort((a, b) => b.mtime - a.mtime);
    const lane = document.createElement('div');
    lane.className = 'lane';
    lane.innerHTML = `<div class="lane-head"><span class="dot" style="background:${color}"></span><span class="nm">${name}</span><span class="ct">${items.length}</span></div>`;
    const body = document.createElement('div');
    body.className = 'lane-body';
    items.forEach(s => {
      const slug = (s.path || '').replace(/\/$/, '').split('/').pop().replace(/\.md$/, '');
      const card = document.createElement('div');
      card.className = 'lcard' + (stage === 'in-progress' ? ' working' : '');
      let inner = (multi ? `<span class="ws-tag">${esc(s._ws)}</span>` : '') + `<p class="t">${esc(stage === 'triage' || stage === 'ready' ? s.title : slug)}</p>`;
      if (stage === 'in-progress') inner += `<div class="pbar"><i></i></div>
        <div class="meta"><span class="agent">⚡ active</span><span class="elapsed">${rel(s.mtime)}</span></div>`;
      if (stage === 'done') inner += `<span class="done-tag">✓ done</span>`;
      card.innerHTML = inner;
      card.onclick = () => openDrawer(s);
      body.appendChild(card);
    });
    lane.appendChild(body);
    root.appendChild(lane);
  }
}

/* ── file tree ── */
let expanded;
try { expanded = new Set(JSON.parse(localStorage.getItem('tl-tree-x') || '[]')); } catch { expanded = new Set(); }
let expandedInit = expanded.size > 0;
const changeMeta = new Map();   // ws|path -> {status, added, removed}
const heat = new Map();
let treeData = [];
let activeFileKey = null;

function heatTier(h) { return h > 0.6 ? 3 : h > 0.3 ? 2 : h > 0.05 ? 1 : 0; }
function warm(key) { heat.set(key, Math.min(1, (heat.get(key) || 0) * 0.7 + 0.4)); }
setInterval(() => {
  let changed = false;
  for (const [k, h] of heat) {
    const n = h * 0.86;
    if (n < 0.05) heat.delete(k); else heat.set(k, n);
    changed = true;
  }
  if (changed && agentVisible()) renderTree();
}, 4000);

function saveExpanded() { localStorage.setItem('tl-tree-x', JSON.stringify([...expanded])); }

function treeNode(ws, node, depth) {
  const key = ws + '|' + node.path;
  const el = document.createElement('div');
  if (node.dir) {
    const isX = expanded.has(key);
    const row = document.createElement('button');
    row.className = 'tn ' + (depth === 0 ? 'rootn' : 'dirn') + (isX ? ' x' : '');
    row.dataset.key = key;
    row.innerHTML = `<span class="arr">▶</span><span class="nm">${esc(node.name)}</span>`;
    row.onclick = () => {
      if (expanded.has(key)) expanded.delete(key); else expanded.add(key);
      saveExpanded(); renderTree();
    };
    el.appendChild(row);
    if (isX && node.children && node.children.length) {
      const kids = document.createElement('div');
      kids.className = 'tkids';
      node.children.forEach(c => kids.appendChild(treeNode(ws, c, depth + 1)));
      el.appendChild(kids);
    }
  } else {
    const cm = changeMeta.get(key);
    const row = document.createElement('button');
    row.className = 'tn h' + heatTier(heat.get(key) || 0) + (key === activeFileKey ? ' active' : '');
    row.dataset.key = key;
    let delta = '';
    if (cm && cm.status === 'A') delta = '<span class="delta new">new</span>';
    else if (cm && cm.added) delta = `<span class="delta">+${cm.added}</span>`;
    row.innerHTML = `<span class="arr"></span><span class="nm">${esc(node.name)}</span>${delta}`;
    row.onclick = () => showFile(ws, node.path, null);
    el.appendChild(row);
  }
  return el;
}

function renderTree() {
  const root = $('tree');
  root.innerHTML = '';
  for (const t of treeData) {
    const rootKey = t.name + '|';
    if (!expandedInit) {
      expanded.add(rootKey);
      t.tree.filter(n => n.dir).forEach(n => expanded.add(t.name + '|' + n.path));
    }
    root.appendChild(treeNode(t.name, { name: t.name, path: '', dir: true, children: t.tree }, 0));
  }
  if (!expandedInit) { expandedInit = true; saveExpanded(); renderTree(); }
}

async function loadTrees() {
  treeData = await Promise.all(selected.map(n =>
    fetch('/api/tree?ws=' + encodeURIComponent(n)).then(r => r.json())));
  renderTree();
}

/* ── activity feed ── */
const feed = $('feed');
let logCount = 0;
function logLine(time, verb, vColor, msg, detail) {
  const cursorRow = feed.lastElementChild;
  const el = document.createElement('div');
  el.className = 'log-line';
  el.innerHTML = `<span class="t">${esc(time)}</span><span class="v" style="color:${vColor}">${esc(verb)}</span>
    <span class="m">${esc(msg)}${detail ? ` <span class="d">${esc(detail)}</span>` : ''}</span>`;
  feed.insertBefore(el, cursorRow);
  logCount++;
  const rows = feed.querySelectorAll('.log-line');
  rows.forEach((r, i) => r.classList.toggle('old', i < rows.length - 17 && r !== cursorRow));
  if (logCount > 300) feed.removeChild(feed.firstElementChild);
  feed.scrollTop = feed.scrollHeight;
}

const NOISE_DIRS = ['specs', 'in-progress', 'done', 'triage', 'intents', 'threads', '_metrics', 'context', 'outcome'];
function classify(e) {
  const C = getComputedStyle(document.body);
  const ok = '#6fae84', info = '#9b8cf0', warn = '#e2a55e', bad = '#d96a5a', dim = '#8a8070';
  if (e.log) {
    const l = e.log.line || {};
    switch (e.log.file) {
      case 'triage-log': return ['TRIAGE', warn, `${l.total ?? '?'} specs ranked`, `${l.overrides_detected ?? 0} overrides`];
      case 'override-log': return ['HUMAN', warn, `override ${l.spec}`, `${l.from} → ${l.to}`];
      case 'capture-log': return ['BUG', bad, `${l.spec}`, `${l.affected_users ?? '?'} users`];
      case 'dedup-log': return ['DEDUP', dim, `merged ${l.merged ?? 0}, closed ${l.auto_closed ?? 0}`, ''];
      case 'cycle-log': return ['DONE', ok, `${l.spec}`, 'spec completed'];
      default: return ['LOG', dim, e.log.file + '.jsonl', '+1 line'];
    }
  }
  const p = e.path || '';
  if (!e.log && e.exists && !/\.\w+$/.test(p)) {
    const segs = p.split('/');
    if (NOISE_DIRS.includes(segs[segs.length - 1])) return null;
    return ['MOVE', info, p, ''];
  }
  if (!e.exists) return ['DEL', bad, p, ''];
  const d = e.change ? `+${e.change.added}${e.change.removed ? ' −' + e.change.removed : ''}` : '';
  if (/^threads\//.test(p)) return ['THREAD', info, p.replace(/^threads\//, ''), e.change && e.change.status === 'A' ? 'captured' : 'updated'];
  if (/priorities\.md$/i.test(p)) return ['RANK', warn, 'PRIORITIES.md rewritten', d];
  if (/triage\.yml$/i.test(p)) return ['LOGIC', warn, 'TRIAGE.yml edited', d];
  if (/feedback\.md$/i.test(p)) return ['FEEDBK', ok, p, d];
  return ['WRITE', ok, p, d];
}

/* ── file viewer ── */
function colorLine(raw) {
  if (!raw.trim()) return '&nbsp;';
  const t = raw.trim();
  if (t.startsWith('//') || (t.startsWith('#') && !t.startsWith('#!'))) return `<span class="cmt">${esc(raw)}</span>`;
  // tokenize on the RAW line, escape per-part — never re-scan injected HTML
  const strRx = /"[^"]*"|'[^']*'|`[^`]*`/g;
  const kwRx = /\b(import|export|from|const|let|var|async|await|return|new|class|interface|type|function|if|else|for|while|static|private|public|true|false|null|undefined|string|number|boolean|void|extends|implements)\b/g;
  const marks = [];
  let m;
  while ((m = strRx.exec(raw)) !== null) marks.push({ s: m.index, e: m.index + m[0].length, c: 'str' });
  while ((m = kwRx.exec(raw)) !== null) {
    if (!marks.some(x => m.index >= x.s && m.index < x.e)) marks.push({ s: m.index, e: m.index + m[0].length, c: 'kw' });
  }
  marks.sort((a, b) => a.s - b.s);
  let out = '', last = 0;
  for (const mk of marks) {
    if (mk.s < last) continue;
    out += esc(raw.slice(last, mk.s)) + `<span class="${mk.c}">` + esc(raw.slice(mk.s, mk.e)) + '</span>';
    last = mk.e;
  }
  return out + esc(raw.slice(last));
}
let viewerToken = 0;
async function showFile(ws, path, addedSet) {
  activeFileKey = ws + '|' + path;
  renderTree();
  const tok = ++viewerToken;
  const r = await fetch(`/api/file?ws=${encodeURIComponent(ws)}&path=${encodeURIComponent(path)}`);
  if (!r.ok || tok !== viewerToken) return;
  const f = await r.json();
  const segs = path.split('/');
  const fname = segs.pop();
  $('crumb').innerHTML = `<span class="crumb">${esc(ws)} / ${segs.map(esc).join(' / ')}${segs.length ? ' / ' : ''}<b>${esc(fname)}</b></span>` +
    (addedSet ? `<span class="crumb writing"><span class="pulse"></span>writing</span>` : '');
  const lines = f.content.split('\n');
  let html = '<table class="code"><tbody>';
  lines.forEach((line, i) => {
    const isAdded = addedSet && addedSet.has(line.slice(0, 200));
    html += `<tr${isAdded ? ' class="added"' : ''}><td class="ln">${i + 1}</td><td class="cl">${colorLine(line)}</td></tr>`;
  });
  html += '</tbody></table>';
  const v = $('viewer');
  v.innerHTML = html;
  const firstAdded = v.querySelector('tr.added');
  if (firstAdded) firstAdded.scrollIntoView({ block: 'center' });
}

/* ── events ── */
let refreshTimer = null;
function connectEvents() {
  const es = new EventSource('/api/events');
  es.onopen = () => { $('termDot').classList.remove('off'); logLine(new Date().toLocaleTimeString('en-GB', { hour12: false }), 'WATCH', '#8a8070', 'watching for changes…', ''); };
  es.onerror = () => $('termDot').classList.add('off');
  let lastSig = '', lastAt = 0;
  es.onmessage = ev => {
    let e; try { e = JSON.parse(ev.data); } catch { return; }
    if (!e.path && !e.log) return;
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(() => {
      const editing = document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT');
      if (!editing) loadSelected();
      loadTrees();
    }, 600);
    if (e.exists && /\.(md|yml|yaml|jsonl)$/.test(e.path || '') && !e.change) return;

    if (e.change) {
      const key = e.ws + '|' + e.path;
      changeMeta.set(key, e.change);
      warm(key);
      const row = document.querySelector(`.tn[data-key="${CSS.escape(key)}"]`);
      if (row) { row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash'); }
    }

    // live file viewer follows writes to markdown/yaml (skip logs)
    if (e.diff && selected.includes(e.ws) && !/\.jsonl$/.test(e.path)) {
      const addedSet = new Set((e.diff.hunks || []).filter(h => h.t === '+').map(h => h.s));
      if (agentVisible()) showFile(e.ws, e.path, addedSet);
      else $('liveTab').classList.add('unseen');
    }

    const c = classify(e);
    if (!c) return;
    const sig = e.ws + '|' + c[0] + c[2];
    if (sig === lastSig && Date.now() - lastAt < 2500) return;
    lastSig = sig; lastAt = Date.now();
    const multi = selected.length > 1;
    logLine(new Date().toLocaleTimeString('en-GB', { hour12: false }), c[0].padEnd(6), c[1],
      (multi && e.ws ? e.ws + '/' : '') + c[2], c[3]);
  };
}

/* ── modes: human · split · agent ── */
const agentVisible = () => !document.body.classList.contains('m-human');
function setMode(mode) {
  if (!['human', 'split', 'agent'].includes(mode)) mode = 'human';
  document.body.classList.remove('m-human', 'm-split', 'm-agent');
  document.body.classList.add('m-' + mode);
  document.querySelectorAll('.bar .tab').forEach(b => b.classList.toggle('active', b.dataset.view === mode));
  localStorage.setItem('tl-view', mode);
  if (mode !== 'human') { $('liveTab').classList.remove('unseen'); renderTree(); }
}
document.querySelectorAll('.bar .tab').forEach(btn => { btn.onclick = () => setMode(btn.dataset.view); });

/* ── selection + boot ── */
let available = [], selected = [];

function syncButton() {
  $('wsBtn').textContent = selected.length === 1 ? selected[0] : `${selected.length} projects`;
}
async function loadSelected() {
  const wss = await Promise.all(selected.map(n =>
    fetch('/api/ws/' + encodeURIComponent(n)).then(r => r.json())));
  renderResume(wss);
  renderLanes(wss);
  syncButton();
}
function buildPanel() {
  $('wsPanel').innerHTML = '';
  available.forEach(w => {
    const l = document.createElement('label');
    l.className = 'msel-item';
    l.innerHTML = `<input type="checkbox" ${selected.includes(w.name) ? 'checked' : ''}>
      <span>${esc(w.name)}</span>${w.example ? '<span class="ex">example</span>' : ''}`;
    l.querySelector('input').onchange = e => {
      if (e.target.checked) selected.push(w.name);
      else selected = selected.filter(n => n !== w.name);
      if (!selected.length) { selected = [w.name]; e.target.checked = true; return; }
      localStorage.setItem('tl-sel', JSON.stringify(selected));
      loadSelected(); loadTrees();
    };
    $('wsPanel').appendChild(l);
  });
}
$('wsBtn').onclick = () => $('msel').classList.toggle('open');
addEventListener('click', e => { if (!e.target.closest('.msel')) $('msel').classList.remove('open'); });

async function seedChanges() {
  const list = await (await fetch('/api/changes')).json();
  for (const c of list) changeMeta.set(c.ws + '|' + c.path, c);
}

async function boot() {
  connectEvents();
  available = await (await fetch('/api/workspaces')).json();
  if (!available.length) { $('paper').innerHTML = '<div class="empty">No workspaces found — run /tl:new</div>'; return; }
  try { selected = JSON.parse(localStorage.getItem('tl-sel') || '[]').filter(n => available.some(w => w.name === n)); }
  catch { selected = []; }
  if (!selected.length) selected = [available[0].name];
  buildPanel();
  addEventListener('focus', loadSelected);
  await seedChanges();
  await loadSelected();
  await loadTrees();
  const saved = localStorage.getItem('tl-view');
  setMode(saved === 'live' ? 'agent' : saved === 'resume' ? 'human' : saved || 'human');
}
boot();
</script>
</body>
</html>
