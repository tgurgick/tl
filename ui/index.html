      const head = document.createElement('div'); head.className = 'recall-head';
      head.innerHTML = (data.total
        ? `<span>${data.total} match${data.total === 1 ? '' : 'es'} for “${esc(data.query)}”${data.capped ? ' · showing first ' + data.hits.length : ''}</span>`
        : `<span>no prior discussion found for “${esc(data.query)}” across intents, specs, threads, or done outcomes — this looks new</span>`)
        + `<span class="clear">clear ×</span>`;
      head.querySelector('.clear').onclick = clearRecall;
      rres.appendChild(head);
      for (const g of data.groups) {
        const kindEl = document.createElement('div'); kindEl.className = 'recall-kind'; kindEl.textContent = g.kind;
        rres.appendChild(kindEl);
        for (const h of g.hits) {
          const row = document.createElement('div'); row.className = 'loop-row recall-row';
          row.innerHTML = `<div class="txt"><div class="t">${esc(h.title)}</div><div class="sub">${esc(h.path)}</div>${h.snippet ? `<div class="snip">${esc(h.snippet)}</div>` : ''}</div>`;
          rres.appendChild(row);
        }
      }
    };
    rinp.onkeydown = async e => {
      if (e.key === 'Escape') { clearRecall(); return; }
      if (e.key !== 'Enter') return; e.preventDefault();
      const q = rinp.value.trim();
      if (!q) { clearRecall(); return; }
      try {
        const r = await fetch(`/api/recall?ws=${encodeURIComponent(ws.name)}&q=${encodeURIComponent(q)}`);
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'recall failed');
        resumeOpen.recall[ws.name] = { q, data };
        renderRecall(data);
      } catch (err) {
        rres.classList.add('open');
        rres.innerHTML = `<div class="empty">${esc(err.message || 'recall failed')}</div>`;
      }
    };
    rinp.oninput = () => { recallDraft[ws.name] = { text: rinp.value, focused: true }; };
    rinp.onfocus = () => { (recallDraft[ws.name] = recallDraft[ws.name] || { text: rinp.value }).focused = true; };
    rinp.onblur = () => { if (recallDraft[ws.name]) recallDraft[ws.name].focused = false; };
    // survive the SSE re-render: restore the last committed query + results,
    // then any in-flight draft on top (and put the caret back where it was)
    const prevRecall = resumeOpen.recall[ws.name];
    if (prevRecall) { rinp.value = prevRecall.q; renderRecall(prevRecall.data); }
    const draft = recallDraft[ws.name];
    if (draft && draft.text != null) rinp.value = draft.text;
    if (draft && draft.focused) setTimeout(() => {
      rinp.focus();
      try { rinp.setSelectionRange(rinp.value.length, rinp.value.length); } catch (_) {}
    }, 0);
    block.appendChild(recallBox); block.appendChild(rres);

    // ── park a thought (prominent, at the bottom) ──
    const park = document.createElement('div'); park.className = 'park';
    park.innerHTML = `<span class="park-label">Steer · park a thought</span><input class="park-input" placeholder="something to explore later — ⏎ saves">`;
    const pinp = park.querySelector('.park-input');
    pinp.onkeydown = async e => {
      if (e.key !== 'Enter') return; e.preventDefault();
      const v = pinp.value.trim(); if (!v) return;
      pinp.disabled = true;
      try { await postJSON('/api/capture', { ws: ws.name, text: v }); pinp.value = ''; loadSelected(); }
      catch (err) {
        pinp.disabled = false;
        // a duplicate isn't an error — that thought is already parked, calmly say so
        if (err.status === 409) { pinp.value = ''; pinp.placeholder = '✓ already parked — nothing duplicated'; }
        else alert(err.message);
      }
    };
    block.appendChild(park);

    paper.appendChild(block);
  }
  paper.insertAdjacentHTML('beforeend', '<div class="footnote">every change is a file edit — including the ones you make here · git is the database<div class="fn-cmds">/tl&nbsp; resume · capture · recall · run · review · map · triage · groom · promote · goal · new</div></div>');
}

/* ════ LIVE LOOK ════ */
const STAGES = [
  ['triage', 'SHAPING', '#8a8070'],
  ['ready', 'READY', '#c9c2b4'],
  ['in-progress', 'IN PROGRESS', '#e2a55e'],
  ['tests', 'TESTS', '#6b8fc7'],
  ['in-review', 'IN REVIEW', '#b57fc7'],
  ['done', 'DONE', '#6fae84'],
];

function renderLanes(wss) {
  const root = $('lanes');
  root.innerHTML = '';
  const multi = wss.length > 1;
  const all = [];
  for (const ws of wss) for (const s of ws.specs) {
    s._ws = ws.name;
    s._verifyRequests = ws.verifyRequests || [];   // pending verify artifacts → drawer "requested" step
    all.push(s);
  }

  for (const [stage, name, color] of STAGES) {
    let items = all.filter(s => s.stage === stage);
    if (stage === 'ready') items.sort((a, b) => (PRIO[a.meta.priority] ?? 9) - (PRIO[b.meta.priority] ?? 9));
    if (stage === 'done') items.sort((a, b) => b.mtime - a.mtime);
    const lane = document.createElement('div');
    lane.className = 'lane';
    lane.innerHTML = `<div class="lane-head"><span class="dot" style="background:${color}"></span><span class="nm">${name}</span><span class="ct">${items.length}</span></div>`;
    if (stage === 'tests') {
      // bulk verify — the drawer's old "Drain queue", moved to the lane head
      // where a whole-lane action belongs: one verify request per awaiting spec
      const wsAwaiting = [...new Set(items.filter(s => s.meta && s.meta.awaiting_verifier === true).map(s => s._ws))];
      if (wsAwaiting.length) {
        const btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'lh-drain'; btn.textContent = 'verify all';
        btn.title = 'queue a verify request for every awaiting spec — workers / tl verify --execute drain them; the UI never spawns agents';
        btn.onclick = async e => {
          e.stopPropagation(); btn.disabled = true;
          try {
            let n = 0;
            for (const w of wsAwaiting) { const r = await postJSON('/api/verify-dispatch', { ws: w, drain: true }); n += r.count || 0; }
            btn.textContent = `queued ${n} ✓`;
            loadSelected();
          } catch (err) { btn.disabled = false; alert(err.message); }
        };
        lane.querySelector('.lane-head').appendChild(btn);
      }
    }
    const body = document.createElement('div');
    body.className = 'lane-body';
    items.forEach(s => {
      const slug = (s.path || '').replace(/\/$/, '').split('/').pop().replace(/\.md$/, '');
      const owner = ownerBadge(s);           // who claimed it (live), if stamped
      const showOwner = !!owner && (stage === 'in-progress' || stage === 'tests' || stage === 'in-review');
      const card = document.createElement('div');
      card.className = 'lcard' + (stage === 'in-progress' ? ' working' : '') + (stage === 'done' ? ' done' : '') + (showOwner ? ' has-owner' : '');
      const pr = (s.meta.priority || '').toLowerCase();
      const priBadge = pr ? `<span class="lc-pri ${pr}">${esc(pr.toUpperCase())}</span>` : '';
      let inner = (multi ? `<span class="ws-tag">${esc(s._ws)}</span>` : '') + `<p class="t">${priBadge}${esc(stage === 'triage' || stage === 'ready' ? s.title : slug)}</p>`;
      const amark = agentMark(s, 'currentColor');
      // the owner's brand logo sits absolute in the top-right corner, so it adds
      // no height and never collides with the gate label or the timestamp
      if (stage === 'in-progress') inner += `<div class="pbar"><i></i></div>
        <div class="meta"><span class="lc-status">⚡ active</span><span class="elapsed">${showOwner ? '' : amark}${rel(s.mtime)}</span></div>`;
      if (stage === 'tests') {
        const vBadge = verifierStateBadge(s) || (s.meta.awaiting_verifier === true
          ? `<span class="gate gate-await" title="stopped at the tests gate — needs a non-builder agent">⊘ awaiting verifier</span>` : '');
        inner += `<div class="meta"><span class="gate gate-tests">⏳ tests</span>${vBadge}<span class="elapsed">${showOwner ? '' : amark}${rel(s.mtime)}</span></div>`;
      }
      if (stage === 'in-review') inner += `<div class="meta"><span class="gate gate-review">◆ needs review</span>${verifyBadge(s)}<span class="elapsed">${showOwner ? '' : amark}${rel(s.mtime)}</span></div>`;
      if (showOwner) inner += owner;
      if (s.notes) inner += `<div class="lc-note">✎ ${esc((s.notes.match(/— note\n(.+)/) || s.notes.match(/\n([^\n#].+)/) || [, ''])[1] || 'note').slice(0, 60)}</div>`;
      // SHAPING only: reason chip + release → ready without opening the drawer
      if (stage === 'triage') {
        inner += `<div class="meta">${holdReasonChip(s.meta)}</div>`;
        inner += `<button type="button" class="lc-release" title="Shaped — move to the ready queue">shaped → ready</button>`;
      }
      card.innerHTML = inner;
      card.onclick = () => openDrawer(s);
      if (stage === 'triage') {
        const btn = card.querySelector('.lc-release');
        if (btn) btn.onclick = async e => {
          e.stopPropagation();
          btn.disabled = true;
          try {
            await postJSON('/api/release', { ws: s._ws, spec: s.path });
            loadSelected();
          } catch (err) {
            btn.disabled = false;
            alert(err.message);
          }
        };
      }
      body.appendChild(card);
    });
    lane.appendChild(body);
    root.appendChild(lane);
  }
}

/* ════ EXPERIMENTS ════ */
// The dashboard reads experiment artifacts (never executes agents). Data comes from
// /api/experiments (queue list) and /api/experiment (candidate/trace/judge/winner detail).
const EXP_ST = ['succeeded','running','queued','awaiting_evaluation','failed','timed_out','over_budget','unavailable','cancelled','invalid_output','selected','applied','rejected','apply-failed','superseded'];
const expStClass = s => 'exp-st st-' + (EXP_ST.includes(s) ? s : 'unknown');
const fmtCost = v => v == null ? '—' : '$' + Number(v).toFixed(2);
const fmtDur = v => v == null ? '—' : Number(v) + 'm';
const fmtTok = v => v == null ? '—' : Number(v).toLocaleString();
let expActiveId = null;
let expDetailCache = null;

async function renderExperimentList() {
  const box = $('expList');
  // one workspace at a time for experiments — use the first selected
  const wsName = selected[0];
  if (!wsName) { box.innerHTML = '<div class="exp-empty">no workspace selected</div>'; return; }
  let list = [];
  try { list = await (await fetch('/api/experiments?ws=' + encodeURIComponent(wsName))).json(); }
  catch { box.innerHTML = '<div class="exp-empty">could not load experiments</div>'; return; }
  if (!Array.isArray(list) || !list.length) {
    box.innerHTML = `<div class="exp-empty">no experiments yet — <span style="color:var(--accent);cursor:pointer" id="expEmptyNew">queue one →</span></div>`;
    const b = $('expEmptyNew'); if (b) b.onclick = () => openExperimentQueueForm(wsName);
    $('expDetail').innerHTML = '<div class="exp-empty">no experiments to show</div>';
    return;
  }
  box.innerHTML = '';
  list.forEach(e => {
    const el = document.createElement('div');
    el.className = 'exp-item' + (e.id === expActiveId ? ' active' : '');
    const shadows = (e.shadow_agents || []).length;
    // a variant (forked from another experiment) carries replay_of — mark it
    const variantTag = e.replay_of
      ? `<span class="exp-var-tag" title="variant of ${esc(e.replay_of)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h5"/><path d="M9 12l8-6"/><path d="M13 6h4v4"/><path d="M9 12l8 6"/><path d="M13 18h4v-4"/></svg>variant</span>`
      : '';
    el.innerHTML = `<div class="eid">${variantTag}${esc(e.id)}</div>
      <div class="erow"><span class="${expStClass(e.status)}">${esc(e.status)}</span>
        <span>${esc(e.primary_agent || '?')}${shadows ? ' +' + shadows : ''}</span>
        <span class="ecount">${e.candidate_count} cand</span></div>`;
    el.onclick = () => selectExperiment(wsName, e.id);
    box.appendChild(el);
  });
  // auto-open the first experiment if none is active
  if (!expActiveId || !list.some(e => e.id === expActiveId)) selectExperiment(wsName, list[0].id);
}

async function selectExperiment(wsName, id) {
  expActiveId = id;
  document.querySelectorAll('#expList .exp-item').forEach(el => el.classList.toggle('active', el.querySelector('.eid').textContent === id));
  const det = $('expDetail');
  det.innerHTML = '<div class="exp-empty">loading…</div>';
  let d;
  try { d = await (await fetch(`/api/experiment?ws=${encodeURIComponent(wsName)}&id=${encodeURIComponent(id)}`)).json(); }
  catch { det.innerHTML = '<div class="exp-empty">could not load experiment</div>'; return; }
  if (!d || d.error) { det.innerHTML = `<div class="exp-empty">${esc((d && d.error) || 'not found')}</div>`; return; }
  expDetailCache = d;
  renderExperimentDetail(wsName, d);
}

function candCard(c, winnerId) {
  const isWin = c.candidate_id === winnerId;
  const kv = [];
  const push = (k, v, cls) => kv.push(`<div class="k">${esc(k)}</div><div class="v${cls ? ' ' + cls : ''}">${esc(v)}</div>`);
  push('status', c.status);
  push('tool', c.agent_tool || '—');
  // requested vs resolved model, and where the resolution came from — the routing story
  push('req model', c.agent_model_auto ? 'auto' : (c.agent_model || '—'), c.agent_model_auto ? 'auto' : '');
  push('resolved', c.agent_model || 'unknown');
  push('model src', c.agent_model_source || 'unknown');
  push('cost', fmtCost(c.cost_usd));
  push('duration', fmtDur(c.duration_minutes));
  push('tokens', fmtTok(c.tokens_used));
  push('tests', c.task_complete == null ? '—' : (c.task_complete ? 'pass' : 'fail'), c.task_complete === false ? 'fault' : '');
  if (c.fault) push('fault', c.fault, 'fault');
  const traceId = 'trace-' + c.candidate_id.replace(/[^a-z0-9]/gi, '');
  const traceRows = c.trace.map(t => {
    const sc = t.status === 'succeeded' ? 'ok' : /fail|error|timed/.test(t.status) ? 'bad' : '';
    const tt = (t.ts || '').replace(/^.*T/, '').replace(/\..*$/, '') || '·';
    return `<div class="exp-tr"><span class="tt">${esc(tt)}</span><span class="tk ${sc}">${esc(t.type || '')}</span><span class="tm">${esc(t.summary || '')}</span></div>`;
  }).join('') || '<div class="cap">no trace events</div>';
  const cap = c.trace_capped ? `<div class="cap">showing first ${c.trace.length} of ${c.trace_total} events (capped)</div>` : '';
  const reasoning = c.reasoning ? `<div class="exp-reason">${esc(c.reasoning.replace(/^---\n[\s\S]*?\n---\n/, '').trim())}</div>` : '';
  return `<div class="exp-card${isWin ? ' winner' : ''}">
    <div class="ch"><span class="cid">${esc(c.candidate_id)}</span><span class="role ${c.role === 'primary' ? 'primary' : ''}">${esc(c.role || 'candidate')}</span>${isWin ? '<span class="win-tag">✦ winner</span>' : ''}</div>
    <div class="exp-kv">${kv.join('')}</div>
    <button class="exp-trace-btn" data-trace="${traceId}">trace timeline · ${c.trace.length}${c.reasoning ? ' · reasoning' : ''}</button>
    <div class="exp-trace" id="${traceId}">${traceRows}${cap}${reasoning}</div>
  </div>`;
}

function renderExperimentDetail(wsName, d) {
  const m = d.meta || {};
  const winnerId = (d.winner && d.winner.candidate_id) || (d.judge && d.judge.winner) || '';
  // header
  const sub = [];
  if (m.task_type) sub.push(`type <code>${esc(m.task_type)}</code>`);
  if (m.tl_spec) sub.push(`spec <code>${esc(m.tl_spec)}</code>`);
  if (m.base_commit) sub.push(`base <code>${esc(String(m.base_commit).slice(0, 8))}</code>`);
  if (m.spec_hash) sub.push(`hash <code>${esc(String(m.spec_hash).slice(0, 8))}</code>`);
  if (m.judge_agent) sub.push(`judge <code>${esc(m.judge_agent)}</code>`);
  if (m.replay_of) sub.push(`replay of <code>${esc(m.replay_of)}</code>`);

  // candidate cards
  const cardsHtml = d.candidates.length
    ? `<div class="exp-cards">${d.candidates.map(c => candCard(c, winnerId)).join('')}</div>`
    : '<div class="exp-note">no candidate artifacts yet — queued rows wait for workers.</div>';

  // judge panel
  let judgeHtml = '<div class="exp-note">no judge evaluation yet — awaiting_evaluation until the judge runs.</div>';
  if (d.judge) {
    const j = d.judge;
    const cands = j.candidates || {};
    const dims = new Set();
    Object.values(cands).forEach(cv => Object.keys(cv.scores || {}).forEach(k => dims.add(k)));
    const dimList = [...dims];
    const anyGate = Object.values(cands).some(cv => cv.hard_gates_passed);
    const gateHtml = `<div class="exp-gate ${anyGate ? 'pass' : 'fail'}">${anyGate ? '✓' : '✗'} hard gates${anyGate ? ' — at least one candidate passed' : ' — no candidate passed'}</div>`;
    const rows = Object.entries(cands).map(([cid, cv]) => {
      const cells = dimList.map(dm => `<td>${cv.scores && cv.scores[dm] != null ? esc(cv.scores[dm]) : '—'}</td>`).join('');
      return `<tr class="${cid === j.winner ? 'win' : ''}"><td>${esc(cid)}</td><td>${cv.hard_gates_passed ? '✓' : '✗'}</td>${cells}<td>${cv.utility != null ? esc(cv.utility) : '—'}</td></tr>`;
    }).join('');
    const head = `<tr><th>candidate</th><th>gates</th>${dimList.map(dm => `<th>${esc(dm.replace(/_/g, ' '))}</th>`).join('')}<th>utility</th></tr>`;
    const override = j.winner_set_by === 'human' ? ' <span style="color:var(--accent)">(human override)</span>' : '';
    judgeHtml = `${gateHtml}
      <table class="exp-scores">${head}${rows}</table>
      <div class="exp-rat"><b>winner:</b> ${esc(j.winner || '—')} · set by ${esc(j.winner_set_by || '—')}${override}<br>${esc(j.rationale || '')}</div>`;
  }

  // winner / application panel
  const w = d.winner || {};
  let winnerHtml;
  if (w.candidate_id) {
    const state = w.apply_state || 'selected';
    const parts = [`<div class="wln">selected: <b>${esc(w.candidate_id)}</b> <span class="${expStClass(state)}">${esc(state)}</span></div>`];
    if (w.patch_path) parts.push(`<div class="exp-rat">patch: <code>${esc(w.patch_path)}</code></div>`);
    if (w.human_override) parts.push(`<div class="exp-rat" style="color:var(--accent)">winner set by human override</div>`);
    if (w.apply_error) parts.push(`<div class="exp-note warn">apply error: ${esc(w.apply_error)}</div>`);
    if (!w.apply_state) parts.push(`<div class="exp-note">not yet applied — applying a winning patch is an explicit later action; TL review still owns acceptance to done/.</div>`);
    winnerHtml = parts.join('');
  } else {
    winnerHtml = '<div class="exp-note">no winner selected yet.</div>';
  }

  // headless-reality note driven by status/tool
  const status = m.status || '';
  const closedCursor = d.candidates.some(c => (c.agent_tool || '').toLowerCase() === 'cursor');
  let realityHtml = '';
  if (status === 'queued') realityHtml = `<div class="exp-note warn">queued — waiting for a worker to pick this up. The UI requests experiments; it does not run them.</div>`;
  else if (closedCursor) realityHtml = `<div class="exp-note warn">a Cursor IDE-closed candidate needs Cursor SDK/cloud/worker support to run headless.</div>`;

  // task summary (1–2 sentences) — an optional `summary` field, else the first body paragraph.
  // Kept short and labellable so experiments can be classified/grouped later.
  const rawSummary = (m.summary && String(m.summary).trim())
    || ((d.body || '').replace(/^#.*$/gm, '').split(/\n\s*\n/).map(s => s.trim().replace(/\s+/g, ' ')).find(Boolean) || '');
  const summary2 = rawSummary.split(/(?<=\.)\s+/).slice(0, 2).join(' ').slice(0, 240);
  const summaryHtml = summary2 ? `<div class="exp-summary">${esc(summary2)}</div>` : '';
  const labels = Array.isArray(m.labels) ? m.labels : (m.labels ? [String(m.labels)] : []);
  const labelsHtml = labels.length ? `<div class="exp-labels">${labels.map(l => `<span class="exp-label">${esc(l)}</span>`).join('')}</div>` : '';

  // side-by-side variant diffs — each candidate's PATCH.diff, colored by +/- lines
  const withPatch = d.candidates.filter(c => c.patch);
  const diffsHtml = withPatch.length
    ? `<div class="exp-diffs">${withPatch.map(c => {
        const body = c.patch.split('\n').map(ln => {
          const cls = /^\+(?!\+\+)/.test(ln) ? 'add' : /^-(?!--)/.test(ln) ? 'del' : /^@@/.test(ln) ? 'hunk' : '';
          return `<div class="dl ${cls}">${esc(ln) || '&nbsp;'}</div>`;
        }).join('');
        const cap = c.patch_capped ? `<div class="cap">first ${c.patch.split('\n').length} of ${c.patch_total} lines (capped)</div>` : '';
        return `<div class="exp-diff-col${c.candidate_id === winnerId ? ' winner' : ''}"><div class="ddh">${esc(c.candidate_id)}${c.candidate_id === winnerId ? ' ✦' : ''}</div><div class="dbody">${body}</div>${cap}</div>`;
      }).join('')}</div>`
    : '<div class="exp-note">no diffs captured — candidates wrote no PATCH.diff.</div>';

  $('expDetail').innerHTML = `
    <div class="exp-hd">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:2px">
        <h2>${esc(d.id)}</h2><span class="${expStClass(status)}">${esc(status || 'unknown')}</span>
        <button class="exp-variant" title="spin off a variant — tweak the setup (models, judge, changes), then queue a new run"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h5"/><path d="M9 12l8-6"/><path d="M13 6h4v4"/><path d="M9 12l8 6"/><path d="M13 18h4v-4"/></svg>variant</button>
      </div>
      <div class="sub">${sub.join('')}</div>
      ${summaryHtml}
      ${labelsHtml}
    </div>
    ${realityHtml}
    <div class="exp-sec"><h3>Candidates</h3>${cardsHtml}</div>
    <div class="exp-sec"><h3>Diffs — side by side</h3>${diffsHtml}</div>
    <div class="exp-sec"><h3>Judge</h3><div class="exp-judge">${judgeHtml}</div></div>
    <div class="exp-sec"><h3>Winner</h3><div class="exp-winner">${winnerHtml}</div></div>`;

  $('expDetail').querySelectorAll('.exp-trace-btn').forEach(b => {
    b.onclick = () => { const t = $(b.dataset.trace); if (t) t.classList.toggle('open'); };
  });
  // variant ⑂ — open the queue form pre-filled from this experiment so you can
  // instill changes (models, judge, free-text tweaks) before queuing the new run
  const varBtn = $('expDetail').querySelector('.exp-variant');
  if (varBtn) varBtn.onclick = () => openExperimentQueueForm(wsName, m.tl_spec || '', {
    variantOf: d.id,
    runtime: m.runtime || 'fixture',
    primary: m.primary_agent || '',
    shadows: (m.shadow_agents || []).join(', '),
    judge: m.judge_agent || '',
    models: (d.candidates || []).reduce((o, c) => { if (c.candidate_id && c.agent_model) o[c.candidate_id] = c.agent_model; return o; }, {}),
  });
}

// queue-experiment form — writes a single config file via /api/experiment-queue (never shells out)
function openExperimentQueueForm(wsName, spec, prefill = {}) {
  const dr = $('drawer');
  const pf = prefill || {};
  const variant = !!pf.variantOf;
  const models = pf.models || {};
  const pModel = models[pf.primary] || '';
  const jModel = models[pf.judge] || '';
  const sel = (v, opt) => v === opt ? ' selected' : '';
  dr.innerHTML = `
    <button type="button" class="dr-close" aria-label="Close">×</button>
    <div class="path">${esc(wsName)} / _experiments/queue/</div>
    <h2>${variant ? 'Spin off a variant' : 'Queue an experiment'}</h2>
    ${variant
      ? `<div class="exp-note" style="margin-bottom:12px">Variant of <code>${esc(pf.variantOf)}</code> — change anything below to evolve what you're testing, then queue. The original run is untouched.</div>`
      : `<div class="exp-note" style="margin-bottom:14px">Drops a request into <code>_experiments/queue/</code> for a worker to run. The UI never executes agents.</div>`}
    <div class="exp-form">
      <label>runtime</label>
      <select class="q-runtime"><option value="fixture"${sel(pf.runtime, 'fixture')}>fixture — deterministic local proof</option><option value="local"${sel(pf.runtime, 'local')}>local — a local adapter run</option></select>
      <div class="q-local"${pf.runtime === 'local' ? '' : ' style="display:none"'}>
        <label>runner (the adapter lane a worker drains)</label>
        <select class="q-runner">
          <option value="codex"${sel(pf.runner, 'codex')}>codex — codex exec, sandboxed</option>
          <option value="gemini"${sel(pf.runner, 'gemini')}>gemini — agy, skip-permissions</option>
          <option value="claude"${sel(pf.runner, 'claude')}>claude — headless print mode</option>
          <option value="cursor"${sel(pf.runner, 'cursor')}>cursor — cursor-agent, trusted dir</option>
          <option value="shell"${sel(pf.runner, 'shell')}>shell — run a command</option>
        </select>
        <label>repo (candidates run against an isolated copy)</label>
        <input class="q-repo" value="${esc(pf.repo || '')}" placeholder="/path/to/repo">
        <div class="q-shell-only" style="display:none">
          <label>command (shell runner only)</label>
          <input class="q-command" value="${esc(pf.command || '')}" placeholder="npm test">
        </div>
      </div>
      <label>tl spec (optional)</label>
      <input class="q-spec" value="${esc(spec || '')}" placeholder="in-progress/some-spec/">
      <div class="row2">
        <div><label>primary</label><input class="q-primary" value="${esc(pf.primary || '')}" placeholder="fixture-a"></div>
        <div><label>judge</label><input class="q-judge" value="${esc(pf.judge || '')}" placeholder="fixture-judge"></div>
      </div>
      <label>shadows (comma-separated)</label>
      <input class="q-shadows" value="${esc(pf.shadows || '')}" placeholder="fixture-b, fixture-c">
      ${variant ? `
      <label>model overrides (optional — evolve what competes)</label>
      <div class="row2">
        <div><label class="sub2">primary model</label><input class="q-pmodel" list="tl-models" value="${esc(pModel)}" placeholder="(keep)"></div>
        <div><label class="sub2">judge model</label><input class="q-jmodel" list="tl-models" value="${esc(jModel)}" placeholder="(keep)"></div>
      </div>
      <datalist id="tl-models"><option value="claude-opus-4-8"></option><option value="claude-sonnet-4-6"></option><option value="gpt-5-codex"></option><option value="gemini-2.5-pro"></option></datalist>
      <label>changes to instill</label>
      <textarea class="q-notes" rows="3" placeholder="what to evolve this run — e.g. tighten the acceptance criteria, require tests, try a stricter judge rubric"></textarea>` : ''}
      <div class="row2">
        <div><label>budget (USD)</label><input class="q-budget" type="number" min="0" step="0.5" placeholder="none"></div>
        <div><label>timeout (min)</label><input class="q-timeout" type="number" min="0" step="1" placeholder="none"></div>
      </div>
      <div class="hint">${variant ? "A variant queues a fresh request tagged replay_of — traceable to its origin. Your model, judge, and change tweaks ride along for the worker." : 'Leave primary/judge blank to use fixture defaults. Fixture runtime produces a deterministic proof without calling any provider. Local runtime needs a runner lane + repo — a worker drains it headlessly (quirks encoded per docs/headless-lanes.md).'}</div>
      <div class="exp-actions"><button class="q-cancel">cancel</button><button class="q-save">${variant ? 'queue variant →' : 'queue →'}</button></div>
    </div>`;
  // local runtime reveals the bridge fields (runner + repo); shell reveals command
  const syncLocal = () => {
    const isLocal = dr.querySelector('.q-runtime').value === 'local';
    dr.querySelector('.q-local').style.display = isLocal ? '' : 'none';
    dr.querySelector('.q-shell-only').style.display = isLocal && dr.querySelector('.q-runner').value === 'shell' ? '' : 'none';
  };
  dr.querySelector('.q-runtime').onchange = syncLocal;
  dr.querySelector('.q-runner').onchange = syncLocal;
  syncLocal();
  dr.querySelector('.q-cancel').onclick = () => document.body.classList.remove('open');
  dr.querySelector('.q-save').onclick = async () => {
    const body = {
      ws: wsName,
      runtime: dr.querySelector('.q-runtime').value,
      spec: dr.querySelector('.q-spec').value.trim(),
      primary: dr.querySelector('.q-primary').value.trim(),
      judge: dr.querySelector('.q-judge').value.trim(),
      shadows: dr.querySelector('.q-shadows').value.split(',').map(s => s.trim()).filter(Boolean),
      budget_usd: dr.querySelector('.q-budget').value.trim(),
      timeout_minutes: dr.querySelector('.q-timeout').value.trim(),
    };
    if (body.runtime === 'local') {
      // the bridge fields — processQueueRequests refuses a local request without them
      body.runner = dr.querySelector('.q-runner').value;
      body.repo = dr.querySelector('.q-repo').value.trim();
      const cmd = dr.querySelector('.q-command').value.trim();
      if (cmd) body.command = cmd;
    }
    if (variant) {
      body.replay_of = pf.variantOf;
      const notes = dr.querySelector('.q-notes').value.trim();
      if (notes) body.variant_notes = notes;
      const pm = dr.querySelector('.q-pmodel').value.trim();
      const jm = dr.querySelector('.q-jmodel').value.trim();
      const mo = {};
      if (pm && body.primary) mo[body.primary] = pm;
      if (jm && body.judge) mo[body.judge] = jm;
      if (Object.keys(mo).length) body.models = mo;
    }
    try {
      await postJSON('/api/experiment-queue', body);
      document.body.classList.remove('open');
      if (expVisible()) renderExperimentList();
    } catch (e) { alert(e.message); }
  };
  document.body.classList.add('open');
  wireModalClose();
}

/* ── file tree ── */
let expanded;
try { expanded = new Set(JSON.parse(localStorage.getItem('tl-tree-x') || '[]')); } catch { expanded = new Set(); }
let expandedInit = expanded.size > 0;
const changeMeta = new Map();   // ws|path -> {status, added, removed}
const heat = new Map();
let treeData = [];
let activeFileKey = null;

function heatTier(h) { return h > 0.6 ? 3 : h > 0.3 ? 2 : h > 0.05 ? 1 : 0; }
function warm(key) { heat.set(key, Math.min(1, (heat.get(key) || 0) * 0.7 + 0.4)); }
setInterval(() => {
  let changed = false;
  for (const [k, h] of heat) {
    const n = h * 0.86;
    if (n < 0.05) heat.delete(k); else heat.set(k, n);
    changed = true;
  }
  if (changed && agentVisible()) renderTree();
}, 4000);

function saveExpanded() { localStorage.setItem('tl-tree-x', JSON.stringify([...expanded])); }

function treeNode(ws, node, depth) {
  const key = ws + '|' + node.path;
  const el = document.createElement('div');
  if (node.dir) {
    const isX = expanded.has(key);
    const row = document.createElement('button');
    row.className = 'tn ' + (depth === 0 ? 'rootn' : 'dirn') + (isX ? ' x' : '');
    row.dataset.key = key;
    row.innerHTML = `<span class="arr">▶</span><span class="nm">${esc(node.name)}</span>`;
    row.onclick = () => {
      if (expanded.has(key)) expanded.delete(key); else expanded.add(key);
      saveExpanded(); renderTree();
    };
    el.appendChild(row);
    if (isX && node.children && node.children.length) {
      const kids = document.createElement('div');
      kids.className = 'tkids';
      node.children.forEach(c => kids.appendChild(treeNode(ws, c, depth + 1)));
      el.appendChild(kids);
    }
  } else {
    const cm = changeMeta.get(key);
    const row = document.createElement('button');
    row.className = 'tn h' + heatTier(heat.get(key) || 0) + (key === activeFileKey ? ' active' : '');
    row.dataset.key = key;
    let delta = '';
    if (cm && cm.status === 'A') delta = '<span class="delta new">new</span>';
    else if (cm && cm.added) delta = `<span class="delta">+${cm.added}</span>`;
    row.innerHTML = `<span class="arr"></span><span class="nm">${esc(node.name)}</span>${delta}`;
    row.onclick = () => showFile(ws, node.path, null);
    el.appendChild(row);
  }
  return el;
}

function renderTree() {
  const root = $('tree');
  root.innerHTML = '';
  for (const t of treeData) {
    const rootKey = t.name + '|';
    if (!expandedInit) {
      expanded.add(rootKey);
      t.tree.filter(n => n.dir).forEach(n => expanded.add(t.name + '|' + n.path));
    }
    root.appendChild(treeNode(t.name, { name: t.name, path: '', dir: true, children: t.tree }, 0));
  }
  if (!expandedInit) { expandedInit = true; saveExpanded(); renderTree(); }
}

async function loadTrees() {
  treeData = await Promise.all(selected.map(n =>
    fetch('/api/tree?ws=' + encodeURIComponent(n)).then(r => r.json())));
  renderTree();
}

/* ── activity feed ── */
const feed = $('feed');
let logCount = 0;
function logLine(time, verb, vColor, msg, detail) {
  const cursorRow = feed.lastElementChild;
  const el = document.createElement('div');
  el.className = 'log-line';
  el.innerHTML = `<span class="t">${esc(time)}</span><span class="v" style="color:${vColor}">${esc(verb)}</span>
    <span class="m">${esc(msg)}${detail ? ` <span class="d">${esc(detail)}</span>` : ''}</span>`;
  feed.insertBefore(el, cursorRow);
  logCount++;
  const rows = feed.querySelectorAll('.log-line');
  rows.forEach((r, i) => r.classList.toggle('old', i < rows.length - 17 && r !== cursorRow));
  if (logCount > 300) feed.removeChild(feed.firstElementChild);
  feed.scrollTop = feed.scrollHeight;
}

const NOISE_DIRS = ['specs', 'in-progress', 'tests', 'in-review', 'done', 'triage', 'intents', 'threads', '_metrics', 'context', 'outcome'];
function classify(e) {
  const ok = '#6fae84', info = '#9b8cf0', warn = '#e2a55e', bad = '#d96a5a', dim = '#8a8070';
  // Defense in depth: server already drops tl-clitest-* fixtures; skip if any leak.
  if (e.ws && /^tl-clitest-/.test(e.ws)) return null;
  if (e.log) {
    const l = e.log.line || {};
    switch (e.log.file) {
      case 'triage-log': return ['TRIAGE', warn, `${l.total ?? '?'} specs ranked`, `${l.overrides_detected ?? 0} overrides`];
      case 'override-log': return ['HUMAN', warn, `override ${l.spec}`, `${l.from} → ${l.to}`];
      case 'capture-log': return ['BUG', bad, `${l.spec}`, `${l.affected_users ?? '?'} users`];
      case 'dedup-log': return ['DEDUP', dim, `merged ${l.merged ?? 0}, closed ${l.auto_closed ?? 0}`, ''];
      case 'cycle-log': return ['DONE', ok, `${l.spec}`, 'spec completed'];
      default: return ['LOG', dim, e.log.file + '.jsonl', '+1 line'];
    }
  }
  // Server-paired lifecycle move (specs/foo → in-progress/foo, etc.)
  if (e.move && e.move.from && e.move.to) {
    return ['MOVE', info, `${e.move.from}/ → ${e.move.to}/`, 'lifecycle'];
  }
  const p = e.path || '';
  if (!e.log && e.exists && !/\.\w+$/.test(p)) {
    const segs = p.split('/');
    if (NOISE_DIRS.includes(segs[segs.length - 1])) return null;
    return ['NEW', info, p, 'folder'];
  }
  if (!e.exists) return ['DEL', bad, p, 'deleted'];
  const d = e.change ? `+${e.change.added}${e.change.removed ? ' −' + e.change.removed : ''}` : '';
  if (/^threads\//.test(p)) return ['THREAD', info, p.replace(/^threads\//, ''), e.change && e.change.status === 'A' ? 'captured' : 'updated'];
  if (/priorities\.md$/i.test(p)) return ['RANK', warn, 'PRIORITIES.md rewritten', d];
  if (/triage\.yml$/i.test(p)) return ['LOGIC', warn, 'TRIAGE.yml edited', d];
  if (/feedback\.md$/i.test(p)) return ['FEEDBK', ok, p, d];
  return ['WRITE', ok, p, d];
}

/* ── file viewer ── */
function colorLine(raw) {
  if (!raw.trim()) return '&nbsp;';
  const t = raw.trim();
  if (t.startsWith('//') || (t.startsWith('#') && !t.startsWith('#!'))) return `<span class="cmt">${esc(raw)}</span>`;
  // tokenize on the RAW line, escape per-part — never re-scan injected HTML
  const strRx = /"[^"]*"|'[^']*'|`[^`]*`/g;
  const kwRx = /\b(import|export|from|const|let|var|async|await|return|new|class|interface|type|function|if|else|for|while|static|private|public|true|false|null|undefined|string|number|boolean|void|extends|implements)\b/g;
  const marks = [];
  let m;
  while ((m = strRx.exec(raw)) !== null) marks.push({ s: m.index, e: m.index + m[0].length, c: 'str' });
  while ((m = kwRx.exec(raw)) !== null) {
    if (!marks.some(x => m.index >= x.s && m.index < x.e)) marks.push({ s: m.index, e: m.index + m[0].length, c: 'kw' });
  }
  marks.sort((a, b) => a.s - b.s);
  let out = '', last = 0;
  for (const mk of marks) {
    if (mk.s < last) continue;
    out += esc(raw.slice(last, mk.s)) + `<span class="${mk.c}">` + esc(raw.slice(mk.s, mk.e)) + '</span>';
    last = mk.e;
  }
  return out + esc(raw.slice(last));
}
let viewerToken = 0;
async function showFile(ws, path, addedSet) {
  activeFileKey = ws + '|' + path;
  renderTree();
  const tok = ++viewerToken;
  const r = await fetch(`/api/file?ws=${encodeURIComponent(ws)}&path=${encodeURIComponent(path)}`);
  if (!r.ok || tok !== viewerToken) return;
  const f = await r.json();
  const segs = path.split('/');
  const fname = segs.pop();
  $('crumb').innerHTML = `<span class="crumb">${esc(ws)} / ${segs.map(esc).join(' / ')}${segs.length ? ' / ' : ''}<b>${esc(fname)}</b></span>` +
    (addedSet ? `<span class="crumb writing"><span class="pulse"></span>writing</span>` : '');
  const lines = f.content.split('\n');
  let html = '<table class="code"><tbody>';
  lines.forEach((line, i) => {
    const isAdded = addedSet && addedSet.has(line.slice(0, 200));
    html += `<tr${isAdded ? ' class="added"' : ''}><td class="ln">${i + 1}</td><td class="cl">${colorLine(line)}</td></tr>`;
  });
  html += '</tbody></table>';
  const v = $('viewer');
  v.innerHTML = html;
  const firstAdded = v.querySelector('tr.added');
  if (firstAdded) firstAdded.scrollIntoView({ block: 'center' });
}

/* ── events ── */
let refreshTimer = null;
let agentPulseTimer = null;
let agentWorkActive = false;
function setAgentLive(active) {
  agentWorkActive = !!active;
  const agentDot = document.querySelector('#liveTab .live-dot');
  if (agentDot) agentDot.classList.toggle('on', agentWorkActive);
}
function connectEvents() {
  const es = new EventSource('/api/events');
  es.onopen = () => { $('termDot').classList.remove('off'); logLine(new Date().toLocaleTimeString('en-GB', { hour12: false }), 'WATCH', '#8a8070', 'watching for changes…', ''); };
  es.onerror = () => $('termDot').classList.add('off');
  let lastSig = '', lastAt = 0;
  es.onmessage = ev => {
    let e; try { e = JSON.parse(ev.data); } catch { return; }
    if (!e.path && !e.log) return;
    // any workspace file change = agents at work → pulse the Agent tab dot, decaying when quiet
    const agentDot = document.querySelector('#liveTab .live-dot');
    if (agentDot) {
      agentDot.classList.add('on');
      clearTimeout(agentPulseTimer);
      agentPulseTimer = setTimeout(() => { if (!agentWorkActive) agentDot.classList.remove('on'); }, 4000);
    }
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(() => {
      const editing = document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT');
      if (!editing) loadSelected();
      loadTrees();
      // keep the experiments dashboard live when a queue/artifact file changes
      if (/_experiments\//.test(e.path || '')) {
        if (expVisible() && !editing) renderExperimentList();
        else if (!editing) loadSelected();
      }
    }, 600);
    if (e.exists && /\.(md|yml|yaml|jsonl)$/.test(e.path || '') && !e.change) return;

    if (e.change) {
      const key = e.ws + '|' + e.path;
      changeMeta.set(key, e.change);
      warm(key);
      const row = document.querySelector(`.tn[data-key="${CSS.escape(key)}"]`);
      if (row) { row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash'); }
    }

    // live file viewer follows writes to markdown/yaml (skip logs)
    if (e.diff && selected.includes(e.ws) && !/\.jsonl$/.test(e.path)) {
      const addedSet = new Set((e.diff.hunks || []).filter(h => h.t === '+').map(h => h.s));
      if (agentVisible()) showFile(e.ws, e.path, addedSet);
    }

    const c = classify(e);
    if (!c) return;
    const sig = e.ws + '|' + c[0] + c[2];
    if (sig === lastSig && Date.now() - lastAt < 2500) return;
    lastSig = sig; lastAt = Date.now();
    const multi = selected.length > 1;
    logLine(new Date().toLocaleTimeString('en-GB', { hour12: false }), c[0].padEnd(6), c[1],
      (multi && e.ws ? e.ws + '/' : '') + c[2], c[3]);
  };
}

/* ── modes: sliding workspace — human · split · agent · split-exp · experiments ── */
const MODE_CLASSES = ['m-human', 'm-split', 'm-agent', 'm-split-exp', 'm-experiments'];
const agentVisible = () => document.body.classList.contains('m-agent') || document.body.classList.contains('m-split') || document.body.classList.contains('m-split-exp');
const expVisible = () => document.body.classList.contains('m-experiments') || document.body.classList.contains('m-split-exp');
function setMode(mode) {
  if (!['human', 'split', 'agent', 'split-exp', 'experiments'].includes(mode)) mode = 'human';
  document.body.classList.remove(...MODE_CLASSES);
  document.body.classList.add('m-' + mode);
  document.querySelectorAll('.bar .tab').forEach(b => b.classList.toggle('active', b.dataset.view === mode));
  localStorage.setItem('tl-view', mode);
  if (mode === 'agent' || mode === 'split' || mode === 'split-exp') renderTree();
  if (mode === 'experiments' || mode === 'split-exp') renderExperimentList();
}
$('expNew').onclick = () => openExperimentQueueForm(selected[0]);
document.querySelectorAll('.bar .tab').forEach(btn => { btn.onclick = () => setMode(btn.dataset.view); });

/* ── selection + boot ── */
let available = [], selected = [];

function syncButton() {
  $('wsBtn').textContent = selected.length === 1 ? selected[0] : `${selected.length} projects`;
}
async function loadSelected() {
  const wss = await Promise.all(selected.map(n =>
    fetch('/api/ws/' + encodeURIComponent(n)).then(r => r.json())));
  renderResume(wss);
  renderLanes(wss);
  setAgentLive(wss.some(w => (w.specs || []).some(s => s.stage === 'in-progress' || s.stage === 'tests')));
  syncButton();
  // Live Trace (and drawer) refresh: when SSE reloads the workspace payload
  // while a spec drawer is open, re-bind from the fresh item (incl. TRACE.jsonl).
  if (openDrawerKey && document.body.classList.contains('open')) {
    const bar = openDrawerKey.indexOf('|');
    const wsName = openDrawerKey.slice(0, bar);
    const specPath = openDrawerKey.slice(bar + 1);
    const ws = wss.find(w => w.name === wsName);
    const s = ws && (ws.specs || []).find(x => x.path === specPath);
    if (s) openDrawer({ ...s, _ws: ws.name, _verifyRequests: ws.verifyRequests || [] });
  }
}
function buildPanel() {
  $('wsPanel').innerHTML = '';
  available.forEach(w => {
    const l = document.createElement('label');
    l.className = 'msel-item';
    l.innerHTML = `<input type="checkbox" ${selected.includes(w.name) ? 'checked' : ''}>
      <span>${esc(w.name)}</span>${w.example ? '<span class="ex">example</span>' : ''}`;
    l.querySelector('input').onchange = e => {
      if (e.target.checked) selected.push(w.name);
      else selected = selected.filter(n => n !== w.name);
      if (!selected.length) { selected = [w.name]; e.target.checked = true; return; }
      localStorage.setItem('tl-sel', JSON.stringify(selected));
      expActiveId = null;   // experiments are per-workspace — reset the selection
      loadSelected(); loadTrees();
      if (expVisible()) renderExperimentList();
    };
    $('wsPanel').appendChild(l);
  });
}
$('wsBtn').onclick = () => $('msel').classList.toggle('open');
addEventListener('click', e => { if (!e.target.closest('.msel')) $('msel').classList.remove('open'); });

async function seedChanges() {
  const list = await (await fetch('/api/changes')).json();
  for (const c of list) changeMeta.set(c.ws + '|' + c.path, c);
}

async function boot() {
  connectEvents();
  available = await (await fetch('/api/workspaces')).json();
  if (!available.length) { $('paper').innerHTML = '<div class="empty">No workspaces found — run /tl:new</div>'; return; }
  try { selected = JSON.parse(localStorage.getItem('tl-sel') || '[]').filter(n => available.some(w => w.name === n)); }
  catch { selected = []; }
  if (!selected.length) selected = [available[0].name];
  buildPanel();
  addEventListener('focus', loadSelected);
  await seedChanges();
  await loadSelected();
  await loadTrees();
  const saved = localStorage.getItem('tl-view');
  const mode = saved === 'live' ? 'agent' : saved === 'resume' ? 'human' : saved || 'human';
  setMode(['human', 'split', 'agent', 'split-exp', 'experiments'].includes(mode) ? mode : 'human');
}
boot();
