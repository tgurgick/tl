<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Throughline</title>
<link rel="icon" href="/logo.png">
<style>
:root {
  --bg: #f7f6f3;
  --card: #fffefb;
  --lane: rgba(47,46,43,.035);
  --ink: #2f2e2b;
  --muted: #8a877f;
  --faint: #b9b6ae;
  --line: rgba(47,46,43,.08);
  --line-strong: rgba(47,46,43,.16);
  --accent: #3b3a36;
  --danger: #b4543a;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161614;
    --card: #1e1d1a;
    --lane: rgba(233,231,225,.04);
    --ink: #e9e7e1;
    --muted: #8f8c84;
    --faint: #5c5a54;
    --line: rgba(233,231,225,.08);
    --line-strong: rgba(233,231,225,.18);
    --accent: #d8d6cf;
    --danger: #d4795f;
  }
}
* { box-sizing: border-box; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }

.wrap { max-width: 1180px; margin: 0 auto; padding: 26px 32px 80px; }

header { display: flex; align-items: center; gap: 13px; margin-bottom: 28px; }
header img { width: 40px; height: auto; }
header .name { font-size: 17px; font-weight: 500; letter-spacing: -0.2px; }
header .spacer { flex: 1; }

/* project multi-select */
.msel { position: relative; }
.msel > button {
  background: var(--card); border: 1px solid var(--line-strong); color: var(--ink);
  border-radius: 10px; padding: 7px 14px; font: inherit; font-size: 14px; cursor: pointer;
}
.msel-panel {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 6;
  background: var(--card); border: 1px solid var(--line-strong); border-radius: 12px;
  padding: 7px; min-width: 220px; display: none;
  box-shadow: 0 10px 30px rgba(20,19,17,.10);
}
.msel.open .msel-panel { display: block; }
.msel-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px;
  border-radius: 8px; font-size: 14px; cursor: pointer;
}
.msel-item:hover { background: var(--lane); }
.msel-item input { accent-color: var(--accent); }
.msel-item .ex { color: var(--faint); font-size: 12px; }

.tabs { display: flex; gap: 26px; border-bottom: 1px solid var(--line); margin-bottom: 26px; }
.tab {
  background: none; border: none; font: inherit; font-size: 14px; color: var(--muted);
  padding: 0 1px 11px; cursor: pointer; border-bottom: 1.5px solid transparent; margin-bottom: -1px;
}
.tab:hover { color: var(--ink); }
.tab.active { color: var(--ink); border-color: var(--ink); }

.label {
  font-size: 11px; font-weight: 500; letter-spacing: 1.4px; text-transform: uppercase;
  color: var(--muted);
}

/* board: swimlanes */
.cols-head { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding-bottom: 10px; }
.cols-head .label { padding-left: 4px; }
.swimlane { border-top: 1px solid var(--line); padding: 15px 0 20px; }
.lane-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.lane-title { font-size: 14px; font-weight: 500; }
.lane-proj { color: var(--muted); font-weight: 400; }
.lane-meta { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); }
.lane-meta .p0flag { color: var(--danger); }
.progress { width: 64px; height: 3px; background: var(--line); border-radius: 2px; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.lane-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.cell { display: flex; flex-direction: column; gap: 8px; }

.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
  padding: 12px 14px; cursor: pointer; transition: border-color .12s, transform .12s;
  font-size: 14px; font-weight: 500; line-height: 1.4;
}
.card:hover { border-color: var(--line-strong); transform: translateY(-1px); }
.card .dot {
  display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  background: var(--danger); margin-right: 8px; vertical-align: 1px;
}
.card.dim { color: var(--muted); font-weight: 400; }

/* backlog */
.blog-row {
  display: flex; align-items: baseline; gap: 14px; padding: 13px 6px;
  border-bottom: 1px solid var(--line); cursor: pointer;
}
.blog-row:hover { background: var(--lane); }
.rank { font-size: 12px; color: var(--faint); min-width: 20px; text-align: right; font-variant-numeric: tabular-nums; }
.blog-title { font-size: 14px; font-weight: 500; }
.blog-sub { font-size: 12.5px; color: var(--muted); }
.blog-p { margin-left: auto; font-size: 12px; color: var(--muted); letter-spacing: .4px; }
.blog-p.p0 { color: var(--danger); }
.section-gap { margin-top: 34px; }
.empty { font-size: 13px; color: var(--faint); padding: 8px 4px; }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(20,19,17,.32); opacity: 0; pointer-events: none; transition: opacity .18s; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 92vw);
  background: var(--card); border-left: 1px solid var(--line);
  transform: translateX(102%); transition: transform .22s cubic-bezier(.3,.8,.3,1);
  overflow-y: auto; padding: 30px 34px 60px;
}
.open .scrim { opacity: 1; pointer-events: auto; }
.open .drawer { transform: none; }
.drawer .path { font-size: 12px; color: var(--faint); font-family: ui-monospace, "SF Mono", Menlo, monospace; margin-bottom: 10px; }
.drawer h2 { font-size: 19px; font-weight: 500; letter-spacing: -0.2px; margin-bottom: 14px; }
.drawer .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 24px; }
.pill {
  font-size: 11px; letter-spacing: .3px; color: var(--muted);
  border: 1px solid var(--line-strong); border-radius: 999px; padding: 1.5px 9px;
}
.pill.p0 { color: var(--danger); border-color: var(--danger); }
.md { font-size: 14.5px; }
.md h1, .md h2, .md h3 { font-size: 13px; font-weight: 500; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin: 26px 0 10px; }
.md p { margin: 0 0 12px; }
.md ul { margin: 0 0 12px; padding-left: 20px; }
.md li { margin-bottom: 4px; }
.md code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; background: var(--line); border-radius: 5px; padding: 1.5px 5px; }
.md pre { background: var(--line); border-radius: 10px; padding: 14px 16px; overflow-x: auto; margin: 0 0 12px; }
.md pre code { background: none; padding: 0; }
.md table { border-collapse: collapse; margin: 0 0 14px; width: 100%; font-size: 13.5px; }
.md th { text-align: left; font-weight: 500; color: var(--muted); }
.md th, .md td { border-bottom: 1px solid var(--line); padding: 6px 10px 6px 0; }
.md blockquote { border-left: 2px solid var(--line-strong); padding-left: 14px; color: var(--muted); margin: 0 0 12px; }
.md input[type=checkbox] { accent-color: var(--accent); margin-right: 6px; }
.footnote { margin-top: 60px; text-align: center; font-size: 12px; color: var(--faint); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="/logo.png" alt="">
    <span class="name">Throughline</span>
    <span class="spacer"></span>
    <div class="msel" id="msel">
      <button id="wsBtn" aria-haspopup="true">projects</button>
      <div class="msel-panel" id="wsPanel"></div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-view="board" role="tab">Board</button>
    <button class="tab" data-view="backlog" role="tab">Backlog</button>
  </nav>

  <section id="view-board"></section>
  <section id="view-backlog" hidden></section>

  <div class="footnote">read-only — every change is a file edit · git is the database</div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Detail"></aside>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PRIO = { p0: 0, p1: 1, p2: 2, p3: 3 };

// --- tiny markdown renderer ---
function inline(s) {
  return s
    .replace(/`([^`]+)`/g, (_, c) => '<code>' + c + '</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src) {
  const lines = esc(src).split('\n');
  let html = '', i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) {
      let code = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
      i++;
      html += '<pre><code>' + code.join('\n') + '</code></pre>';
    } else if (/^#{1,4}\s/.test(l)) {
      const level = Math.min(l.match(/^#+/)[0].length, 3);
      html += `<h${level}>` + inline(l.replace(/^#+\s*/, '')) + `</h${level}>`;
      i++;
    } else if (/^\s*[-*]\s/.test(l)) {
      let items = [];
      while (i < lines.length && /^\s*[-*]\s/.test(lines[i])) {
        let it = lines[i].replace(/^\s*[-*]\s/, '');
        it = it.replace(/^\[([ xX])\]\s*/, (_, c) =>
          `<input type="checkbox" disabled${c.trim() ? ' checked' : ''}>`);
        items.push('<li>' + inline(it) + '</li>'); i++;
      }
      html += '<ul>' + items.join('') + '</ul>';
    } else if (/^\|/.test(l)) {
      let rows = [];
      while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i]); i++; }
      const cells = r => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      let t = '<table>';
      rows.forEach((r, idx) => {
        if (/^\|[\s:|-]+\|$/.test(r)) return;
        const tag = idx === 0 ? 'th' : 'td';
        t += '<tr>' + cells(r).map(c => `<${tag}>` + inline(c) + `</${tag}>`).join('') + '</tr>';
      });
      html += t + '</table>';
    } else if (/^>\s?/.test(l)) {
      let q = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) { q.push(lines[i].replace(/^>\s?/, '')); i++; }
      html += '<blockquote>' + inline(q.join(' ')) + '</blockquote>';
    } else if (/^---+\s*$/.test(l)) { html += '<hr>'; i++; }
    else if (!l.trim()) { i++; }
    else {
      let p = [];
      while (i < lines.length && lines[i].trim() && !/^(#|```|\||>|---|\s*[-*]\s)/.test(lines[i])) { p.push(lines[i]); i++; }
      html += '<p>' + inline(p.join(' ')) + '</p>';
    }
  }
  return html;
}

// --- drawer ---
function openDrawer(item) {
  const meta = item.meta || {};
  let pills = '';
  const p = (meta.priority || '').toLowerCase();
  if (p) pills += `<span class="pill ${p}">${esc(p.toUpperCase())}</span>`;
  for (const k of ['type', 'size', 'status']) if (meta[k]) pills += `<span class="pill">${esc(String(meta[k]).replace('_',' '))}</span>`;
  if (item._ws) pills += `<span class="pill">${esc(item._ws)}</span>`;
  const body = (item.body || '').replace(/^\s*# .*\n+/, '');
  $('drawer').innerHTML = `
    <div class="path">${esc(item.path || '')}</div>
    <h2>${esc(item.title)}</h2>
    <div class="meta">${pills}</div>
    <div class="md">${md(body)}</div>`;
  document.body.classList.add('open');
}
$('scrim').onclick = () => document.body.classList.remove('open');
addEventListener('keydown', e => { if (e.key === 'Escape') document.body.classList.remove('open'); });

// --- board (swimlanes) ---
const STAGES = ['triage', 'ready', 'in-progress', 'done'];
const STAGE_NAMES = { triage: 'Triage', ready: 'Ready', 'in-progress': 'In progress', done: 'Done' };

function specCard(s) {
  const el = document.createElement('div');
  el.className = 'card' + (s.meta.status === 'blocked' ? ' dim' : '');
  el.innerHTML = (s.meta.priority === 'p0' ? '<span class="dot"></span>' : '') + esc(s.title);
  el.onclick = () => openDrawer(s);
  return el;
}

function renderBoard(wss) {
  const root = $('view-board');
  root.innerHTML = '';
  const multi = wss.length > 1;

  const head = document.createElement('div');
  head.className = 'cols-head';
  head.innerHTML = STAGES.map(s => `<span class="label">${STAGE_NAMES[s]}</span>`).join('');
  root.appendChild(head);

  const lanes = [];
  for (const ws of wss) {
    for (const intent of ws.intents) {
      lanes.push({ ws: ws.name, intent, key: ws.name + '|' + intent.path, specs: [] });
    }
  }
  const unattached = { ws: null, intent: null, specs: [] };
  for (const ws of wss) {
    for (const s of ws.specs) {
      s._ws = ws.name;
      const ip = (s.meta.intent || '').replace(/^\.\//, '').trim();
      const lane = ip && lanes.find(l => l.ws === ws.name && l.intent.path === ip);
      (lane || unattached).specs.push(s);
    }
  }
  lanes.sort((a, b) =>
    (PRIO[a.intent.meta.priority] ?? 9) - (PRIO[b.intent.meta.priority] ?? 9) ||
    a.intent.title.localeCompare(b.intent.title));
  if (unattached.specs.length) lanes.push(unattached);

  if (!lanes.length) {
    root.innerHTML += '<div class="empty">Nothing here yet — run /tl:new to start a project.</div>';
    return;
  }

  for (const lane of lanes) {
    const el = document.createElement('div');
    el.className = 'swimlane';

    const total = lane.specs.length;
    const done = lane.specs.filter(s => s.stage === 'done').length;
    const p0 = lane.specs.filter(s => s.meta.priority === 'p0' && s.stage !== 'done').length;
    const top = document.createElement('div');
    top.className = 'lane-top';
    const title = lane.intent
      ? `${multi ? `<span class="lane-proj">${esc(lane.ws)} / </span>` : ''}<span class="lane-title">${esc(lane.intent.title)}</span>`
      : '<span class="lane-title" style="color:var(--muted)">Unattached</span>';
    top.innerHTML = `${title}
      <span class="lane-meta">
        ${p0 ? `<span class="p0flag">${p0} p0</span>` : ''}
        ${total ? `<span>${done}/${total} done</span><span class="progress"><i style="width:${total ? Math.round(done / total * 100) : 0}%"></i></span>` : '<span>no specs yet</span>'}
      </span>`;
    if (lane.intent) {
      top.style.cursor = 'pointer';
      top.onclick = e => { if (!e.target.closest('.lane-meta')) openDrawer({ ...lane.intent, _ws: lane.ws }); };
    }
    el.appendChild(top);

    const grid = document.createElement('div');
    grid.className = 'lane-grid';
    for (const stage of STAGES) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      lane.specs.filter(s => s.stage === stage).forEach(s => cell.appendChild(specCard(s)));
      grid.appendChild(cell);
    }
    el.appendChild(grid);
    root.appendChild(el);
  }
}

// --- backlog ---
function renderBacklog(wss) {
  const root = $('view-backlog');
  root.innerHTML = '';
  const multi = wss.length > 1;
  const all = [];
  for (const ws of wss) for (const s of ws.specs) { s._ws = ws.name; all.push(s); }

  const ranked = all.filter(s => s.stage === 'ready')
    .sort((a, b) => (PRIO[a.meta.priority] ?? 9) - (PRIO[b.meta.priority] ?? 9) || a.title.localeCompare(b.title));
  const untriaged = all.filter(s => s.stage === 'triage');

  const intentName = s => {
    const ws = wss.find(w => w.name === s._ws);
    const ip = (s.meta.intent || '').replace(/^\.\//, '').trim();
    const it = ws && ws.intents.find(i => i.path === ip);
    return it ? it.title : null;
  };
  const row = (s, n) => {
    const el = document.createElement('div');
    el.className = 'blog-row';
    const sub = [intentName(s), multi ? s._ws : null].filter(Boolean).join(' · ');
    const p = (s.meta.priority || '').toLowerCase();
    el.innerHTML = `<span class="rank">${n ?? ''}</span>
      <span class="blog-title">${esc(s.title)}</span>
      ${sub ? `<span class="blog-sub">${esc(sub)}</span>` : ''}
      <span class="blog-p ${p}">${esc(p.toUpperCase())}</span>`;
    el.onclick = () => openDrawer(s);
    return el;
  };

  if (!ranked.length && !untriaged.length) {
    root.innerHTML = '<div class="empty">Backlog is empty.</div>';
    return;
  }
  ranked.forEach((s, i) => root.appendChild(row(s, i + 1)));
  if (untriaged.length) {
    const h = document.createElement('div');
    h.className = 'label section-gap';
    h.style.display = 'block';
    h.textContent = 'Untriaged';
    root.appendChild(h);
    untriaged.forEach(s => root.appendChild(row(s)));
  }
}

// --- tabs ---
document.querySelectorAll('.tab').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b === btn));
    $('view-board').hidden = btn.dataset.view !== 'board';
    $('view-backlog').hidden = btn.dataset.view !== 'backlog';
    localStorage.setItem('tl-view', btn.dataset.view);
  };
});
const savedView = localStorage.getItem('tl-view');
if (savedView === 'backlog') document.querySelector('.tab[data-view="backlog"]')?.click();

// --- project selection + boot ---
let available = [], selected = [];

function syncButton() {
  $('wsBtn').textContent = selected.length === 1 ? selected[0] : `${selected.length} projects`;
}
async function loadSelected() {
  const wss = await Promise.all(selected.map(n =>
    fetch('/api/ws/' + encodeURIComponent(n)).then(r => r.json())));
  renderBoard(wss);
  renderBacklog(wss);
  syncButton();
}
function buildPanel() {
  $('wsPanel').innerHTML = '';
  available.forEach(w => {
    const l = document.createElement('label');
    l.className = 'msel-item';
    l.innerHTML = `<input type="checkbox" ${selected.includes(w.name) ? 'checked' : ''}>
      <span>${esc(w.name)}</span>${w.example ? '<span class="ex">example</span>' : ''}`;
    l.querySelector('input').onchange = e => {
      if (e.target.checked) selected.push(w.name);
      else selected = selected.filter(n => n !== w.name);
      if (!selected.length) { selected = [w.name]; e.target.checked = true; return; }
      localStorage.setItem('tl-sel', JSON.stringify(selected));
      loadSelected();
    };
    $('wsPanel').appendChild(l);
  });
}
$('wsBtn').onclick = () => $('msel').classList.toggle('open');
addEventListener('click', e => { if (!e.target.closest('.msel')) $('msel').classList.remove('open'); });

async function boot() {
  available = await (await fetch('/api/workspaces')).json();
  if (!available.length) { $('view-board').innerHTML = '<div class="empty">No workspaces found — run /tl:new</div>'; return; }
  try { selected = JSON.parse(localStorage.getItem('tl-sel') || '[]').filter(n => available.some(w => w.name === n)); }
  catch { selected = []; }
  if (!selected.length) selected = [available[0].name];
  buildPanel();
  addEventListener('focus', loadSelected);
  await loadSelected();
}
boot();
</script>
</body>
</html>
