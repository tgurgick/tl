<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Throughline</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f3f0e8'/%3E%3Ctext x='16' y='23' font-family='ui-monospace,SFMono-Regular,monospace' font-size='19' font-weight='600' fill='%231c1916' text-anchor='middle'%3Etl%3C/text%3E%3C/svg%3E">
<style>
/* ── tokens: Resume = warm journal (light) · Live Look = mission control (dark) ── */
:root {
  --bg: #faf8f3;
  --surface: #f3f0e8;
  --surface2: #ede9de;
  --line: rgba(0,0,0,.09);
  --line2: rgba(0,0,0,.14);
  --ink: #1c1916;
  --mid: #4a4540;
  --dim: #8a8070;
  --faint: #c9c2b4;
  --accent: #b5712a;
  --accent-bg: #fdf3e3;
  --accent-line: rgba(181,113,42,.22);
  --ok: #3a7d55;
  --warn: #c0622a;
  --bad: #a83232;
  --info: #6b57c7;
  --serif: 'Iowan Old Style', 'Palatino', Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
.agent {
  --bg: #1c1916;
  --surface: #26211c;
  --surface2: #211d18;
  --line: rgba(255,255,255,.07);
  --line2: rgba(255,255,255,.13);
  --ink: #e8e3d8;
  --mid: #a89f8d;
  --dim: #8a8070;
  --faint: #5c554a;
  --accent: #e2a55e;
  --accent-bg: rgba(226,165,94,.12);
  --accent-line: rgba(226,165,94,.30);
  --ok: #6fae84;
  --warn: #d4895f;
  --bad: #d96a5a;
  --info: #9b8cf0;
  background: var(--bg); color: var(--ink);
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }

/* modes: sliding workspace — human · split · agent · split-exp · experiments */
.stage { display: flex; height: calc(100vh - 49px); overflow: hidden; background: var(--bg); transition: background .2s ease; }
/* dark backdrop behind the agent-side panes so a sliding/fading dark pane never
   reveals the light body background (the white flash between Agent ↔ Experiments) */
body.m-agent .stage, body.m-split-exp .stage, body.m-experiments .stage { background: #1c1916; }
.pane { min-width: 0; }
.human { overflow-y: auto; }
.agent { display: flex; flex-direction: column; overflow: hidden; }
#view-resume,
#view-live,
#view-experiments {
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  min-width: 0;
  overflow: hidden;
  transition:
    flex-basis 0.34s cubic-bezier(.25,.8,.25,1),
    max-width 0.34s cubic-bezier(.25,.8,.25,1),
    opacity 0.26s ease,
    transform 0.34s cubic-bezier(.25,.8,.25,1);
}
#view-resume { flex: 1 1 auto; max-width: 100%; opacity: 1; transform: none; }
#view-live, #view-experiments { flex: 0 0 0; max-width: 0; opacity: 0; pointer-events: none; transform: translateX(10px); }

body.m-human #view-resume { flex: 1 1 100%; max-width: 100%; opacity: 1; pointer-events: auto; transform: none; }
body.m-human #view-live, body.m-human #view-experiments { flex: 0 0 0; max-width: 0; opacity: 0; pointer-events: none; }

body.m-split #view-resume { flex: 0 0 384px; max-width: 384px; opacity: 1; pointer-events: auto; transform: none; border-right: 1px solid var(--line2); }
body.m-split #view-live { flex: 1 1 auto; max-width: none; opacity: 1; pointer-events: auto; transform: none; }
body.m-split #view-experiments { flex: 0 0 0; max-width: 0; opacity: 0; pointer-events: none; }

body.m-agent #view-resume { flex: 0 0 0; max-width: 0; opacity: 0; pointer-events: none; transform: translateX(-14px); }
body.m-agent #view-live { flex: 1 1 100%; max-width: 100%; opacity: 1; pointer-events: auto; transform: none; }
body.m-agent #view-experiments { flex: 0 0 0; max-width: 0; opacity: 0; pointer-events: none; }

body.m-split-exp #view-resume { flex: 0 0 0; max-width: 0; opacity: 0; pointer-events: none; transform: translateX(-14px); }
body.m-split-exp #view-live { flex: 1 1 auto; max-width: none; opacity: 1; pointer-events: auto; transform: none; }
body.m-split-exp #view-experiments { flex: 0 0 30%; max-width: none; opacity: 1; pointer-events: auto; transform: none; border-left: 1px solid var(--line2); }
/* narrow experiments (split-exp): drop the queue list, let the detail take the
   full column and stack its sections so it scrolls instead of cramping */
body.m-split-exp .exp-queue { display: none; }
body.m-split-exp .exp-cards { grid-template-columns: 1fr; }
body.m-split-exp .exp-diffs { flex-direction: column; overflow-x: hidden; }
body.m-split-exp .exp-diff-col { min-width: 0; }

body.m-experiments #view-resume { flex: 0 0 0; max-width: 0; opacity: 0; pointer-events: none; transform: translateX(-14px); }
/* the agent pane is an unchanging flex-grow filler (identical flex in both states, so
   nothing about it snaps) and only experiments' flex-basis animates, 30%->100% — a
   pure %->% interpolation. the filler tracks 100%-experiments each frame, so there is
   no dark void. experiments is the last flex child, so its right edge stays pinned and
   it sweeps open right→left. */
body.m-experiments #view-live { flex: 1 1 auto; max-width: none; opacity: 0; pointer-events: none; transform: translateX(-14px); }
body.m-experiments #view-experiments { flex: 0 0 100%; max-width: none; opacity: 1; pointer-events: auto; transform: none; }

@media (max-width: 1000px) {
  body.m-split #view-resume { flex-basis: 320px; max-width: 320px; }
  body.m-split-exp #view-experiments { flex-basis: 38%; }
}
.mono { font-family: var(--mono); }

@keyframes tl-pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
@keyframes tl-blink { 0%,100% { opacity: 1 } 50% { opacity: 0 } }
@keyframes tl-flash { 0% { background: rgba(245,158,11,.18) } 100% { background: transparent } }

/* ── top bar ── */
.bar {
  position: sticky; top: 0; z-index: 20; height: 49px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 94%, transparent);
  backdrop-filter: blur(8px);
}
.bar .word { display: flex; align-items: center; gap: 10px; font-family: var(--mono); }
.bar .tlmark { font-size: .78rem; color: var(--ink); letter-spacing: -.01em; }
.bar .sep { color: var(--faint); }
.bar .proj {
  font-size: .7rem; color: var(--dim); background: none; border: none;
  font-family: var(--mono); cursor: pointer; padding: 4px 2px;
}
.bar .proj:hover { color: var(--ink); }
.bar nav { display: flex; gap: 2px; }
.bar .tab {
  font-family: var(--mono); font-size: .68rem; letter-spacing: .02em;
  color: var(--dim); background: transparent; border: none; border-radius: 3px;
  padding: 5px 12px; cursor: pointer; display: flex; align-items: center; gap: 6px;
}
.bar .tab[data-view="split"], .bar .tab[data-view="split-exp"] { min-width: 30px; justify-content: center; padding-inline: 8px; font-size: .82rem; color: var(--faint); }
.bar .tab[data-view="split"]:hover, .bar .tab[data-view="split-exp"]:hover { color: var(--dim); }
.bar .tab[data-view="split"].active, .bar .tab[data-view="split-exp"].active { color: var(--dim); }
.bar .tab:hover { color: var(--ink); }
.bar .tab.active { color: var(--ink); background: rgba(127,127,127,.12); }
/* tab activity dot — hidden unless agents are actively working, then it pulses. */
.bar .tab .live-dot { width: 6px; height: 6px; border-radius: 50%; display: none; }
.bar .tab .live-dot { background: #34d399; }
.bar .tab .live-dot.on { display: inline-block; animation: tl-pulse 2s infinite; }

/* project picker */
.msel { position: relative; }
.msel-panel {
  position: absolute; left: 0; top: calc(100% + 8px); z-index: 30;
  background: var(--bg); border: 1px solid var(--line2); border-radius: 4px;
  padding: 6px; min-width: 210px; display: none;
  box-shadow: 0 10px 30px rgba(0,0,0,.18);
}
.msel.open .msel-panel { display: block; }
.msel-item {
  display: flex; align-items: center; gap: 9px; padding: 7px 10px;
  border-radius: 3px; font-family: var(--mono); font-size: .7rem; cursor: pointer; color: var(--mid);
}
.msel-item:hover { background: var(--surface); }
.msel-item input { accent-color: var(--accent); }
.msel-item .ex { color: var(--faint); margin-left: auto; }

.label {
  font-family: var(--mono); font-size: .62rem; letter-spacing: .12em;
  text-transform: uppercase; color: var(--dim);
}

/* ════ RESUME (boarding pass) ════ */
#view-resume { min-height: calc(100vh - 49px); }
.resume-shell { display: flex; min-height: calc(100vh - 49px - 33px); }
.insights-rail {
  display: none; width: 384px; flex-shrink: 0;
  padding: 28px 26px 48px 28px; border-right: 1px solid var(--line);
  background: var(--surface);
  font-family: var(--mono); font-size: .66rem; color: var(--mid);
  transition: width 0.34s cubic-bezier(.25,.8,.25,1), opacity 0.24s ease, padding 0.34s ease, border-color 0.24s;
  overflow: hidden;
}
@media (max-width: 1000px) { body.m-human .insights-rail { width: 320px; } }
/* the human / split resume panes scroll — the #view-resume overflow:hidden above is
   for the slide animation; without this override, expanded content is cut off */
body.m-human #view-resume { flex-direction: column; overflow-y: auto; }
body.m-human .resume-shell { width: 100%; display: flex; }
body.m-human .insights-rail { display: block; position: sticky; top: 0; align-self: flex-start; height: calc(100vh - 49px - 33px); overflow-y: auto; }
body.m-human .datestrip > div { max-width: none; margin: 0; padding: 8px 32px; }
body.m-human .paper { flex: 1 1 auto; max-width: 60rem; margin: 0; padding: 40px 52px 80px; }
body.m-split #view-resume { flex-direction: column; overflow-y: auto; }
body.m-split .resume-shell { display: block; }
body.m-split .insights-rail { width: 0; opacity: 0; padding-left: 0; padding-right: 0; border-color: transparent; pointer-events: none; }
body.m-split .paper { max-width: none; padding: 28px 22px 60px; }
.ins-block + .ins-block { margin-top: 1.35rem; padding-top: 1.1rem; border-top: 1px solid var(--line); }
.ins-block .il { display: block; font-size: .58rem; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin-bottom: 6px; }
.ins-stat { font-size: 1.35rem; color: var(--ink); line-height: 1.1; margin: 0 0 2px; font-weight: 500; }
.ins-sub { color: var(--faint); font-size: .6rem; margin: 0 0 8px; }
.ins-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 3px 0; }
.ins-row .ir-l { display: flex; align-items: center; gap: 6px; min-width: 0; }
.ins-row .ir-l span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ins-row .ir-n { color: var(--ink); flex-shrink: 0; }
.ins-tool-meta { color: var(--faint); font-size: .58rem; margin: -1px 0 6px 0; padding-left: 0; }
.ins-highlight { margin-top: 8px; }
.ins-highlight .ih-task { color: var(--ink); font-size: .64rem; line-height: 1.45; margin: 0 0 5px; }
.ins-highlight .ih-winner { color: var(--mid); font-size: .6rem; margin: 0 0 4px; }
.ins-quiet { color: var(--faint); font-size: .6rem; line-height: 1.45; }
.datestrip { border-bottom: 1px solid var(--line); background: var(--surface); }
.datestrip > div {
  max-width: 40rem; margin: 0 auto; padding: 8px 24px;
  display: flex; justify-content: space-between;
  font-family: var(--mono); font-size: .65rem; color: var(--dim);
}
.paper { max-width: 40rem; margin: 0 auto; padding: 32px 24px 70px; }
.res-block + .res-block { margin-top: 2.6rem; padding-top: 2rem; border-top: 1px solid var(--line); }
.res-ws { font-family: var(--mono); font-size: .6rem; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin: 0 0 12px; }

.bp-status { font-family: var(--mono); font-size: .72rem; color: var(--mid); margin: 0 0 7px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.bp-status:hover { color: var(--ink); }
.bp-status .gl { color: var(--ok); }
.bp-status .just-done { color: var(--ok); }
.bp-status .age-inline { color: var(--faint); }
.bp-status .ar { color: var(--faint); transition: transform .12s; display: inline-block; }
.bp-status.open .ar { transform: rotate(90deg); }
/* read-only automation signal — observe only; never a spawn button */
.bp-auto { font-family: var(--mono); font-size: .68rem; color: var(--dim); margin: 0 0 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.bp-auto .al { letter-spacing: .08em; text-transform: uppercase; font-size: .58rem; color: var(--faint); }
.bp-auto .sig { color: var(--mid); }
.bp-auto .sig.up { color: var(--ok); }
.bp-auto .sig.paused { color: #b8893a; }
.bp-auto .sig.misconfigured { color: #b85a5a; }
.bp-auto .stuck { color: #b8893a; }

.bp-value { font-family: var(--serif); font-size: .82rem; font-style: italic; color: var(--mid); line-height: 1.5; margin: 0 0 10px; max-width: 62ch; cursor: pointer; }
.bp-value .vl { font-family: var(--mono); font-style: normal; font-size: .58rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ok); margin-right: 7px; }
.bp-value .vsrc { font-family: var(--mono); font-style: normal; font-size: .62rem; color: var(--faint); white-space: nowrap; }
.bp-value:hover .vt { color: var(--ink); }

/* reflect proposals — calm one-liner; silent when none are pending */
.bp-reflect { font-family: var(--mono); font-size: .68rem; color: var(--dim); margin: 0 0 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.bp-reflect:hover .rt { color: var(--ink); }
.bp-reflect .rl { letter-spacing: .08em; text-transform: uppercase; font-size: .58rem; color: var(--accent); }
.bp-reflect .rt { color: var(--mid); }
.bp-reflect .ar { color: var(--faint); transition: transform .12s; display: inline-block; }
.bp-reflect.open .ar { transform: rotate(90deg); }
.reflect-ex { margin-bottom: 16px; }
.reflect-ex .refl-md { display: none; padding: 12px 15px; margin: 4px 0 8px 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; max-height: 340px; overflow-y: auto; }
.reflect-ex .refl-md.open { display: block; }
.refl-note { font-family: var(--mono); font-size: .58rem; color: var(--faint); padding: 7px 0 2px; }

.bp-goal { font-family: var(--serif); font-size: .98rem; color: var(--ink); line-height: 1.4; margin: 0 0 26px; }
.bp-goal .gtext { border-bottom: 1px dashed transparent; cursor: text; }
.bp-goal .gtext:hover { border-bottom-color: var(--line2); }
.bp-goal .gmeta { font-family: var(--mono); font-size: .68rem; color: var(--dim); white-space: nowrap; }
.bp-goal .gmeta .wt { cursor: text; border-bottom: 1px dashed transparent; }
.bp-goal .gmeta .wt:hover { border-bottom-color: var(--line2); }
.bp-goal .gmeta .ed { color: var(--accent); cursor: pointer; }
.bp-goal input { font-family: inherit; font-size: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--accent-line); border-radius: 3px; padding: 3px 7px; }
.scope-ex { margin-bottom: 22px; }
.scope { padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; }
.scope .sl { display: block; font-family: var(--mono); font-size: .58rem; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin: 12px 0 5px; }
.scope .sl:first-of-type { margin-top: 4px; }
.scope input { width: 100%; font-family: var(--sans); font-size: .82rem; background: var(--card); border: 1px solid var(--line2); border-radius: 3px; padding: 6px 9px; color: var(--ink); margin-bottom: 5px; }
.scope input.s-wt { width: 80px; }
.scope-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
.scope-actions button { font-family: var(--mono); font-size: .62rem; border-radius: 3px; padding: 5px 13px; cursor: pointer; }
.scope-actions .s-cancel { background: transparent; border: 1px solid var(--line2); color: var(--dim); }
.scope-actions .s-save { background: var(--accent); border: 1px solid var(--accent); color: #fffefb; }

.hero { background: #1c1916; border: 1px solid rgba(181,113,42,.22); border-left: 3px solid #b5712a; border-radius: 2px; padding: 1.4rem 1.6rem; cursor: pointer; transition: background .12s; }
.hero.flat { cursor: default; }
.hero:not(.flat):hover { background: #211d19; }
.hero .head { display: flex; align-items: center; gap: 10px; margin-bottom: .6rem; }
.hero .fl { font-family: var(--mono); font-size: .62rem; letter-spacing: .12em; text-transform: uppercase; color: #e2a55e; }
.hero .chip { margin-left: auto; font-family: var(--mono); font-size: .62rem; color: #e2a55e; background: rgba(226,165,94,.12); padding: 2px 8px; border-radius: 2px; white-space: nowrap; }
.hero .chip.clear { color: #8fc7a0; background: rgba(58,125,85,.2); }
.hero .reason code { font-family: var(--mono); font-size: .92em; background: rgba(245,241,232,.1); padding: 1px 5px; border-radius: 3px; }
.hero .summary { font-family: var(--serif); font-size: 1.12rem; line-height: 1.45; color: #f5f1e8; margin: 0 0 .5rem; }
.hero .reason { font-size: .8rem; color: #a89f8d; margin: 0; }
.hero .hint { font-family: var(--mono); font-size: .56rem; letter-spacing: .04em; color: #6f655a; margin-top: .9rem; text-align: right; }
.hero-body { margin-top: 1.2rem; padding-top: 1.1rem; border-top: 1px solid rgba(245,241,232,.12); display: none; }
.hero.open .hero-body { display: block; }
.hero-body .md { color: #cfc8bb; font-size: .8rem; }
.hero-body .md h1, .hero-body .md h2, .hero-body .md h3 { color: #e2a55e; }
.hero-body .md code { background: rgba(255,255,255,.08); color: #d8d2c6; }
.hero-body .md pre { background: rgba(0,0,0,.3); }
.hero-body .md a { color: #c4b59a; }
.hero-body .md input[type=checkbox] { accent-color: #b5712a; }
.hero-fb { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(245,241,232,.1); }
.hero-fb .fb-flag { font-family: var(--mono); font-size: .6rem; color: #c8916f; background: transparent; border: 1px solid rgba(192,98,42,.45); border-radius: 3px; padding: 4px 11px; cursor: pointer; }
.hero-fb .fb-flag:hover { color: #e2a55e; border-color: rgba(226,165,94,.55); }
.hero-fb textarea { width: 100%; background: rgba(0,0,0,.28); border: 1px solid rgba(245,241,232,.15); border-radius: 4px; color: #e6e6ea; font-family: var(--sans); font-size: .82rem; line-height: 1.45; padding: 8px 11px; min-height: 58px; resize: vertical; }
.hero-fb .fb-actions { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.hero-fb .fb-hint { flex: 1; font-family: var(--mono); font-size: .56rem; color: #8a7f70; }
.hero-fb .fb-actions button { font-family: var(--mono); font-size: .6rem; border-radius: 3px; padding: 5px 12px; cursor: pointer; }
.hero-fb .fb-cancel { background: transparent; border: 1px solid rgba(245,241,232,.18); color: #a89f8d; }
.hero-fb .fb-save { background: #e2a55e; border: none; color: #1c1916; }
.hero-fb .fb-done { font-family: var(--mono); font-size: .62rem; color: #8fc7a0; padding: 6px 0; line-height: 1.5; }

.bp-loops { display: flex; align-items: center; gap: 10px; padding: 14px 2px 13px; border-bottom: 1px solid var(--line); margin-top: 8px; cursor: pointer; }
.bp-loops svg { flex: none; }
.bp-loops .lt { flex: 1; font-size: .82rem; color: var(--ink); }
.bp-loops .lt .tag { font-family: var(--mono); font-size: .6rem; margin-right: 6px; }
.bp-loops .ct { font-family: var(--mono); font-size: .62rem; color: var(--dim); white-space: nowrap; }

/* decay inbox — capped asks with inline actions */
.asks { margin-top: 8px; border-top: 1px solid var(--line); }
.asks-none { display: flex; align-items: center; gap: 10px; padding: 13px 2px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); color: var(--dim); font-size: .82rem; margin-top: 8px; }
.ask { display: flex; align-items: flex-start; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
.ask > svg { flex: none; margin-top: 2px; }
.ask .txt { flex: 1; min-width: 0; cursor: pointer; }
.ask .txt .t { font-size: .84rem; line-height: 1.4; color: var(--ink); }
.ask .txt .sub { font-family: var(--mono); font-size: .58rem; color: var(--dim); margin-top: 2px; }
.ask .acts { display: flex; gap: 5px; flex: none; }
.ask .acts button { font-family: var(--mono); font-size: .58rem; border-radius: 3px; padding: 2px 8px; cursor: pointer; border: 1px solid var(--line2); background: transparent; color: var(--dim); }
.ask .acts button:hover { color: var(--ink); border-color: var(--ink); }
.ask .acts .resolve:hover { color: var(--ok); border-color: var(--ok); }
.ask .acts .research:hover { color: var(--info); border-color: var(--info); }
.asks-more { font-family: var(--mono); font-size: .62rem; color: var(--dim); padding: 10px 2px; cursor: pointer; }
.asks-more:hover { color: var(--ink); }

.bp-counts { display: flex; align-items: center; gap: 18px; padding: 16px 2px 0; font-family: var(--mono); font-size: .62rem; }
.bp-counts .ci { color: var(--dim); cursor: pointer; }
.bp-counts .ci.open, .bp-counts .ci:hover { color: var(--ink); }
.bp-counts .ci b { color: var(--mid); font-weight: 400; }
.bp-counts input { font-family: var(--sans); font-size: .8rem; background: var(--card); border: 1px solid var(--accent-line); border-radius: 3px; padding: 4px 9px; width: 260px; }
.recall { margin-top: 40px; }
.recall-input { width: 100%; box-sizing: border-box; font-family: var(--sans); font-size: .92rem; color: var(--ink); background: var(--card); border: 1px solid var(--line2); border-radius: 5px; padding: 12px 14px; }
.recall-input:focus { border-color: var(--accent); outline: none; }
.recall-results { display: none; padding: 4px 0 2px; }
.recall-results.open { display: block; }
.recall-head { display: flex; align-items: baseline; gap: 10px; font-family: var(--mono); font-size: .62rem; color: var(--dim); padding: 8px 0 2px; }
.recall-head .clear { margin-left: auto; cursor: pointer; color: var(--faint); }
.recall-head .clear:hover { color: var(--ink); }
.recall-kind { font-family: var(--mono); font-size: .58rem; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin-top: 10px; padding-bottom: 2px; border-bottom: 1px solid var(--line); }
.recall-row { cursor: default; }
.recall-row:hover { background: none; }
.recall-row .snip { font-size: .74rem; color: var(--dim); margin-top: 2px; line-height: 1.4; }
.park { margin-top: 40px; }
.park-label { display: block; font-family: var(--mono); font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
.park-input { width: 100%; box-sizing: border-box; font-family: var(--sans); font-size: .92rem; color: var(--ink); background: var(--card); border: 1px solid var(--line2); border-radius: 5px; padding: 12px 14px; }
.park-input:focus { border-color: var(--accent); outline: none; }
.park-input:disabled { opacity: .5; }

/* horizon — forward timeline */
.horizon { padding: 4px 0 2px; }
.hz-lane { display: flex; align-items: center; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); }
.hz-label { flex: 0 0 116px; font-size: .72rem; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hz-label .pri { font-family: var(--mono); font-size: .56rem; color: var(--dim); margin-left: 5px; }
.hz-track { flex: 1; display: flex; align-items: stretch; gap: 3px; min-width: 0; }
.hz-now { flex: 0 0 0; align-self: stretch; border-left: 1px dashed var(--accent); margin: 1px 3px; }
.hz-block { flex: 1 1 0; min-width: 0; border-radius: 3px; padding: 5px 8px; font-family: var(--mono); font-size: .58rem; line-height: 1; display: flex; align-items: center; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hz-block.s-done { background: #3a7d55; color: #eafff2; }
.hz-block.s-progress { background: var(--accent); color: #fffefb; }
.hz-block.s-ready { border: 1px solid var(--accent); color: var(--accent); }
.hz-block.s-blocked { border: 1px dashed #c0622a; color: #c0622a; }
.hz-block.s-triage { border: 1px dashed var(--line2); color: var(--dim); }
.hz-legend { display: flex; gap: 14px; margin-top: 10px; font-family: var(--mono); font-size: .56rem; color: var(--dim); }
.hz-legend i { font-style: normal; }
.hz-empty { font-size: .78rem; color: var(--dim); padding: 8px 0; }

.expand { display: none; padding: 2px 0 6px; }
.expand.open { display: block; }
.loop-row { display: flex; align-items: flex-start; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.loop-row:hover { background: var(--surface); }
.loop-row svg, .loop-row .gly { flex: none; margin-top: 3px; }
.loop-row .txt { flex: 1; }
.loop-row .txt .t { font-size: .82rem; line-height: 1.4; color: var(--ink); }
.loop-row .txt .sub { font-family: var(--mono); font-size: .58rem; color: var(--dim); margin-top: 1px; }
.loop-row .age { font-family: var(--mono); font-size: .6rem; color: var(--dim); flex: none; }
.bl-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.bl-row .rank { font-family: var(--mono); font-size: .6rem; color: var(--faint); min-width: 14px; text-align: right; }
.bl-row .nm { flex: 1; min-width: 0; }
.bl-row .nm .t { font-family: var(--mono); font-size: .7rem; color: var(--ink); cursor: pointer; }
.bl-row .nm .t:hover { text-decoration: underline; }
.bl-row .nm .d { font-size: .68rem; color: var(--dim); }
.bl-row .st { font-family: var(--mono); font-size: .58rem; flex: none; }
.bl-row .pri { font-family: var(--mono); font-size: .6rem; flex: none; cursor: pointer; border: 1px solid var(--line2); border-radius: 3px; padding: 1px 6px; }
.bl-row .pri:hover { border-color: var(--accent); color: var(--accent); }
.bl-row select { font-family: var(--mono); font-size: .62rem; padding: 1px; }
.dec-row { display: flex; align-items: flex-start; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.dec-row:hover { background: var(--surface); }
.dec-row .txt { flex: 1; font-family: var(--serif); font-style: italic; font-size: .86rem; line-height: 1.5; }
.dec-row .age { font-family: var(--mono); font-size: .6rem; color: var(--dim); flex: none; }
/* inline thread body under a clicked decisions/parked row */
.row-body { display: none; padding: 4px 2px 12px 30px; border-bottom: 1px solid var(--line); }
.row-body.open { display: block; }
.row-body .path { font-family: var(--mono); font-size: .58rem; color: var(--faint); margin-bottom: 6px; }
.row-body .md { font-size: .8rem; color: var(--mid); }
.row-body .row-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
.row-body .row-acts select { font-family: var(--mono); font-size: .62rem; padding: 2px 4px; border: 1px solid var(--line2); border-radius: 3px; background: var(--card); color: var(--ink); }
.row-body .row-acts button { font-family: var(--mono); font-size: .58rem; border-radius: 3px; padding: 2px 8px; cursor: pointer; border: 1px solid var(--line2); background: transparent; color: var(--dim); }
.row-body .row-acts button:hover { color: var(--ink); border-color: var(--ink); }
.row-body .row-acts button.close:hover { color: var(--bad); border-color: var(--bad); }
.footnote { margin-top: 46px; text-align: center; font-family: var(--mono); font-size: .62rem; color: var(--faint); }
.fn-cmds { margin-top: 8px; font-size: .58rem; color: var(--faint); opacity: .7; letter-spacing: .02em; }
.empty { font-size: .78rem; color: var(--dim); padding: 8px 0; }

/* map — dependency DAG + breaks */
.dag-cap { font-family: var(--mono); font-size: .58rem; color: var(--faint); text-align: center; margin: 2px 0 -2px; letter-spacing: .04em; }
.dag-wrap { position: relative; overflow: hidden; padding: 0; margin: 8px 0 4px; height: 440px; border: 1px solid var(--line, #e7e2d6); border-radius: 8px; background: #fbf9f4; touch-action: none; }
.dag-wrap svg { display: block; width: 100%; height: 100%; cursor: grab; }
.dag-wrap svg.panning { cursor: grabbing; }
.dag-reset { position: absolute; top: 8px; right: 8px; font-family: var(--mono); font-size: .58rem; letter-spacing: .04em; color: var(--faint); background: rgba(255,254,251,.86); border: 1px solid var(--line, #e0dacd); border-radius: 6px; padding: 3px 8px; cursor: pointer; opacity: 0; transition: opacity .15s; z-index: 2; }
.dag-wrap:hover .dag-reset { opacity: 1; }
.dag-reset:hover { color: var(--ink, #1c1916); }
.dn { cursor: pointer; }
.dn rect:first-child { transition: stroke-width .1s; }
.dn:hover rect:first-child { stroke-width: 2; }

/* map — the contribution ladder (goal → intent → spec) */
.map { padding: 6px 0 2px; }
.mg { border-left: 3px solid var(--accent); padding: 2px 0 12px 14px; margin-bottom: 14px; }
.mg-head { font-family: var(--serif); font-size: 1.05rem; color: var(--ink); margin-bottom: 10px; }
.mg-head .wt { font-family: var(--mono); font-size: .68rem; color: var(--dim); margin-left: 8px; }
.mi { border-left: 1px solid var(--line2); margin-left: 2px; padding: 5px 0 9px 16px; }
.mi-head { font-size: .9rem; color: var(--ink); cursor: pointer; margin-bottom: 7px; }
.mi-head:hover { text-decoration: underline; }
.mi-head .ist { font-family: var(--mono); font-size: .54rem; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin-left: 8px; }
.mi-head .ist.done { color: var(--ok); }
.ms-row { display: flex; flex-wrap: wrap; gap: 7px; }
.ms { font-family: var(--mono); font-size: .64rem; padding: 4px 9px; border-radius: 4px; cursor: pointer; border: 1px solid var(--line2); color: var(--ink); white-space: nowrap; }
.ms:hover { border-color: var(--ink); }
.ms.s-done { background: rgba(58,125,85,.1); border-color: rgba(58,125,85,.4); color: #2e6b47; }
.ms.s-in-progress { background: rgba(181,113,42,.12); border-color: rgba(181,113,42,.5); color: #8a4a17; }
.ms.s-ready { border-color: var(--accent); color: var(--accent); }
.ms.s-blocked { border-color: #c0622a; color: #c0622a; border-style: dashed; }
.ms.s-triage { border-style: dashed; color: var(--dim); }
.ms .mp { opacity: .65; margin-left: 2px; }
.ms .dep { color: var(--dim); margin-left: 2px; }
.ms-none { font-size: .76rem; color: var(--dim); }
.map-breaks { margin-top: 22px; border-top: 1px solid var(--line); padding-top: 14px; }
.mb-head { font-family: var(--mono); font-size: .62rem; letter-spacing: .12em; text-transform: uppercase; color: var(--bad); margin-bottom: 8px; }
.break-row { font-size: .82rem; color: var(--mid); padding: 7px 0; cursor: pointer; border-bottom: 1px solid var(--line); }
.break-row:hover { color: var(--ink); }
.break-row b { font-weight: 500; color: var(--ink); }
.break-row .fix { font-family: var(--mono); font-size: .58rem; letter-spacing: .06em; color: var(--bad); margin-left: 10px; opacity: .75; }
.break-row:hover .fix { opacity: 1; }

/* map — the break-repair chooser (rendered in the drawer) */
.rp-lead { font-size: .82rem; color: var(--mid); margin: 4px 0 6px; }
.rp-h { font-family: var(--mono); font-size: .58rem; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin: 20px 0 8px; }
.rp-opt { padding: 8px 11px; border: 1px solid var(--line); border-radius: 5px; margin-bottom: 6px; cursor: pointer; font-size: .82rem; color: var(--ink); }
.rp-opt:hover { border-color: var(--ink); }
.rp-opt b { font-weight: 500; }
.rp-opt .rp-sub { display: block; font-family: var(--mono); font-size: .58rem; color: var(--faint); margin-top: 3px; }
.rp-new { display: flex; flex-direction: column; gap: 8px; }
.rp-new input, .rp-new select { width: 100%; box-sizing: border-box; font-family: var(--sans); font-size: .82rem; color: var(--ink); background: var(--card); border: 1px solid var(--line2); border-radius: 4px; padding: 8px 10px; }
.rp-new input:focus, .rp-new select:focus { border-color: var(--accent); outline: none; }
.rp-new select:disabled { opacity: .72; cursor: not-allowed; color: var(--mid); }
.rp-new button { align-self: flex-start; font-family: var(--mono); font-size: .68rem; border-radius: 4px; padding: 8px 16px; cursor: pointer; border: 1px solid var(--line2); background: transparent; color: var(--dim); }
.rp-new button:hover { color: var(--accent); border-color: var(--accent); }
.rp-hint { font-family: var(--mono); font-size: .58rem; color: var(--faint); }

/* ════ LIVE LOOK (mission control) ════ */
#view-live { background: var(--bg); }
.lanes { display: flex; height: 42%; border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; }
.lane { flex: 1; min-width: 170px; display: flex; flex-direction: column; }
.lane-head {
  display: flex; align-items: center; gap: 8px; padding: 9px 14px;
  border-bottom: 1px solid var(--line); background: var(--surface2); flex: none;
}
.lane-head .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.lane-head .nm { font-family: var(--mono); font-size: .62rem; letter-spacing: .1em; color: var(--dim); }
.lane-head .ct { margin-left: auto; font-family: var(--mono); font-size: .62rem; color: var(--faint); }
/* TESTS lane head: bulk "verify all" — the drawer's old Drain queue, moved to
   lane level where a whole-lane action belongs (a per-spec drawer keeps one) */
.lane-head .lh-drain {
  font-family: var(--mono); font-size: .56rem; letter-spacing: .02em;
  color: var(--dim); background: transparent; border: 1px solid var(--line2);
  border-radius: 3px; padding: 2px 7px; cursor: pointer; flex: none;
}
.lane-head .lh-drain:hover { color: #6b8fc7; border-color: #6b8fc7; }
.lane-head .lh-drain:disabled { opacity: .5; cursor: default; }
.lane-body { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; scrollbar-width: none; }
.lcard { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; cursor: pointer; }
.lcard:hover { border-color: var(--line2); }
.lcard.working { border-color: var(--accent-line); }
.lcard .gate { display: flex; align-items: center; gap: 4px; font-family: var(--mono); }
.gate-tests { color: #6b8fc7; }
.gate-review { color: #b57fc7; }
/* verification provenance on in-review/tests cards — independently verified
   work must not look the same as self-checked or verifier-awaiting work */
.gate-verified { color: #7fa06a; }
.gate-selfcheck { color: #c79a5b; }
.gate-await { color: #c79a5b; }
.gate-v-queued { color: #c79a5b; }
.gate-v-running { color: #6b8fc7; }
.gate-v-blocked { color: #a83232; }
.gate-v-human { color: #c0622a; }
.lcard .t { font-size: .78rem; line-height: 1.4; color: var(--ink); }
.lcard .lc-pri { font-family: var(--mono); font-size: .54rem; font-weight: 600; padding: 1px 5px; border-radius: 2px; margin-right: 6px; vertical-align: 1px; }
.lc-pri.p0 { color: #a83232; background: rgba(168,50,50,.13); }
.lc-pri.p1 { color: #c0622a; background: rgba(192,98,42,.13); }
.lc-pri.p2 { color: #6b57c7; background: rgba(107,87,199,.13); }
.lc-pri.p3 { color: #8a8070; background: rgba(138,128,112,.16); }
.lcard .ws-tag { font-family: var(--mono); font-size: .55rem; color: var(--faint); display: block; margin-bottom: 3px; }
.lcard .meta { display: flex; justify-content: space-between; margin-top: 7px; font-family: var(--mono); font-size: .58rem; }
.lcard .lc-status { color: var(--accent); display: inline-flex; align-items: center; gap: 4px; }
.lcard .elapsed { color: var(--dim); display: inline-flex; align-items: center; gap: 4px; }
.lcard .agent-mark { display: inline-flex; align-items: center; color: var(--dim); opacity: .72; }
.lcard.working .agent-mark { color: var(--accent); opacity: .9; }
.lcard .lc-owner { position: absolute; top: 9px; right: 10px; display: inline-flex; align-items: center; color: var(--accent); }
.lcard .lc-owner svg { width: 20px; height: 20px; flex: none; }
.lcard.has-owner .t { padding-right: 32px; }
.lcard.done .t { text-decoration: line-through; text-decoration-color: rgba(111,174,132,.6); color: var(--dim); }
.lc-note { margin-top: 7px; font-family: var(--mono); font-size: .56rem; color: #b57fc7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lcard .lc-hold { font-family: var(--mono); font-size: .54rem; padding: 1px 6px; border-radius: 2px; color: #8a8070; background: rgba(138,128,112,.14); display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* triage lane — subtle inline release (drawer action still available) */
.lcard .lc-release {
  margin-top: 8px; align-self: flex-start;
  font-family: var(--mono); font-size: .56rem; letter-spacing: .02em;
  color: var(--dim); background: transparent;
  border: 1px solid transparent; border-radius: 3px;
  padding: 2px 6px; cursor: pointer; opacity: 0.55;
}
.lcard:hover .lc-release { opacity: 1; border-color: var(--line); color: var(--ok); }
.lcard .lc-release:hover { background: rgba(58,125,85,.08); border-color: rgba(58,125,85,.35); }
.lcard .lc-release:disabled { opacity: 0.4; cursor: wait; }
.lcard .pbar { height: 2px; background: rgba(255,255,255,.06); border-radius: 2px; overflow: hidden; margin-top: 8px; }
.lcard .pbar i { display: block; height: 100%; width: 40%; border-radius: 2px;
  background: linear-gradient(90deg, rgba(226,165,94,.4), var(--accent)); animation: tl-slide 2.2s ease-in-out infinite; }
@keyframes tl-slide { 0% { margin-left: -40% } 100% { margin-left: 100% } }

.deck { display: flex; flex: 1; min-height: 0; }
.panel-head {
  display: flex; align-items: center; gap: 8px; padding: 7px 12px;
  border-bottom: 1px solid var(--line); background: var(--surface2); flex: none;
  font-family: var(--mono); font-size: .58rem; letter-spacing: .1em; color: var(--dim);
}
.pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); animation: tl-pulse 2s infinite; }
.pulse.off { background: var(--bad); animation: none; }

/* files panel */
.fpane { width: 210px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
.fpane .body { flex: 1; overflow-y: auto; padding: 8px; scrollbar-width: none; }
.tn { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left;
  background: none; border: none; padding: 2px 4px; border-radius: 3px;
  font-family: var(--mono); font-size: .67rem; color: var(--dim); cursor: pointer; }
.tn:hover { background: rgba(127,127,127,.08); }
.tn .arr { width: 9px; flex: none; color: var(--faint); font-size: .55rem; transition: transform .12s; }
.tn.x .arr { transform: rotate(90deg); }
.tn.dirn { color: var(--dim); }
.tn.rootn { color: var(--mid); }
.tn .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tn.active { background: rgba(226,165,94,.20); }
.tn.active .nm { color: #f3eee3; }
.tn.h1 { background: rgba(226,165,94,.07); }
.tn.h2 { background: rgba(226,165,94,.14); }
.tn.h3 { background: rgba(226,165,94,.24); }
.tn .delta { font-size: .58rem; flex: none; color: var(--accent); }
.tn .delta.new { color: var(--ok); }
.tn.flash { animation: tl-flash 1.2s ease-out; }
.tkids { padding-left: 13px; }

/* activity panel */
.apane { width: 300px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
.apane .body { flex: 1; overflow-y: auto; padding: 10px 12px; scrollbar-width: thin; }
.log-line { display: flex; align-items: baseline; gap: 8px; padding: 1px 0; }
.log-line.old { opacity: .28; }
.log-line .t { font-family: var(--mono); font-size: .62rem; color: var(--faint); flex: none; min-width: 50px; }
.log-line .v { font-family: var(--mono); font-size: .62rem; flex: none; min-width: 50px; }
.log-line .m { font-family: var(--mono); font-size: .62rem; color: var(--mid); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log-line .m .d { color: var(--faint); }
.cursor { color: var(--accent); animation: tl-blink 1.1s step-end infinite; font-family: var(--mono); font-size: .62rem; }

/* file viewer */
.vpane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.vpane .crumb { font-family: var(--mono); font-size: .62rem; color: var(--faint); letter-spacing: 0; text-transform: none; }
.vpane .crumb b { color: #cfc8ba; font-weight: 400; }
.vpane .writing { margin-left: auto; display: flex; align-items: center; gap: 5px; color: var(--ok); font-size: .58rem; letter-spacing: 0; }
.vpane .body { flex: 1; overflow: auto; scrollbar-width: thin; }
.code { border-collapse: collapse; width: 100%; }
.code td { font-family: var(--mono); font-size: .68rem; line-height: 1.6; vertical-align: top; }
.code .ln { width: 38px; text-align: right; padding: 0 14px 0 10px; color: var(--faint); user-select: none; }
.code .cl { white-space: pre; padding-right: 24px; color: #cfc8ba; }
.code tr.added { background: rgba(111,174,132,.07); }
.code tr.added .ln { color: var(--ok); }
.kw { color: var(--accent); }
.str { color: var(--ok); }
.cmt { color: var(--faint); }
.vpane .empty-state { padding: 30px; font-family: var(--mono); font-size: .65rem; color: var(--faint); }

/* detail modal (was right drawer) */
.scrim { position: fixed; inset: 0; background: rgba(10,9,8,.42); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40; }
.drawer {
  position: fixed; left: 50%; top: 50%; right: auto; bottom: auto; z-index: 41;
  width: min(720px, calc(100vw - 40px));
  max-height: min(86vh, calc(100vh - 80px));
  background: var(--bg); border: 1px solid var(--line2); border-radius: 8px;
  box-shadow: 0 28px 72px rgba(0,0,0,.22);
  transform: translate(-50%, -46%) scale(.97);
  transition: transform .22s cubic-bezier(.3,.8,.3,1), opacity .18s;
  opacity: 0;
  /* closed: invisible AND click-through — without this the empty drawer box
     floats over the viewport center and swallows clicks meant for the paper */
  pointer-events: none;
  overflow-y: auto; padding: 34px 38px 52px;
}
.open .scrim { opacity: 1; pointer-events: auto; }

    const key = el.textContent.trim().replace(/\s+/g, ' ').slice(0, 120);
    if (!key) return;
    const thread = document.createElement('div'); thread.className = 'rv-thread';
    anchored.filter(n => key.slice(0, 70).startsWith(n.anchor.slice(0, 70)) || n.anchor.slice(0, 70).startsWith(key.slice(0, 70)))
      .forEach(n => thread.insertAdjacentHTML('beforeend', `<div class="rv-note">${esc(n.text)}</div>`));
    const add = document.createElement('span'); add.className = 'rv-add'; add.textContent = '+ note';
    add.onclick = () => {
      add.style.visibility = 'hidden';
      const inp = document.createElement('input'); inp.className = 'rv-inline-input'; inp.placeholder = 'comment on this section — ⏎';
      thread.insertBefore(inp, add); inp.focus();
      const done = () => { inp.remove(); add.style.visibility = ''; };
      inp.onkeydown = async e => {
        if (e.key === 'Escape') return done();
        if (e.key !== 'Enter') return;
        const t = inp.value.trim(); if (!t) return done();
        inp.disabled = true;
        try { await postJSON('/api/note', { ws: item._ws, spec: item.path, text: t, anchor: key }); thread.insertBefore(Object.assign(document.createElement('div'), { className: 'rv-note', textContent: t }), inp); done(); loadSelected(); }
        catch (err) { alert(err.message); inp.disabled = false; }
      };
    };
    thread.appendChild(add);
    el.after(thread);
  });
}

// an orphan spec: attach it to an existing intent, or create a new goal-carrying
// intent for it — the break itself is the affordance, repaired without leaving the cockpit
function openBreakChooser(ws, spec) {
  const slug = (spec.path || '').replace(/\/$/, '').split('/').pop();
  const intents = ws.intents || [];
  const goals = (ws.config && ws.config.goals) || [];
  const rows = intents.map((it, i) =>
    `<div class="rp-opt" data-i="${i}"><b>${esc(it.title)}</b><span class="rp-sub">${esc(it.path)}${(it.meta.goals || []).length ? ' · → ' + esc((it.meta.goals || []).join(', ')) : ' · no goal yet'}</span></div>`).join('');
  $('drawer').innerHTML = `
    <button type="button" class="dr-close" aria-label="Close">×</button>
    <div class="path">${esc(spec.path || '')}</div>
    <h2>Repair: <b>${esc(slug)}</b> has no intent</h2>
    <p class="rp-lead">Attach this spec to a throughline so the Map can trace it up to a goal.</p>
    <div class="rp-h">attach to an existing intent</div>
    ${rows || '<div class="empty">no intents yet — create one below</div>'}
    <div class="rp-h">or create a new intent</div>
    <div class="rp-new">
      <input class="rp-title" placeholder="intent title — the outcome, not the task">
      <select class="rp-goal"><option value="">pick a goal — required</option>${goals.map(g => `<option value="${esc(g.id)}">${esc(g.description || g.id)}</option>`).join('')}</select>
      <button class="rp-create">create intent + attach →</button>
      <span class="rp-hint">scaffolded from _templates/intent.md · an intent always ladders to a goal</span>
    </div>`;
  const done = () => { document.body.classList.remove('open'); loadSelected(); };
  $('drawer').querySelectorAll('.rp-opt').forEach(el => el.onclick = async () => {
    try { await postJSON('/api/map-repair', { ws: ws.name, action: 'attach', spec: spec.path, intent: intents[+el.dataset.i].path }); done(); }
    catch (err) { alert(err.message); }
  });
  const btn = $('drawer').querySelector('.rp-create');
  btn.onclick = async () => {
    const title = $('drawer').querySelector('.rp-title').value.trim();
    const goal = $('drawer').querySelector('.rp-goal').value;
    if (!title) return alert('the intent needs a title');
    if (!goal) return alert('pick a goal — an intent must ladder to one');  // never a goal-less intent
    btn.disabled = true;
    try { await postJSON('/api/map-repair', { ws: ws.name, action: 'create-intent', spec: spec.path, title, goal }); done(); }
    catch (err) { alert(err.message); btn.disabled = false; }
  };
  document.body.classList.add('open');
  wireModalClose();
}

async function postJSON(p, body) {
  // every cockpit write goes through here — the server injects the per-process
  // write token into this page at GET /, and refuses POSTs without it (403)
  const r = await fetch(p, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-tl-token': window.TL_WRITE_TOKEN || '' },
    body: JSON.stringify(body),
  });
  if (!r.ok) {
    let e = {}; try { e = await r.json(); } catch {}
    const msg = (e.error || ('HTTP ' + r.status)) + (r.status === 403 && e.hint ? ' — ' + e.hint : '');
    const err = new Error(msg); err.status = r.status; throw err;
  }
  return r.json();
}
const specFileOf = item => { const p = item.path || ''; return p.endsWith('/') ? p + 'SPEC.md' : p; };

function fmtInsightN(n) {
  const v = Number(n) || 0;
  if (v >= 10000) return (v / 1000).toFixed(0) + 'k';
  if (v >= 1000) return (v / 1000).toFixed(1) + 'k';
  return String(v);
}

// Lines-added stat: git-derived when the workspace repo is a checkout
// (total = all-time insertions, week = rolling last-7-days), legacy
// experiment-patch count otherwise, and an honest em dash — never a
// misleading 0 — when neither source has data.
function fmtLinesAddedStat(la) {
  const l = la || {};
  const hasData = !!l.git_available || (l.experiments || 0) > 0;
  return hasData ? fmtInsightN(l.total || 0) : '&mdash;';
}

function fmtLinesAddedSub(la) {
  const l = la || {};
  if (l.git_available) return '+' + fmtInsightN(l.week || 0) + ' this week';
  if ((l.experiments || 0) > 0) return 'from experiment patches';
  return 'no repo data yet';
}

const TOOL_LABEL = { claude: 'Claude', codex: 'Codex', cursor: 'Cursor', gemini: 'Gemini', windsurf: 'Windsurf', other: 'Other' };

function fmtInsightCost(n) {
  const v = Number(n);
  if (!Number.isFinite(v)) return null;
  if (v >= 1) return '$' + v.toFixed(2);
  if (v >= 0.01) return '$' + v.toFixed(2);
  if (v > 0) return '$' + v.toFixed(3);
  return '$0';
}

function fmtInsightDur(n) {
  const v = Number(n);
  if (!Number.isFinite(v)) return null;
  if (v < 1) return '<1m';
  if (v >= 60) return (v / 60).toFixed(1) + 'h';
  return Math.round(v) + 'm';
}

function fmtPerfLine(item, { avg = true } = {}) {
  const parts = [];
  const dur = avg ? item.avg_duration_minutes : item.duration_minutes;
  const cost = avg ? item.avg_cost_usd : item.total_cost_usd;
  const tok = avg ? item.avg_tokens_used : item.total_tokens_used;
  const d = fmtInsightDur(dur);
  const c = fmtInsightCost(cost);
  const t = tok != null ? fmtInsightN(tok) + ' tok' : null;
  if (d) parts.push(d);
  if (c) parts.push(c);
  if (t) parts.push(t);
  return parts.join(' · ');
}

function mergePerfBucket(dst, src) {
  const n = src.count || 0;
  dst.count += n;
  if (src.avg_duration_minutes != null && n) {
    dst.duration_minutes += src.avg_duration_minutes * n;
    dst.runs_with_duration += n;
  } else if (src.duration_minutes) {
    dst.duration_minutes += src.duration_minutes;
    dst.runs_with_duration += src.runs_with_duration || n;
  }
  if (src.avg_cost_usd != null && n) {
    dst.cost_usd += src.avg_cost_usd * n;
    dst.runs_with_cost += n;
  } else if (src.cost_usd) {
    dst.cost_usd += src.cost_usd;
    dst.runs_with_cost += src.runs_with_cost || n;
  }
  if (src.avg_tokens_used != null && n) {
    dst.tokens_used += src.avg_tokens_used * n;
    dst.runs_with_tokens += n;
  } else if (src.tokens_used) {
    dst.tokens_used += src.tokens_used;
    dst.runs_with_tokens += src.runs_with_tokens || n;
  }
}

function mergeInsights(list) {
  if (!list.length) return null;
  if (list.length === 1) return list[0];
  const out = {
    active_agent_count: 0,
    active_agents: [],
    stage_counts: { ready: 0, 'in-progress': 0, tests: 0, 'in-review': 0, done: 0, triage: 0 },
    lines_added: { total: 0, experiments: 0, week: 0, git_available: false, source: 'none' },
    tools: [],
    models: [],
    experiments: { total: 0, by_status: {}, candidate_runs: 0, recent_winner: '', recent_winner_tool: '' },
  };
  const toolMap = {};
  const modelMap = {};
  const agentMap = {};
  for (const ins of list) {
    out.active_agent_count += ins.active_agent_count || 0;
    for (const [k, v] of Object.entries(ins.stage_counts || {})) {
      if (out.stage_counts[k] != null) out.stage_counts[k] += v;
    }
    out.lines_added.total += ins.lines_added?.total || 0;
    out.lines_added.experiments += ins.lines_added?.experiments || 0;
    if (ins.lines_added?.git_available) {
      out.lines_added.git_available = true;
      out.lines_added.week += ins.lines_added.week || 0;
    }
    if (ins.lines_added?.source && ins.lines_added.source !== 'none' && out.lines_added.source === 'none') {
      out.lines_added.source = ins.lines_added.source;
    }
    if (out.lines_added.git_available) out.lines_added.source = 'git';
    for (const t of ins.tools || []) {
      if (!toolMap[t.tool]) toolMap[t.tool] = { tool: t.tool, count: 0, duration_minutes: 0, cost_usd: 0, tokens_used: 0, runs_with_duration: 0, runs_with_cost: 0, runs_with_tokens: 0 };
      mergePerfBucket(toolMap[t.tool], t);
    }
    for (const m of ins.models || []) {
      if (!modelMap[m.model]) modelMap[m.model] = { model: m.model, tool: m.tool || '', count: 0, duration_minutes: 0, cost_usd: 0, tokens_used: 0, runs_with_duration: 0, runs_with_cost: 0, runs_with_tokens: 0 };
      mergePerfBucket(modelMap[m.model], m);
      if (!modelMap[m.model].tool && m.tool) modelMap[m.model].tool = m.tool;
    }
    for (const a of ins.active_agents || []) {
      agentMap[a.agent] = (agentMap[a.agent] || 0) + a.count;
    }
    const ex = ins.experiments || {};
    out.experiments.total += ex.total || 0;
    out.experiments.candidate_runs += ex.candidate_runs || 0;
    for (const [st, n] of Object.entries(ex.by_status || {})) {
      out.experiments.by_status[st] = (out.experiments.by_status[st] || 0) + n;
    }
    if (!out.experiments.latest && ex.latest) out.experiments.latest = ex.latest;
    if (!out.experiments.recent_winner && ex.recent_winner) {
      out.experiments.recent_winner = ex.recent_winner;
      out.experiments.recent_winner_tool = ex.recent_winner_tool || '';
    }
  }
  out.tools = Object.values(toolMap)
    .sort((a, b) => b.count - a.count)
    .slice(0, 3)
    .map(t => ({
      tool: t.tool,
      count: t.count,
      avg_duration_minutes: t.runs_with_duration ? +(t.duration_minutes / t.runs_with_duration).toFixed(1) : null,
      avg_cost_usd: t.runs_with_cost ? +(t.cost_usd / t.runs_with_cost).toFixed(3) : null,
      avg_tokens_used: t.runs_with_tokens ? Math.round(t.tokens_used / t.runs_with_tokens) : null,
    }));
  out.models = Object.values(modelMap)
    .sort((a, b) => b.count - a.count)
    .slice(0, 3)
    .map(m => ({
      model: m.model,
      tool: m.tool,
      count: m.count,
      avg_duration_minutes: m.runs_with_duration ? +(m.duration_minutes / m.runs_with_duration).toFixed(1) : null,
      avg_cost_usd: m.runs_with_cost ? +(m.cost_usd / m.runs_with_cost).toFixed(3) : null,
      avg_tokens_used: m.runs_with_tokens ? Math.round(m.tokens_used / m.runs_with_tokens) : null,
    }));
  out.active_agents = Object.entries(agentMap).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([agent, count]) => ({ agent, count, specs: [] }));
  return out;
}

function fmtExperimentHighlight(latest) {
  if (!latest || !latest.winner_id) return '<p class="ins-quiet">No judged winners yet</p>';
  const tool = TOOL_LABEL[latest.winner_tool] || latest.winner_tool || latest.winner_id;
  const winner = latest.winner_model ? `${latest.winner_model} · ${tool}` : tool;
  const task = latest.task_summary || latest.task_title || latest.tl_spec || latest.task_type;
  const by = latest.winner_set_by && latest.winner_set_by !== 'judge'
    ? ` · picked by ${latest.winner_set_by}`
    : '';
  return `<div class="ins-highlight">
    <p class="ih-task">${esc(task)}</p>
    <p class="ih-winner">Won: ${esc(winner)}${esc(by)}</p>
    ${latest.rationale ? `<p class="ins-quiet">${esc(latest.rationale)}</p>` : ''}
  </div>`;
}

function renderInsightsRail(wss) {
  const rail = $('insightsRail');
  if (!rail) return;
  const ins = mergeInsights(wss.map(w => w.insights).filter(Boolean));
  if (!ins) { rail.innerHTML = ''; return; }

  const agentRows = (ins.active_agents || []).slice(0, 3).map(a => {
    const ic = AGENT_IC[a.agent] ? AGENT_IC[a.agent]('currentColor') : '';
    const label = AGENT_LABEL[a.agent] || a.agent;
    return `<div class="ins-row"><span class="ir-l">${ic}<span>${esc(label)}</span></span><span class="ir-n">${a.count}</span></div>`;
  }).join('') || '<p class="ins-quiet">none running</p>';

  const stage = ins.stage_counts || {};
  const stageLine = `${stage.ready || 0} ready · ${stage['in-progress'] || 0} active · ${stage['in-review'] || 0} review · ${stage.done || 0} done`;

  const toolRows = (ins.tools || []).map(t => {
    const label = TOOL_LABEL[t.tool] || t.tool;
    const perf = fmtPerfLine(t);
    return `<div class="ins-row"><span class="ir-l"><span>${esc(label)}</span></span><span class="ir-n">${t.count}</span></div>${perf ? `<p class="ins-tool-meta">avg ${esc(perf)}</p>` : ''}`;
  }).join('') || '<p class="ins-quiet">no tool signals yet</p>';

  const modelRows = (ins.models || []).map(m => {
    const label = m.model.length > 22 ? m.model.slice(0, 21) + '…' : m.model;
    const perf = fmtPerfLine(m);
    const toolHint = m.tool ? ` · ${esc(TOOL_LABEL[m.tool] || m.tool)}` : '';
    return `<div class="ins-row"><span class="ir-l"><span title="${esc(m.model)}">${esc(label)}</span></span><span class="ir-n">${m.count}</span></div>${perf ? `<p class="ins-tool-meta">avg ${esc(perf)}${toolHint}</p>` : (toolHint ? `<p class="ins-tool-meta">${toolHint.slice(3)}</p>` : '')}`;
  }).join('');

  const ex = ins.experiments || {};
  const exActive = (ex.by_status?.running || 0) + (ex.by_status?.queued || 0) + (ex.by_status?.['in-progress'] || 0);
  const exWon = ex.by_status?.succeeded || ex.by_status?.done || 0;
  let exLine = `${ex.total || 0} total`;
  if (exActive) exLine += ` · ${exActive} active`;
  if (exWon) exLine += ` · ${exWon} judged`;
  if (ex.candidate_runs) exLine += ` · ${ex.candidate_runs} runs`;
  const latestHighlight = fmtExperimentHighlight(ex.latest);

  rail.innerHTML = `
    <div class="ins-block">
      <span class="il">Review · experiments</span>
      <p class="ins-sub">${esc(exLine)}</p>
      ${latestHighlight}
    </div>
    <div class="ins-block">
      <span class="il">Run · agents</span>
      <p class="ins-stat">${ins.active_agent_count || 0}</p>
      ${agentRows}
    </div>
    <div class="ins-block">
      <span class="il">Pipeline</span>
      <p class="ins-sub">${esc(stageLine)}</p>
    </div>
    <div class="ins-block">
      <span class="il">Lines added</span>
      <p class="ins-stat">${fmtLinesAddedStat(ins.lines_added)}</p>
      <p class="ins-sub">${esc(fmtLinesAddedSub(ins.lines_added))}</p>
    </div>
    <div class="ins-block">
      <span class="il">Top tools</span>
      ${toolRows}
    </div>
    ${modelRows ? `<div class="ins-block"><span class="il">Models</span>${modelRows}</div>` : ''}`;
}

/* === resume-recommended BEGIN (keep in lockstep with lib/resume-recommended.js) === */
// lib/resume-recommended.js — shared "recommended next" + open-loop ranking
// for /tl resume and the cockpit Resume tab. Pure functions over already-parsed
// workspace shapes (specs, threads, goals, intents). Zero dependencies.
//
// Priority for recommended next (highest first — keep skill + UI in lockstep):
//   1. open question/risk/decision blocking the top ready spec
//   2. top-weighted goal with zero active specs (not when all linked work is done)
//   3. longest-idle in-progress with NOTES.md (kickback / mid-flight)
//   4. top ready spec
//   5. any open question
//   6. in-progress without NOTES → all clear
//   7. empty queue → decompose ask
//
// UMD: CommonJS for tests/CLI; `globalThis.ResumeRecommended` for the cockpit
// (ui/index.html inlines the same factory — keep both copies in lockstep).

(function (root, factory) {
  const api = factory();

    // ── value delivered (one calm sentence, client-side from outcome/FEEDBACK.md) ──
    // Display rule: scan the most recent 1–3 done specs, render the first usable
    // sentence — "What shipped" preferred, else the "Delivered …" sentence of
    // "Asked vs. delivered". No usable prose → render nothing: the status line
    // above already carries the completed-spec title, so the fallback is silent.
    const valueSentence = s => {
      const fb = (s.outcome || []).find(o => /^feedback$/i.test(o.name));
      if (!fb || !fb.body) return null;
      const secs = {};
      fb.body.split(/\n(?=##\s)/).forEach(ch => {
        const m = ch.match(/^##\s+(.+?)\s*\n([\s\S]*)$/);
        if (m) secs[m[1].toLowerCase().replace(/[^a-z ]/g, '')] = m[2];
      });
      const prose = ((secs['what shipped'] || secs['asked vs delivered'] || '').split(/\n(?=#)/)[0] || '')
        .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1').replace(/[`*_]/g, '').replace(/\s+/g, ' ').trim();
      if (!prose || prose.startsWith('{')) return null; // empty or template placeholder
      // a terminator only ends a sentence when followed by whitespace/end —
      // periods inside file names (SCHEMA.md, lib/foo.js) must not split it
      const sentences = prose.match(/.+?[.!?]+["')\]]*(?=\s|$)/g) || [prose];
      let pick = (sentences.find(x => /^\s*Delivered\b/.test(x)) || sentences[0]).trim();
      if (pick.length > 200) pick = pick.slice(0, 199).replace(/\s+\S*$/, '') + '…';

    const loops = shown.concat(rest); // for empty check we use shown+rest

    const LCOL = { review: '#b57fc7', research: '#6b57c7', risk: '#a83232', starving: '#b5712a', question: '#6b57c7', blocked: '#c0622a', idle: '#c0622a', notes: '#b57fc7', feedback: '#c0622a', decision: '#6b57c7', triage: '#8a8070' };
    const LIC = { review: IC.check, research: IC.question, risk: IC.risk, starving: IC.risk, question: IC.question, blocked: IC.ban, idle: IC.ban, notes: IC.chat, feedback: IC.chat, decision: IC.chat, triage: IC.archive };

    // ── counts row (backlog / decisions / parked / capture) ──
    const stCol = { ready: '#3a7d55', blocked: '#c0622a', triage: '#8a8070' };
    const prCol = { p0: '#a83232', p1: '#c0622a', p2: '#6b57c7', p3: '#8a8070', '': '#8a8070' };
    const decs = threads.filter(t => t.meta.type === 'decision').sort((a, b) => b.mtime - a.mtime);
    const parked = threads.filter(t => t.meta.status === 'parked');
    const backlog = [...ready.map(s => ({ s, st: s.meta.status === 'blocked' ? 'blocked' : 'ready' })), ...triage.map(s => ({ s, st: 'triage' }))];
    const intentName = s => {

    };

    const counts = document.createElement('div'); counts.className = 'bp-counts';
    counts.innerHTML = `<span class="ci" data-x="hz">learn · horizon</span><span class="ci" data-x="mp">learn · map</span><span class="ci" data-x="bl">steer · backlog <b>${backlog.length}</b></span><span class="ci" data-x="dc">steer · decisions <b>${decs.length}</b></span><span class="ci" data-x="pk">steer · parked <b>${parked.length}</b></span>`;
    const countsEx = document.createElement('div'); countsEx.className = 'expand';

    // a decisions/parked row toggles the thread body inline beneath it — click to read, click to collapse
    const expandableRow = (r, t, actsFn) => {
      const key = ws.name + '|' + t.path;
      const bodyEl = document.createElement('div'); bodyEl.className = 'row-body';
      const src = (t.body || '').replace(/^\s*# .*\n+/, '').trim();
      bodyEl.innerHTML = `<div class="path">${esc(t.path)}</div>` +
        (src ? `<div class="md">${md(src)}</div>` : '<div class="empty">nothing beneath — the title is the whole note</div>');

      countsEx.appendChild(r); countsEx.appendChild(bodyEl);
    };

    const parkedActs = (acts, t) => {
      const others = available.filter(w => w.name !== ws.name);
      if (others.length) {
        const sel = document.createElement('select');
        others.forEach(w => { const o = document.createElement('option'); o.value = w.name; o.textContent = w.name; sel.appendChild(o); });
        const move = document.createElement('button');
        move.textContent = 'move →';
        move.onclick = async () => {
          const dest = sel.value;
          if (!confirm(`Move "${t.title}" to ${dest}?`)) return;
          try { await postJSON('/api/thread-move', { ws: ws.name, path: t.path, dest_ws: dest }); loadSelected(); }
          catch (e) { alert(e.message); }
        };
        acts.appendChild(sel); acts.appendChild(move);
      }
      const close = document.createElement('button');
      close.className = 'close'; close.textContent = 'close';
      close.onclick = async () => {
        if (!confirm(`Close "${t.title}"? Sets status: closed — recoverable on disk, not shown in parked.`)) return;
        try { await postJSON('/api/thread-status', { ws: ws.name, path: t.path, status: 'closed' }); loadSelected(); }
        catch (e) { alert(e.message); }
      };
      acts.appendChild(close);
    };

    const builders = {
      mp: () => {
        countsEx.innerHTML = '';
        if (!specs.length) { countsEx.innerHTML = '<div class="empty">no specs to map yet</div>'; return; }
        const slugOf = p => (p || '').replace(/\/$/, '').split('/').pop().replace(/\.md$/, '');
        const bySlug = {}; specs.forEach(s => { bySlug[slugOf(s.path)] = s; });
        const deps = s => (s.meta.depends_on || []).map(slugOf).filter(sl => bySlug[sl] && sl !== slugOf(s.path));
        // longest-path layering, cycle-guarded
        const lm = {};
        const layerOf = (s, seen) => {
          const k = slugOf(s.path); if (k in lm) return lm[k];
          seen = seen || new Set(); if (seen.has(k)) return 0; seen.add(k);
          const d = deps(s); const l = d.length ? 1 + Math.max(...d.map(x => layerOf(bySlug[x], seen))) : 0;
          return (lm[k] = l);
        };
        const goals = (ws.config && ws.config.goals) || [];
        // each spec ladders to a goal via its intent
        const intentByPath = {}; (ws.intents || []).forEach(it => intentByPath[it.path] = it);
        const goalOf = s => { const it = intentByPath[(s.meta.intent || '').replace(/^\.\//, '').trim()]; return it && (it.meta.goals || [])[0]; };
        // the "in focus" spec — what the IN FOCUS card points at: active work, top priority first
        const PR = p => ({ p0: 0, p1: 1, p2: 2, p3: 3 }[(p || '').toLowerCase()] ?? 9);
        const focus = specs.filter(s => s.stage === 'in-progress').sort((a, b) => PR(a.meta.priority) - PR(b.meta.priority))[0];
        const focusSlug = focus && slugOf(focus.path);
        // vertical layout: foundations at the bottom, work laddering up toward goals at the top
        const NW = 150, NH = 30, GX = 22, GYv = 46, PAD = 14, GW = 168;
        const maxLayer = Math.max(0, ...specs.map(s => layerOf(s)));
        const reachGoals = goals.filter(g => specs.some(s => goalOf(s) === g.id));
        const hasOrphans = specs.some(s => !reachGoals.some(g => g.id === goalOf(s)));
        const hasGoalRow = reachGoals.length > 0;
        const tierShift = hasGoalRow ? NH + GYv : 0;  // push specs down to make room for the goal row
        // forest layout: one vertical band per goal so each tree runs straight up — no crossing
        const bands = reachGoals.map(g => g.id).concat(hasOrphans ? ['__orphan'] : []);
        const bandSpecs = {}; bands.forEach(b => bandSpecs[b] = []);
        specs.forEach(s => { const g = goalOf(s); bandSpecs[reachGoals.some(rg => rg.id === g) ? g : '__orphan'].push(s); });
        const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
        const BANDGAP = 50;
        const pos = {}, gpos = {}, dpos = {}; let cursorX = PAD; const allRoutes = [], allGoalRoutes = [];
        bands.forEach(b => {
          const mem = bandSpecs[b].map(s => slugOf(s.path));               // slugs in this band
          const memSet = new Set(mem);
          const Lr = sl => layerOf(bySlug[sl]);
          // segments between consecutive layers; a skip-layer edge (≥2 apart) gets a dummy waypoint per
          // intervening layer, so it routes through a slot between nodes instead of behind one.
          const segBelow = {}, segAbove = {}, layerOfId = {}, routes = [];
          const addSeg = (lo, hi) => { (segBelow[hi] = segBelow[hi] || []).push(lo); (segAbove[lo] = segAbove[lo] || []).push(hi); };
          mem.forEach(sl => layerOfId[sl] = Lr(sl));
          let dseq = 0;
          mem.forEach(sl => {
            const Lp = Lr(sl);
            deps(bySlug[sl]).filter(d => memSet.has(d)).forEach(d => {
              const chain = [d];                                            // bottom (prerequisite) → top (dependent)
              for (let L = Lr(d) + 1; L <= Lp - 1; L++) { const id = '__' + b + (dseq++); layerOfId[id] = L; chain.push(id); }
              chain.push(sl);
              for (let i = 0; i < chain.length - 1; i++) addSeg(chain[i], chain[i + 1]);
              routes.push(chain);
            });
          });
          // contribution routes: each in-band sink ladders up to the goal — a dummy waypoint only at the
          // layers where a real node actually sits (one the dashed edge could cross), so short bands aren't
          // widened by waypoints at empty layers.
          if (b !== '__orphan') {
            const realLayers = new Set(mem.map(m => Lr(m)));
            mem.filter(sl => !mem.some(m => deps(bySlug[m]).includes(sl))).forEach(sl => {
              const chain = [sl];
              for (let L = Lr(sl) + 1; L <= maxLayer; L++) { if (!realLayers.has(L)) continue; const id = '__g' + b + (dseq++); layerOfId[id] = L; chain.push(id); }
              for (let i = 0; i < chain.length - 1; i++) addSeg(chain[i], chain[i + 1]);
              allGoalRoutes.push({ chain, band: b });
            });
          }
          const byLayer = {};
          Object.keys(layerOfId).forEach(id => { const L = layerOfId[id]; (byLayer[L] = byLayer[L] || []).push(id); });
          const layers = Object.keys(byLayer).map(Number).sort((a, c) => a - c);
          const isDummy = id => id[0] === '_';
          // seed: real nodes alphabetical, dummies after; barycenter then slots them in by connection
          const ord = {}; layers.forEach(L => ord[L] = byLayer[L].slice().sort((a, c) => (isDummy(a) - isDummy(c)) || (a < c ? -1 : a > c ? 1 : 0)));
          const idx = (L, id) => { const a = ord[L]; return a ? a.indexOf(id) : -1; };
          // barycenter sweeps over real+dummy nodes, ordering each by the average slot of its neighbours
          const sweep = (L, nl, nbr) => { ord[L] = ord[L].map((id, i) => { const ns = (nbr[id] || []).map(n => idx(nl, n)).filter(v => v >= 0); return { id, k: ns.length ? mean(ns) : i }; }).sort((a, c) => a.k - c.k).map(o => o.id); };
          for (let it = 0; it < 4; it++) {
            layers.forEach(L => { if (ord[L - 1]) sweep(L, L - 1, segBelow); });               // align to prerequisites below
            layers.slice().reverse().forEach(L => { if (ord[L + 1]) sweep(L, L + 1, segAbove); }); // align to dependents above
          }
          let bw = GW;  // a band is at least as wide as its goal pill — and now accounts for dummy slots
          layers.forEach(L => { bw = Math.max(bw, ord[L].length * NW + (ord[L].length - 1) * GX); });
          layers.forEach(L => {
