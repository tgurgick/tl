<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Throughline</title>
<link rel="icon" href="/logo.png">
<style>
:root {
  --bg: #f7f6f3;
  --card: #fffefb;
  --lane: rgba(47,46,43,.035);
  --ink: #2f2e2b;
  --muted: #8a877f;
  --faint: #b9b6ae;
  --line: rgba(47,46,43,.08);
  --line-strong: rgba(47,46,43,.16);
  --accent: #3b3a36;
  /* priority ramp */
  --p0: #a64b31;
  --p1: #8f6f33;
  --p2: #8a877f;
  --p3: #b9b6ae;
  /* stage */
  --stage-triage: #8a877f;
  --stage-ready: #466b68;
  --stage-progress: #8f6f33;
  --stage-done: #4e7156;
  /* change semantics */
  --add: #4e7156;
  --del: #a64b31;
  --mod: #8f6f33;
  --add-bg: rgba(95,132,104,.13);
  --del-bg: rgba(180,84,58,.10);
  --heat-rgb: 201,163,92;
  /* terminal (always dark, both modes) */
  --term-bg: #201f1c;
  --term-line: rgba(255,255,255,.07);
  --term-dim: #6b6962;
  --term-mid: #8f8c84;
  --term-text: #b8b5ac;
  --term-bright: #cfccc2;
  --term-live: #6f9a7b;
  --term-alert: #b4543a;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161614;
    --card: #1e1d1a;
    --lane: rgba(233,231,225,.04);
    --ink: #e9e7e1;
    --muted: #8f8c84;
    --faint: #5c5a54;
    --line: rgba(233,231,225,.08);
    --line-strong: rgba(233,231,225,.18);
    --accent: #d8d6cf;
    --p0: #d4795f;
    --p1: #c9a35c;
    --p2: #8f8c84;
    --p3: #5c5a54;
    --stage-triage: #8f8c84;
    --stage-ready: #7fa6a3;
    --stage-progress: #c9a35c;
    --stage-done: #8fb59a;
    --add: #8fb59a;
    --del: #d4795f;
    --mod: #c9a35c;
    --add-bg: rgba(111,154,123,.16);
    --del-bg: rgba(212,121,95,.13);
  }
}
* { box-sizing: border-box; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
body.on-live.term-open { padding-bottom: 230px; }
body.on-live { padding-bottom: 44px; }
a { color: inherit; }

.app { display: flex; }

/* file tree sidebar — Live Look only */
.side {
  display: none;
  width: 240px; flex: none; position: sticky; top: 0; align-self: flex-start;
  height: calc(100vh - 44px); overflow-y: auto;
  border-right: 1px solid var(--line); background: var(--lane);
  padding: 24px 10px 40px 14px;
  flex-direction: column;
}
body.on-live .side { display: flex; }
body.on-live.term-open .side { height: calc(100vh - 230px); }
body.side-closed .side { display: none !important; }
.side .label { display: block; padding: 0 6px 12px; }
.tn {
  display: flex; align-items: center; gap: 5px; padding: 2.5px 7px;
  border-radius: 6px; font-size: 13px; cursor: pointer; color: var(--ink);
  white-space: nowrap;
}
.tn:hover { background: rgba(47,46,43,.05); }
@media (prefers-color-scheme: dark) { .tn:hover { background: rgba(233,231,225,.06); } }
.tn .arr { width: 11px; flex: none; color: var(--faint); font-size: 9px; transition: transform .12s; }
.tn.x .arr { transform: rotate(90deg); }
.tn.dirn { color: var(--muted); font-weight: 500; }
.tn.rootn { color: var(--ink); font-weight: 500; }
.tn .nm { overflow: hidden; text-overflow: ellipsis; }
.tn .st { margin-left: auto; flex: none; font: 10px ui-monospace, Menlo, monospace; }
.st.A { color: var(--add); }
.st.M { color: var(--mod); }
.st.D { color: var(--del); }
.tn.flash { animation: treeflash 1.4s ease-out; }
@keyframes treeflash { 0% { background: rgba(var(--heat-rgb), .30); } 100% { background: transparent; } }
.tkids { padding-left: 15px; }

.wrap { flex: 1; min-width: 0; max-width: 1180px; margin: 0 auto; padding: 26px 32px 60px; }

header { display: flex; align-items: center; gap: 13px; margin-bottom: 28px; }
header .name { font-size: 17px; font-weight: 500; letter-spacing: -0.2px; }
header .spacer { flex: 1; }
.fork-toggle {
  background: none; border: none; cursor: pointer; display: none;
  color: var(--muted); font: 17px/1 inherit; padding: 4px 6px 4px 0;
}
body.on-live .fork-toggle { display: block; }
.fork-toggle:hover { color: var(--ink); }
.fork-toggle span { display: inline-block; transform: scaleX(-1); }

/* project multi-select */
.msel { position: relative; }
.msel > button {
  background: var(--card); border: 1px solid var(--line-strong); color: var(--ink);
  border-radius: 10px; padding: 7px 14px; font: inherit; font-size: 14px; cursor: pointer;
}
.msel-panel {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 6;
  background: var(--card); border: 1px solid var(--line-strong); border-radius: 12px;
  padding: 7px; min-width: 220px; display: none;
  box-shadow: 0 10px 30px rgba(20,19,17,.10);
}
.msel.open .msel-panel { display: block; }
.msel-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px;
  border-radius: 8px; font-size: 14px; cursor: pointer;
}
.msel-item:hover { background: var(--lane); }
.msel-item input { accent-color: var(--accent); }
.msel-item .ex { color: var(--faint); font-size: 12px; }

.tabs { display: flex; gap: 26px; border-bottom: 1px solid var(--line); margin-bottom: 26px; }
.tab {
  background: none; border: none; font: inherit; font-size: 14px; color: var(--muted);
  padding: 0 1px 11px; cursor: pointer; border-bottom: 1.5px solid transparent; margin-bottom: -1px;
}
.tab:hover { color: var(--ink); }
.tab.active { color: var(--ink); border-color: var(--ink); }
.tab .dotn {
  display: none; width: 6px; height: 6px; border-radius: 50%;
  background: rgb(var(--heat-rgb)); margin-left: 7px; vertical-align: 2px;
}
.tab.unseen .dotn { display: inline-block; }

.label {
  font-size: 11px; font-weight: 500; letter-spacing: 1.4px; text-transform: uppercase;
  color: var(--muted);
}

/* resume */
.res-block { border-top: 1px solid var(--line); padding: 20px 0 14px; }
.res-block:first-child { border-top: none; padding-top: 0; }
.res-ws { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }
.res-focus { font-size: 15px; font-weight: 500; }
.res-focus .w { color: var(--faint); font-weight: 400; font-size: 13px; margin-left: 8px; }
.res-logic { font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
.res-sec { display: block; margin: 18px 0 4px; }
.res-row {
  display: flex; align-items: baseline; gap: 12px; padding: 9px 4px;
  border-bottom: 1px solid var(--line); cursor: pointer;
}
.res-row:hover { background: var(--lane); }
.res-row .t { font-size: 14px; font-weight: 500; }
.res-row .sub { font-size: 12.5px; color: var(--muted); }
.res-row .why { margin-left: auto; font-size: 12px; color: var(--muted); flex: none; }
.parked { font-size: 12.5px; color: var(--muted); margin-top: 14px; }
.pill {
  font-size: 11px; letter-spacing: .3px; color: var(--muted); flex: none;
  border: 1px solid var(--line-strong); border-radius: 999px; padding: 1.5px 9px;
}
.pill.p0 { color: var(--p0); border-color: var(--p0); }
.pill.p1 { color: var(--p1); border-color: var(--p1); }
.pill.q { color: var(--p1); border-color: var(--p1); }
.pill.done { color: var(--stage-done); border-color: var(--stage-done); }

/* board: swimlanes */
.cols-head { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding-bottom: 10px; }
.cols-head .label { padding-left: 4px; }
.swimlane { border-top: 1px solid var(--line); padding: 15px 0 20px; }
.lane-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.lane-title { font-size: 14px; font-weight: 500; }
.lane-proj { color: var(--muted); font-weight: 400; }
.lane-meta { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); }
.lane-meta .p0flag { color: var(--p0); }
.st-triage { color: var(--stage-triage); }
.st-ready { color: var(--stage-ready); }
.st-in-progress { color: var(--stage-progress); }
.st-done { color: var(--stage-done); }
.progress { width: 64px; height: 3px; background: var(--line); border-radius: 2px; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.lane-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.cell { display: flex; flex-direction: column; gap: 8px; }
.cell-label { display: none; }

.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
  padding: 12px 14px; cursor: pointer; transition: border-color .12s, transform .12s;
  font-size: 14px; font-weight: 500; line-height: 1.4;
}
.card:hover { border-color: var(--line-strong); transform: translateY(-1px); }
.card .dot {
  display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  background: var(--p0); margin-right: 8px; vertical-align: 1px;
}
.card.dim { color: var(--muted); font-weight: 400; }

/* backlog rows (resume bottom) */
.blog-row {
  display: flex; align-items: baseline; gap: 14px; padding: 11px 4px;
  border-bottom: 1px solid var(--line); cursor: pointer;
}
.blog-row:hover { background: var(--lane); }
.rank { font-size: 12px; color: var(--faint); min-width: 20px; text-align: right; font-variant-numeric: tabular-nums; }
.blog-title { font-size: 14px; font-weight: 500; }
.blog-sub { font-size: 12.5px; color: var(--muted); }
.blog-p { margin-left: auto; font-size: 12px; color: var(--p2); letter-spacing: .4px; }
.blog-p.p0 { color: var(--p0); }
.blog-p.p1 { color: var(--p1); }
.blog-p.p3 { color: var(--p3); }
.section-gap { margin-top: 34px; }
.empty { font-size: 13px; color: var(--faint); padding: 8px 4px; }

/* live diff feed */
.diff-card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
  margin-bottom: 14px; overflow: hidden;
}
.diff-head {
  display: flex; align-items: baseline; gap: 12px; padding: 10px 16px;
  border-bottom: 1px solid var(--line); font-size: 12.5px;
}
.diff-head .pth { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.diff-head .pws { color: var(--muted); }
.diff-head .cnt { margin-left: auto; flex: none; font-variant-numeric: tabular-nums; }
.diff-head .cnt .a { color: var(--add); }
.diff-head .cnt .d { color: var(--del); margin-left: 6px; }
.diff-head .tm { color: var(--faint); flex: none; }
.diff-body { font: 12px/1.6 ui-monospace, "SF Mono", Menlo, monospace; padding: 7px 0; overflow-x: auto; }
.dl { padding: 0 16px; white-space: pre; }
.dl.add { background: var(--add-bg); }
.dl.del { background: var(--del-bg); color: var(--muted); }
.dl.ctx { color: var(--muted); }
.dl.gap { color: var(--faint); padding: 2px 16px; }

@media (max-width: 880px) {
  .wrap { padding: 18px 16px 60px; }
  header { flex-wrap: wrap; }
  .side { display: none !important; }
  .cols-head { display: none; }
  .lane-grid { grid-template-columns: 1fr; }
  .cell:empty { display: none; }
  .cell-label { display: block; padding-left: 2px; }
  .lane-meta { gap: 8px; }
  .progress { width: 44px; }
  .blog-row, .res-row { flex-wrap: wrap; row-gap: 2px; }
}

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(20,19,17,.32); opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 7; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 92vw); z-index: 8;
  background: var(--card); border-left: 1px solid var(--line);
  transform: translateX(102%); transition: transform .22s cubic-bezier(.3,.8,.3,1);
  overflow-y: auto; padding: 30px 34px 60px;
}
.open .scrim { opacity: 1; pointer-events: auto; }
.open .drawer { transform: none; }
.drawer .path { font-size: 12px; color: var(--faint); font-family: ui-monospace, "SF Mono", Menlo, monospace; margin-bottom: 10px; }
.drawer h2 { font-size: 19px; font-weight: 500; letter-spacing: -0.2px; margin-bottom: 14px; }
.drawer .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 24px; }
.md { font-size: 14.5px; }
.md h1, .md h2, .md h3 { font-size: 13px; font-weight: 500; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin: 26px 0 10px; }
.md p { margin: 0 0 12px; }
.md ul { margin: 0 0 12px; padding-left: 20px; }
.md li { margin-bottom: 4px; }
.md code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; background: var(--line); border-radius: 5px; padding: 1.5px 5px; }
.md pre { background: var(--line); border-radius: 10px; padding: 14px 16px; overflow-x: auto; margin: 0 0 12px; }
.md pre code { background: none; padding: 0; }
.md table { border-collapse: collapse; margin: 0 0 14px; width: 100%; font-size: 13.5px; }
.md th { text-align: left; font-weight: 500; color: var(--muted); }
.md th, .md td { border-bottom: 1px solid var(--line); padding: 6px 10px 6px 0; }
.md blockquote { border-left: 2px solid var(--line-strong); padding-left: 14px; color: var(--muted); margin: 0 0 12px; }
.md input[type=checkbox] { accent-color: var(--accent); margin-right: 6px; }
.footnote { margin-top: 60px; text-align: center; font-size: 12px; color: var(--faint); }

/* activity terminal — Live Look only */
.term {
  display: none;
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 4;
  background: var(--term-bg); color: var(--term-text); border-top: 1px solid var(--term-line);
  font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px;
}
body.on-live .term { display: block; }
.term-bar {
  display: flex; align-items: center; gap: 10px; padding: 9px 20px; cursor: pointer;
  user-select: none;
}
.term-bar .label { color: var(--term-mid); }
.term-dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--term-live);
  animation: pulse 2.4s ease-in-out infinite;
}
.term-dot.off { background: var(--term-alert); animation: none; }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
.term-bar .chev { margin-left: auto; color: var(--term-dim); transition: transform .15s; }
body.term-open .chev { transform: rotate(180deg); }
.term-body { display: none; height: 178px; overflow-y: auto; padding: 2px 20px 14px; }
body.term-open .term-body { display: block; }
.tl-line { padding: 1.5px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-time { color: var(--term-dim); margin-right: 12px; }
.tl-ws { color: var(--term-mid); margin-right: 12px; }
.tl-msg { color: var(--term-bright); }
.tl-msg.gone { color: var(--term-mid); text-decoration: line-through; }
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side">
  <span class="label">Files</span>
  <div id="tree"></div>
</aside>

<div class="wrap">
  <header>
    <button id="sideToggle" class="fork-toggle" title="Toggle file tree" aria-label="Toggle file tree"><span>⌥</span></button>
    <span class="name">Throughline</span>
    <span class="spacer"></span>
    <div class="msel" id="msel">
      <button id="wsBtn" aria-haspopup="true">projects</button>
      <div class="msel-panel" id="wsPanel"></div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-view="resume" role="tab">Resume</button>
    <button class="tab" data-view="live" role="tab" id="liveTab">Live Look<span class="dotn"></span></button>
  </nav>

  <section id="view-resume"></section>
  <section id="view-live" hidden>
    <div id="board"></div>
    <span class="label section-gap" style="display:block;margin-bottom:12px">Recent changes</span>
    <div id="liveFeed"></div>
  </section>

  <div class="footnote">read-only — every change is a file edit · git is the database</div>
</div>
</div>

<div class="term" id="term">
  <div class="term-bar" id="termBar">
    <span class="term-dot off" id="termDot"></span>
    <span class="label">Activity</span>
    <span class="chev">▾</span>
  </div>
  <div class="term-body" id="termBody"></div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Detail"></aside>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PRIO = { p0: 0, p1: 1, p2: 2, p3: 3 };

// --- tiny markdown renderer ---
function inline(s) {
  return s
    .replace(/`([^`]+)`/g, (_, c) => '<code>' + c + '</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src) {
  const lines = esc(src).split('\n');
  let html = '', i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) {
      let code = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
      i++;
      html += '<pre><code>' + code.join('\n') + '</code></pre>';
    } else if (/^#{1,4}\s/.test(l)) {
      const level = Math.min(l.match(/^#+/)[0].length, 3);
      html += `<h${level}>` + inline(l.replace(/^#+\s*/, '')) + `</h${level}>`;
      i++;
    } else if (/^\s*[-*]\s/.test(l)) {
      let items = [];
      while (i < lines.length && /^\s*[-*]\s/.test(lines[i])) {
        let it = lines[i].replace(/^\s*[-*]\s/, '');
        it = it.replace(/^\[([ xX])\]\s*/, (_, c) =>
          `<input type="checkbox" disabled${c.trim() ? ' checked' : ''}>`);
        items.push('<li>' + inline(it) + '</li>'); i++;
      }
      html += '<ul>' + items.join('') + '</ul>';
    } else if (/^\|/.test(l)) {
      let rows = [];
      while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i]); i++; }
      const cells = r => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      let t = '<table>';
      rows.forEach((r, idx) => {
        if (/^\|[\s:|-]+\|$/.test(r)) return;
        const tag = idx === 0 ? 'th' : 'td';
        t += '<tr>' + cells(r).map(c => `<${tag}>` + inline(c) + `</${tag}>`).join('') + '</tr>';
      });
      html += t + '</table>';
    } else if (/^>\s?/.test(l)) {
      let q = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) { q.push(lines[i].replace(/^>\s?/, '')); i++; }
      html += '<blockquote>' + inline(q.join(' ')) + '</blockquote>';
    } else if (/^---+\s*$/.test(l)) { html += '<hr>'; i++; }
    else if (!l.trim()) { i++; }
    else {
      let p = [];
      while (i < lines.length && lines[i].trim() && !/^(#|```|\||>|---|\s*[-*]\s)/.test(lines[i])) { p.push(lines[i]); i++; }
      html += '<p>' + inline(p.join(' ')) + '</p>';
    }
  }
  return html;
}

// --- drawer ---
function openDrawer(item) {
  const meta = item.meta || {};
  let pills = '';
  const p = (meta.priority || '').toLowerCase();
  if (p) pills += `<span class="pill ${p}">${esc(p.toUpperCase())}</span>`;
  for (const k of ['type', 'size', 'status']) if (meta[k]) pills += `<span class="pill">${esc(String(meta[k]).replace('_',' '))}</span>`;
  if (meta.origin) pills += `<span class="pill">from ${esc(meta.origin)}</span>`;
  if (item._ws) pills += `<span class="pill">${esc(item._ws)}</span>`;
  const body = (item.body || '').replace(/^\s*# .*\n+/, '');
  $('drawer').innerHTML = `
    <div class="path">${esc(item.path || '')}</div>
    <h2>${esc(item.title)}</h2>
    <div class="meta">${pills}</div>
    <div class="md">${md(body)}</div>`;
  document.body.classList.add('open');
}
$('scrim').onclick = () => document.body.classList.remove('open');
addEventListener('keydown', e => { if (e.key === 'Escape') document.body.classList.remove('open'); });

async function openFile(ws, rel) {
  const r = await fetch(`/api/file?ws=${encodeURIComponent(ws)}&path=${encodeURIComponent(rel)}`);
  if (!r.ok) return;
  const f = await r.json();
  const isMd = /\.md$/.test(rel);
  openDrawer({
    path: rel, _ws: ws,
    title: rel.split('/').pop(),
    meta: {},
    body: isMd ? f.content : '```\n' + f.content + '\n```',
  });
}

// --- resume ---
function resRow(opts) {
  const el = document.createElement('div');
  el.className = 'res-row';
  el.innerHTML = `<span class="t">${esc(opts.title)}</span>` +
    (opts.pill ? `<span class="pill ${opts.pillClass || ''}">${esc(opts.pill)}</span>` : '') +
    (opts.sub ? `<span class="sub">${esc(opts.sub)}</span>` : '') +
    (opts.why ? `<span class="why">${esc(opts.why)}</span>` : '');
  if (opts.onclick) el.onclick = opts.onclick;
  return el;
}

function renderResume(wss) {
  const root = $('view-resume');
  root.innerHTML = '';
  const multi = wss.length > 1;

  for (const ws of wss) {
    const block = document.createElement('div');
    block.className = 'res-block';
    if (multi) block.innerHTML = `<div class="res-ws">${esc(ws.name)}</div>`;

    // focus
    const goals = (ws.config && ws.config.goals) || [];
    if (goals.length) {
      const top = goals.slice().sort((a, b) => (b.weight || 0) - (a.weight || 0))[0];
      const alloc = (ws.config && ws.config.allocation) || {};
      const mix = ['bugs', 'features', 'tech_debt', 'research'].filter(k => alloc[k] != null)
        .map(k => `${k.replace('tech_', '')} ${Math.round(alloc[k] * 100)}`).join(' · ');
      block.innerHTML += `<div class="res-focus">◎ ${esc(top.description || top.id)}<span class="w">${(top.weight ?? 0).toFixed(2)}</span></div>
        <div class="res-logic">${((ws.config && ws.config.rules) || []).length} rules · ${mix}</div>`;
    }

    const specs = ws.specs.map(s => ({ ...s, _ws: ws.name }));
    const threads = (ws.threads || []).map(t => ({ ...t, _ws: ws.name }));
    const inprog = specs.filter(s => s.stage === 'in-progress');
    const ready = specs.filter(s => s.stage === 'ready')
      .sort((a, b) => (PRIO[a.meta.priority] ?? 9) - (PRIO[b.meta.priority] ?? 9));
    const openLoops = [
      ...threads.filter(t => ['question', 'decision', 'risk'].includes(t.meta.type) && t.meta.status === 'open'),
      ...specs.filter(s => s.meta.status === 'blocked').map(s => ({ ...s, _loop: 'blocked spec' })),
      ...specs.filter(s => s.stage === 'done' && !s.feedback).map(s => ({ ...s, _loop: 'feedback missing' })),
    ];

    // recommended next (mirrors /tl resume rules)
    let next = null, why = '';
    const openQ = threads.find(t => t.meta.type === 'question' && t.meta.status === 'open');
    if (inprog.length) { next = inprog.slice().sort((a, b) => a.mtime - b.mtime)[0]; why = 'finish what’s started'; }
    else if (openQ) { next = openQ; why = 'open loop before new work'; }
    else if (ready.length) { next = ready[0]; why = 'top of the priority stack'; }
    if (next) {
      block.innerHTML += `<span class="label res-sec">Recommended next</span>`;
      block.appendChild(resRow({
        title: next.title, why,
        pill: next.meta.priority ? next.meta.priority.toUpperCase() : (next.meta.type || ''),
        pillClass: (next.meta.priority || (next.meta.type === 'question' ? 'q' : '')).toLowerCase(),
        onclick: () => openDrawer(next),
      }));
    }

    // open loops
    block.innerHTML += `<span class="label res-sec">Open loops</span>`;
    if (!openLoops.length) block.innerHTML += '<div class="empty">none — nothing unresolved</div>';
    openLoops.slice(0, 6).forEach(l => block.appendChild(resRow({
      title: l.title,
      pill: l._loop || l.meta.type, pillClass: l.meta.type === 'question' ? 'q' : '',
      onclick: () => openDrawer(l),
    })));

    // recent: decisions + completions
    const recent = [
      ...threads.filter(t => t.meta.type === 'decision').map(t => ({ ...t, _kind: 'decision' })),
      ...specs.filter(s => s.stage === 'done').map(s => ({ ...s, _kind: 'done' })),
    ].sort((a, b) => b.mtime - a.mtime).slice(0, 5);
    block.innerHTML += `<span class="label res-sec">Recent</span>`;
    if (!recent.length) block.innerHTML += '<div class="empty">no activity yet</div>';
    recent.forEach(r => block.appendChild(resRow({
      title: r.title,
      pill: r._kind, pillClass: r._kind === 'done' ? 'done' : '',
      onclick: () => openDrawer(r),
    })));

    // parked
    const parked = threads.filter(t => t.meta.status === 'parked');
    if (parked.length) {
      const byType = {};
      parked.forEach(t => { byType[t.meta.type] = (byType[t.meta.type] || 0) + 1; });
      const breakdown = Object.entries(byType).map(([k, n]) => `${n} ${k}${n > 1 ? 's' : ''}`).join(', ');
      const p = document.createElement('div');
      p.className = 'parked';
      p.textContent = `${parked.length} parked thread${parked.length > 1 ? 's' : ''} (${breakdown})`;
      p.style.cursor = 'pointer';
      p.onclick = () => openDrawer({
        title: 'Parked threads', path: ws.name + '/threads/', _ws: ws.name,
        meta: {},
        body: parked.map(t => `- **${t.title}** (${t.meta.type}) — ${t.path}`).join('\n'),
      });
      block.appendChild(p);
    }

    root.appendChild(block);
  }

  // combined backlog
  const backlogWrap = document.createElement('div');
  backlogWrap.innerHTML = `<span class="label section-gap" style="display:block;margin-bottom:6px">Backlog</span>`;
  const all = [];
  for (const ws of wss) for (const s of ws.specs) { s._ws = ws.name; all.push(s); }
  const ranked = all.filter(s => s.stage === 'ready')
    .sort((a, b) => (PRIO[a.meta.priority] ?? 9) - (PRIO[b.meta.priority] ?? 9) || a.title.localeCompare(b.title));
  const untriaged = all.filter(s => s.stage === 'triage');
  if (!ranked.length && !untriaged.length) backlogWrap.innerHTML += '<div class="empty">Backlog is empty.</div>';
  const intentName = s => {
    const ws = wss.find(w => w.name === s._ws);
    const ip = (s.meta.intent || '').replace(/^\.\//, '').trim();
    const it = ws && ws.intents.find(i => i.path === ip);
    return it ? it.title : null;
  };
  const blogRow = (s, n) => {
    const el = document.createElement('div');
    el.className = 'blog-row';
    const sub = [intentName(s), multi ? s._ws : null].filter(Boolean).join(' · ');
    const p = (s.meta.priority || '').toLowerCase();
    el.innerHTML = `<span class="rank">${n ?? ''}</span>
      <span class="blog-title">${esc(s.title)}</span>
      ${sub ? `<span class="blog-sub">${esc(sub)}</span>` : ''}
      <span class="blog-p ${p}">${esc(p.toUpperCase())}</span>`;
    el.onclick = () => openDrawer(s);
    return el;
  };
  ranked.forEach((s, i) => backlogWrap.appendChild(blogRow(s, i + 1)));
  untriaged.forEach(s => backlogWrap.appendChild(blogRow(s)));
  root.appendChild(backlogWrap);
}

// --- board (swimlanes, Live Look) ---
const STAGES = ['triage', 'ready', 'in-progress', 'done'];
const STAGE_NAMES = { triage: 'Triage', ready: 'Ready', 'in-progress': 'In progress', done: 'Done' };

function specCard(s) {
  const el = document.createElement('div');
  el.className = 'card' + (s.meta.status === 'blocked' ? ' dim' : '');
  el.innerHTML = (s.meta.priority === 'p0' ? '<span class="dot"></span>' : '') + esc(s.title);
  el.onclick = () => openDrawer(s);
  return el;
}

function renderBoard(wss) {
  const root = $('board');
  root.innerHTML = '';
  const multi = wss.length > 1;

  const head = document.createElement('div');
  head.className = 'cols-head';
  head.innerHTML = STAGES.map(s => `<span class="label st-${s}">${STAGE_NAMES[s]}</span>`).join('');
  root.appendChild(head);

  const lanes = [];
  for (const ws of wss) for (const intent of ws.intents) lanes.push({ ws: ws.name, intent, specs: [] });
  const unattached = { ws: null, intent: null, specs: [] };
  for (const ws of wss) {
    for (const s of ws.specs) {
      s._ws = ws.name;
      const ip = (s.meta.intent || '').replace(/^\.\//, '').trim();
      const lane = ip && lanes.find(l => l.ws === ws.name && l.intent.path === ip);
      (lane || unattached).specs.push(s);
    }
  }
  lanes.sort((a, b) =>
    (PRIO[a.intent.meta.priority] ?? 9) - (PRIO[b.intent.meta.priority] ?? 9) ||
    a.intent.title.localeCompare(b.intent.title));
  if (unattached.specs.length) lanes.push(unattached);

  if (!lanes.length) {
    root.innerHTML += '<div class="empty">Nothing here yet — run /tl:new to start a project.</div>';
    return;
  }

  for (const lane of lanes) {
    const el = document.createElement('div');
    el.className = 'swimlane';
    const total = lane.specs.length;
    const done = lane.specs.filter(s => s.stage === 'done').length;
    const p0 = lane.specs.filter(s => s.meta.priority === 'p0' && s.stage !== 'done').length;
    const top = document.createElement('div');
    top.className = 'lane-top';
    const title = lane.intent
      ? `${multi ? `<span class="lane-proj">${esc(lane.ws)} / </span>` : ''}<span class="lane-title">${esc(lane.intent.title)}</span>`
      : '<span class="lane-title" style="color:var(--muted)">Unattached</span>';
    top.innerHTML = `${title}
      <span class="lane-meta">
        ${p0 ? `<span class="p0flag">${p0} p0</span>` : ''}
        ${total ? `<span>${done}/${total} done</span><span class="progress"><i style="width:${Math.round(done / total * 100)}%${done === total ? ';background:var(--stage-done)' : ''}"></i></span>` : '<span>no specs yet</span>'}
      </span>`;
    if (lane.intent) {
      top.style.cursor = 'pointer';
      top.onclick = e => { if (!e.target.closest('.lane-meta')) openDrawer({ ...lane.intent, _ws: lane.ws }); };
    }
    el.appendChild(top);

    const grid = document.createElement('div');
    grid.className = 'lane-grid';
    for (const stage of STAGES) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const items = lane.specs.filter(s => s.stage === stage);
      if (items.length) {
        const lbl = document.createElement('div');
        lbl.className = 'cell-label label st-' + stage;
        lbl.textContent = STAGE_NAMES[stage];
        cell.appendChild(lbl);
        items.forEach(s => cell.appendChild(specCard(s)));
      }
      grid.appendChild(cell);
    }
    el.appendChild(grid);
    root.appendChild(el);
  }
}

// --- live diff feed ---
let liveDiffs = [];
function diffCard(d, multi) {
  const el = document.createElement('div');
  el.className = 'diff-card';
  const t = new Date(d.ts).toLocaleTimeString('en-GB', { hour12: false });
  const lines = (d.hunks || []).map(h => {
    if (h.t === '.') return `<div class="dl gap">⋯ ${h.n} unchanged lines</div>`;
    const cls = h.t === '+' ? 'add' : h.t === '-' ? 'del' : 'ctx';
    return `<div class="dl ${cls}">${esc(h.t === ' ' ? '  ' : h.t + ' ')}${esc(h.s)}</div>`;
  }).join('');
  el.innerHTML = `
    <div class="diff-head">
      <span class="pth">${multi ? `<span class="pws">${esc(d.ws)} / </span>` : ''}${esc(d.path)}</span>
      <span class="cnt">${d.added ? `<span class="a">+${d.added}</span>` : ''}${d.removed ? `<span class="d">−${d.removed}</span>` : ''}</span>
      <span class="tm">${t}</span>
    </div>
    <div class="diff-body">${lines || '<div class="dl ctx">(no line detail)</div>'}</div>`;
  return el;
}
function renderLive() {
  const root = $('liveFeed');
  root.innerHTML = '';
  const mine = liveDiffs.filter(d => selected.includes(d.ws));
  if (!mine.length) {
    root.innerHTML = '<div class="empty">No changes yet this session — file edits will stream here live.</div>';
    return;
  }
  const multi = selected.length > 1;
  mine.slice(0, 20).forEach(d => root.appendChild(diffCard(d, multi)));
}

// --- file tree sidebar ---
let expanded;
try { expanded = new Set(JSON.parse(localStorage.getItem('tl-tree-x') || '[]')); } catch { expanded = new Set(); }
let expandedInit = expanded.size > 0;
const changedMap = new Map();
let treeData = [];

const heat = new Map();
const HEAT_RGB = getComputedStyle(document.documentElement).getPropertyValue('--heat-rgb').trim() || '201,163,92';
function heatColor(h) { return `rgba(${HEAT_RGB},${(h * 0.30).toFixed(3)})`; }
function applyHeat(key) {
  const row = document.querySelector(`.tn[data-key="${CSS.escape(key)}"]`);
  if (row) row.style.background = heat.has(key) ? heatColor(heat.get(key)) : '';
}
function warm(key) {
  heat.set(key, Math.min(1, (heat.get(key) || 0) * 0.7 + 0.4));
  applyHeat(key);
}
setInterval(() => {
  for (const [key, h] of heat) {
    const next = h * 0.86;
    if (next < 0.05) heat.delete(key); else heat.set(key, next);
    applyHeat(key);
  }
}, 4000);

function saveExpanded() { localStorage.setItem('tl-tree-x', JSON.stringify([...expanded])); }

function treeNode(ws, node, depth) {
  const key = ws + '|' + node.path;
  const el = document.createElement('div');
  if (node.dir) {
    const isX = expanded.has(key);
    const row = document.createElement('div');
    row.className = 'tn ' + (depth === 0 ? 'rootn' : 'dirn') + (isX ? ' x' : '');
    row.dataset.key = key;
    row.innerHTML = `<span class="arr">▶</span><span class="nm">${esc(node.name)}</span>`;
    row.onclick = () => {
      if (expanded.has(key)) expanded.delete(key); else expanded.add(key);
      saveExpanded(); renderTree();
    };
    el.appendChild(row);
    if (isX && node.children && node.children.length) {
      const kids = document.createElement('div');
      kids.className = 'tkids';
      node.children.forEach(c => kids.appendChild(treeNode(ws, c, depth + 1)));
      el.appendChild(kids);
    }
  } else {
    const st = changedMap.get(key);
    const row = document.createElement('div');
    row.className = 'tn';
    row.dataset.key = key;
    row.innerHTML = `<span class="arr"></span><span class="nm">${esc(node.name)}</span>` +
      (st ? `<span class="st ${st}">${st}</span>` : '');
    if (heat.has(key)) row.style.background = heatColor(heat.get(key));
    row.onclick = () => openFile(ws, node.path);
    el.appendChild(row);
  }
  return el;
}

function renderTree() {
  const root = $('tree');
  root.innerHTML = '';
  for (const t of treeData) {
    const rootKey = t.name + '|';
    if (!expandedInit) {
      expanded.add(rootKey);
      t.tree.filter(n => n.dir).forEach(n => expanded.add(t.name + '|' + n.path));
    }
    root.appendChild(treeNode(t.name, { name: t.name, path: '', dir: true, children: t.tree }, 0));
  }
  if (!expandedInit) { expandedInit = true; saveExpanded(); renderTree(); }
}

async function loadTrees() {
  treeData = await Promise.all(selected.map(n =>
    fetch('/api/tree?ws=' + encodeURIComponent(n)).then(r => r.json())));
  renderTree();
}

async function seedChanges() {
  const list = await (await fetch('/api/changes')).json();
  for (const c of list) changedMap.set(c.ws + '|' + c.path, c.status);
  liveDiffs = await (await fetch('/api/diffs')).json();
}

$('sideToggle').onclick = () => {
  document.body.classList.toggle('side-closed');
  localStorage.setItem('tl-side', document.body.classList.contains('side-closed') ? '0' : '1');
};
if (localStorage.getItem('tl-side') === '0') document.body.classList.add('side-closed');

// --- tabs ---
function setView(view) {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  $('view-resume').hidden = view !== 'resume';
  $('view-live').hidden = view !== 'live';
  document.body.classList.toggle('on-live', view === 'live');
  localStorage.setItem('tl-view', view);
  if (view === 'live') { $('liveTab').classList.remove('unseen'); renderLive(); }
}
document.querySelectorAll('.tab').forEach(btn => { btn.onclick = () => setView(btn.dataset.view); });
if (localStorage.getItem('tl-view') === 'live') setView('live');

// --- activity terminal ---
const termBody = $('termBody');
let termLines = 0;
function termLog(ws, msg, opts = {}) {
  const t = new Date().toLocaleTimeString('en-GB', { hour12: false });
  const el = document.createElement('div');
  el.className = 'tl-line';
  el.innerHTML = `<span class="tl-time">${t}</span>` +
    (ws ? `<span class="tl-ws">${esc(ws)}</span>` : '') +
    `<span class="tl-msg${opts.gone ? ' gone' : ''}">${esc(msg)}</span>`;
  const stick = termBody.scrollTop + termBody.clientHeight >= termBody.scrollHeight - 24;
  termBody.appendChild(el);
  if (++termLines > 500) { termBody.removeChild(termBody.firstChild); termLines--; }
  if (stick) termBody.scrollTop = termBody.scrollHeight;
}
$('termBar').onclick = () => {
  document.body.classList.toggle('term-open');
  localStorage.setItem('tl-term', document.body.classList.contains('term-open') ? '1' : '0');
  termBody.scrollTop = termBody.scrollHeight;
};
if (localStorage.getItem('tl-term') !== '0') document.body.classList.add('term-open');

// --- events ---
const NOISE_DIRS = ['specs', 'in-progress', 'done', 'triage', 'intents', 'threads', '_metrics', 'context', 'outcome'];
function describeEvent(e) {
  if (!e.log && e.exists && !/\.\w+$/.test(e.path)) {
    const segs = e.path.split('/');
    if (NOISE_DIRS.includes(segs[segs.length - 1])) return null;
    return `spec folder → ${e.path}`;
  }
  if (e.log) {
    const l = e.log.line || {};
    switch (e.log.file) {
      case 'triage-log': return `triage run — ${l.total ?? '?'} specs ranked, ${l.overrides_detected ?? 0} overrides detected`;
      case 'override-log': return `override: ${l.spec} ${l.from} → ${l.to}`;
      case 'capture-log': return `bug captured → ${l.spec} (${l.affected_users ?? '?'} users)`;
      case 'dedup-log': return `dedup — merged ${l.merged ?? 0}, auto-closed ${l.auto_closed ?? 0}, flagged ${(l.flagged_dupes ?? 0) + (l.flagged_stale ?? 0)}`;
      case 'cycle-log': return `spec completed → ${l.spec}`;
      default: return `${e.log.file}.jsonl +1 line`;
    }
  }
  if (/^threads\//.test(e.path)) {
    if (!e.exists) return `thread removed — ${e.path}`;
    return (e.change && e.change.status === 'A' ? 'thread captured — ' : 'thread updated — ') + e.path;
  }
  if (/priorities\.md$/.test(e.path)) return e.exists ? 'priorities.md rewritten' : 'priorities.md removed';
  if (!e.exists) return `removed ${e.path}`;
  if (/SPEC\.md$/.test(e.path)) return `spec updated — ${e.path}`;
  if (/^intents\//.test(e.path)) return `intent updated — ${e.path}`;
  if (/feedback\.md$/.test(e.path)) return `feedback written — ${e.path}`;
  if (/triage\.yml$/.test(e.path)) return 'triage.yml edited — logic changed';
  return `updated ${e.path}`;
}

let refreshTimer = null;
function connectEvents() {
  const es = new EventSource('/api/events');
  es.onopen = () => { $('termDot').classList.remove('off'); termLog(null, 'watching for changes…'); };
  es.onerror = () => $('termDot').classList.add('off');
  let lastMsg = '', lastAt = 0;
  es.onmessage = ev => {
    let e; try { e = JSON.parse(ev.data); } catch { return; }
    if (!e.path && !e.log) return;
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(() => { loadSelected(); loadTrees(); }, 600);
    if (e.exists && /\.(md|yml|yaml|jsonl)$/.test(e.path || '') && !e.change) return;

    if (e.change) {
      const key = e.ws + '|' + e.path;
      changedMap.set(key, e.change.status);
      const row = document.querySelector(`.tn[data-key="${CSS.escape(key)}"]`);
      if (row) {
        row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash');
        let st = row.querySelector('.st');
        if (!st) { st = document.createElement('span'); st.className = 'st'; row.appendChild(st); }
        st.className = 'st ' + e.change.status;
        st.textContent = e.change.status;
      }
      warm(key);
    }
    if (e.diff && selected.includes(e.ws)) {
      liveDiffs.unshift(e.diff);
      if (liveDiffs.length > 60) liveDiffs.pop();
      if (localStorage.getItem('tl-view') === 'live') renderLive();
      else $('liveTab').classList.add('unseen');
    }

    const msg = describeEvent(e);
    if (!msg) return;
    const sig = e.ws + '|' + msg;
    if (sig === lastMsg && Date.now() - lastAt < 2500) return;
    lastMsg = sig; lastAt = Date.now();
    termLog(e.ws, msg, { gone: !e.exists });
  };
}

// --- project selection + boot ---
let available = [], selected = [];

function syncButton() {
  $('wsBtn').textContent = selected.length === 1 ? selected[0] : `${selected.length} projects`;
}
async function loadSelected() {
  const wss = await Promise.all(selected.map(n =>
    fetch('/api/ws/' + encodeURIComponent(n)).then(r => r.json())));
  renderResume(wss);
  renderBoard(wss);
  syncButton();
}
function buildPanel() {
  $('wsPanel').innerHTML = '';
  available.forEach(w => {
    const l = document.createElement('label');
    l.className = 'msel-item';
    l.innerHTML = `<input type="checkbox" ${selected.includes(w.name) ? 'checked' : ''}>
      <span>${esc(w.name)}</span>${w.example ? '<span class="ex">example</span>' : ''}`;
    l.querySelector('input').onchange = e => {
      if (e.target.checked) selected.push(w.name);
      else selected = selected.filter(n => n !== w.name);
      if (!selected.length) { selected = [w.name]; e.target.checked = true; return; }
      localStorage.setItem('tl-sel', JSON.stringify(selected));
      loadSelected();
      loadTrees();
      renderLive();
    };
    $('wsPanel').appendChild(l);
  });
}
$('wsBtn').onclick = () => $('msel').classList.toggle('open');
addEventListener('click', e => { if (!e.target.closest('.msel')) $('msel').classList.remove('open'); });

async function boot() {
  connectEvents();
  available = await (await fetch('/api/workspaces')).json();
  if (!available.length) { $('view-resume').innerHTML = '<div class="empty">No workspaces found — run /tl:new</div>'; return; }
  try { selected = JSON.parse(localStorage.getItem('tl-sel') || '[]').filter(n => available.some(w => w.name === n)); }
  catch { selected = []; }
  if (!selected.length) selected = [available[0].name];
  buildPanel();
  addEventListener('focus', loadSelected);
  await seedChanges();
  await loadSelected();
  await loadTrees();
  if (localStorage.getItem('tl-view') === 'live') renderLive();
}
boot();
</script>
