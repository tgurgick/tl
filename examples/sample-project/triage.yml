# todo-app Triage Configuration
#
# Per-project config: goals, allocation targets, and priority rules.
# The triage skill reads this fresh on each run.

goals:
  - id: v1-launch
    description: "Ship todo-app v1 to the App Store"
    weight: 0.7
    key_results:
      - "Tasks can be created, completed, and deleted"
      - "Tasks persist across app restarts"
      - "Due-date reminders fire reliably"

  - id: stability
    description: "No data-loss bugs in beta"
    weight: 0.3
    key_results:
      - "Zero P0 bugs open"
      - "Crash-free rate > 99%"

allocation:
  bugs: 0.30
  features: 0.50
  tech_debt: 0.10
  research: 0.10
  drift_threshold: 0.15

rules:
  - condition: "type == 'bug' AND affected_users > 10"
    action: "set priority p0"
    reason: "Widespread crashes are always top priority"

  - condition: "blocks_count > 2"
    action: "boost priority by 1 level"
    reason: "Unblock downstream work"

  - condition: "type == 'bug' AND age_days > 14 AND priority != 'p0'"
    action: "flag for review"
    reason: "Stale bugs — close or escalate"
